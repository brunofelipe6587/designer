<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Fagner Davi Estático VIP</title>
<style>
@font-face{font-family:'Montserrat';font-weight:100 900;font-style:normal;src:url('fonts/Montserrat-var.woff2') format('woff2');font-display:block}
@font-face{font-family:'Anton';font-weight:400;font-style:normal;src:url('fonts/Anton-Regular.woff2') format('woff2');font-display:block}
html, body { margin: 0; background: #000; } canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Static ads for the Grupo VIP Black Friday capture — feed 4:5 (1080x1350) and story 9:16 (1080x1920).
// Typography only (client's call): the offer is the image. Black / off-white / sand, condensed type as in the brand's
// own Black Friday warm-up post, the store's diamond mark as a watermark.
// ?fmt=feed|story   &guides=1 draws the safe zones (review only, never for upload)
const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') || 'feed', GUIDES = q.get('guides') === '1';
const W = 1080, H = FMT === 'story' ? 1920 : 1350;
const c = document.getElementById('c'); c.width = W; c.height = H;
const ctx = c.getContext('2d');
const BG = '#0B0B0B', OFF = '#F4F0E8', SAND = '#D8B47E', WA = '#25D366';
// story: Meta keeps ~14% top / ~20% bottom under the profile row and the CTA; feed: plain margins
const SAFE = FMT === 'story' ? { top: 270, bottom: 1920 - 380, side: 64 } : { top: 56, bottom: 1350 - 56, side: 60 };

// baselines / centres in px
const L = FMT === 'story' ? {
  brand: 312, black: 450, blackPx: 140, ate: 560, atePx: 84, pct: 944, pctPx: 400, off: 1102, offPx: 140,
  rule: 1150, sub: 1212, pill: 1290, checks: 1374, cta: 1476,
} : {
  brand: 90, black: 228, blackPx: 130, ate: 326, atePx: 72, pct: 680, pctPx: 360, off: 822, offPx: 120,
  rule: 866, sub: 928, pill: 1002, checks: 1092, cta: 1206,
};

function font(w, px, fam = 'Montserrat') { ctx.font = `${w} ${px}px ${fam}`; }
function box(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function fit(txt, maxW, px, w, fam) { font(w, px, fam); const m = ctx.measureText(txt).width; if (m > maxW) { px = Math.floor(px * maxW / m); font(w, px, fam); } return px; }
function diamondPath(cx, cy, w) {
  const h = w * 0.78;
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, cy - h * 0.18); ctx.lineTo(cx - w * 0.28, cy - h / 2); ctx.lineTo(cx + w * 0.28, cy - h / 2);
  ctx.lineTo(cx + w / 2, cy - h * 0.18); ctx.lineTo(cx, cy + h / 2); ctx.closePath();
  ctx.moveTo(cx - w / 2, cy - h * 0.18); ctx.lineTo(cx + w / 2, cy - h * 0.18);
  ctx.moveTo(cx - w * 0.14, cy - h * 0.18); ctx.lineTo(cx, cy + h / 2); ctx.lineTo(cx + w * 0.14, cy - h * 0.18);
  ctx.moveTo(cx - w * 0.28, cy - h / 2); ctx.lineTo(cx - w * 0.14, cy - h * 0.18);
  ctx.moveTo(cx + w * 0.28, cy - h / 2); ctx.lineTo(cx + w * 0.14, cy - h * 0.18);
}
function diamond(cx, cy, w, col, lw) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw || w * 0.08; ctx.lineJoin = 'round';
  diamondPath(cx, cy, w); ctx.stroke(); ctx.restore();
}
function waIcon(cx, cy, r, bg) {
  ctx.save();
  if (bg) { ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.12; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.56, Math.PI * 0.72, Math.PI * 2.62); ctx.lineTo(cx - r * 0.66, cy + r * 0.62); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.6);
  ctx.beginPath(); ctx.roundRect(-r * 0.09, -r * 0.3, r * 0.18, r * 0.6, r * 0.09); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-r * 0.2, -r * 0.34, r * 0.4, r * 0.15, r * 0.07); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-r * 0.2, r * 0.19, r * 0.4, r * 0.15, r * 0.07); ctx.fill();
  ctx.restore(); ctx.restore();
}
function check(cx, cy, r) {
  ctx.strokeStyle = SAND; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = r * 0.24; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r * 0.42, cy + r * 0.02); ctx.lineTo(cx - r * 0.1, cy + r * 0.34); ctx.lineTo(cx + r * 0.45, cy - r * 0.32); ctx.stroke();
}

function background() {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const cy = L.pct - L.pctPx * 0.44;
  // warm glow behind the number
  const g = ctx.createRadialGradient(W / 2, cy, 30, W / 2, cy, H * 0.55);
  g.addColorStop(0, 'rgba(216,180,126,0.16)'); g.addColorStop(0.45, 'rgba(216,180,126,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // the store's diamond as a watermark
  diamond(W / 2, cy + 30, W * 1.05, 'rgba(216,180,126,0.07)', 3);
  // thin inner frame
  ctx.strokeStyle = 'rgba(216,180,126,0.28)'; ctx.lineWidth = 2;
  ctx.strokeRect(28, 28, W - 56, H - 56);
  // film grain so the black doesn't band
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}

function type() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const maxW = W - 2 * SAFE.side - 40;
  // brand
  font(700, 32); ctx.letterSpacing = '9px';
  const bw = ctx.measureText('FAGNER DAVI').width;
  diamond(W / 2 - bw / 2 - 30, L.brand - 12, 38, SAND);
  ctx.fillStyle = OFF; ctx.fillText('FAGNER DAVI', W / 2 + 24, L.brand);
  ctx.letterSpacing = '0px';
  // BLACK FRIDAY
  fit('BLACK FRIDAY', maxW, L.blackPx, 400, 'Anton');
  ctx.fillStyle = OFF; ctx.fillText('BLACK FRIDAY', W / 2, L.black);
  // ATÉ — letterspaced, flanked by rules
  font(400, L.atePx, 'Anton'); ctx.letterSpacing = `${Math.round(L.atePx * 0.3)}px`;
  const aw = ctx.measureText('ATÉ').width;
  ctx.fillStyle = SAND; ctx.fillText('ATÉ', W / 2 + L.atePx * 0.15, L.ate);
  ctx.letterSpacing = '0px';
  ctx.strokeStyle = 'rgba(216,180,126,0.6)'; ctx.lineWidth = 3;
  const ry = L.ate - L.atePx * 0.36;
  ctx.beginPath(); ctx.moveTo(W / 2 - aw / 2 - 160, ry); ctx.lineTo(W / 2 - aw / 2 - 30, ry);
  ctx.moveTo(W / 2 + aw / 2 + 30, ry); ctx.lineTo(W / 2 + aw / 2 + 160, ry); ctx.stroke();
  // 50% — the hero, sand with a soft light from above
  fit('50%', maxW, L.pctPx, 400, 'Anton');
  const top = L.pct - L.pctPx * 0.88;   // Anton caps are ~0.88em tall
  const g = ctx.createLinearGradient(0, top, 0, L.pct);
  g.addColorStop(0, '#F1D7A8'); g.addColorStop(0.55, SAND); g.addColorStop(1, '#B98F57');
  ctx.save(); ctx.shadowColor = 'rgba(216,180,126,0.25)'; ctx.shadowBlur = 50;
  ctx.fillStyle = g; ctx.fillText('50%', W / 2, L.pct); ctx.restore();
  // OFF — letterspaced
  font(400, L.offPx, 'Anton'); ctx.letterSpacing = `${Math.round(L.offPx * 0.22)}px`;
  ctx.fillStyle = OFF; ctx.fillText('OFF', W / 2 + L.offPx * 0.11, L.off);
  ctx.letterSpacing = '0px';
  // rule
  ctx.strokeStyle = 'rgba(216,180,126,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W / 2 - 60, L.rule); ctx.lineTo(W / 2 + 60, L.rule); ctx.stroke();
  diamond(W / 2, L.rule, 22, SAND, 2.5);
  // what & where
  font(500, 38); ctx.fillStyle = 'rgba(244,240,232,0.9)';
  ctx.fillText('As melhores ofertas saem primeiro no', W / 2, L.sub);
  const pillTxt = 'GRUPO VIP DO WHATSAPP';
  font(800, 42); const pw = ctx.measureText(pillTxt).width + 120, ph = 78;
  box(W / 2 - pw / 2, L.pill - ph / 2, pw, ph, ph / 2, OFF);
  waIcon(W / 2 - pw / 2 + 46, L.pill, 27, WA);
  ctx.fillStyle = BG; ctx.textBaseline = 'middle'; ctx.fillText(pillTxt, W / 2 + 28, L.pill + 2);
  // benefits row
  font(600, 32);
  const items = ['Acesso antecipado', 'Condições nunca vistas'];
  const ws = items.map(t => ctx.measureText(t).width + 52), gap = 48;
  let x = W / 2 - (ws[0] + ws[1] + gap) / 2;
  ctx.textAlign = 'left';
  items.forEach((t, i) => { check(x + 17, L.checks, 17); ctx.fillStyle = OFF; ctx.fillText(t, x + 50, L.checks + 2); x += ws[i] + gap; });
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
}

function cta() {
  ctx.textBaseline = 'middle';
  font(800, 48); const label = 'ENTRAR NO GRUPO VIP';
  const bw = ctx.measureText(label).width + 236, bh = 108, bx = W / 2 - bw / 2;
  ctx.save(); ctx.shadowColor = 'rgba(37,211,102,0.4)'; ctx.shadowBlur = 36;
  box(bx, L.cta - bh / 2, bw, bh, bh / 2, WA); ctx.restore();
  waIcon(bx + 64, L.cta, 33, '#1DA851');
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(label, bx + 118, L.cta + 3);
  const ax = bx + bw - 62, ay = L.cta;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(ax - 16, ay); ctx.lineTo(ax + 14, ay); ctx.moveTo(ax + 2, ay - 13); ctx.lineTo(ax + 15, ay); ctx.lineTo(ax + 2, ay + 13); ctx.stroke();
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
}

function guides() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,0,80,0.22)';
  ctx.fillRect(0, 0, W, SAFE.top); ctx.fillRect(0, SAFE.bottom, W, H - SAFE.bottom);
  ctx.fillRect(0, SAFE.top, SAFE.side, SAFE.bottom - SAFE.top); ctx.fillRect(W - SAFE.side, SAFE.top, SAFE.side, SAFE.bottom - SAFE.top);
  ctx.strokeStyle = 'rgba(255,0,80,0.9)'; ctx.setLineDash([14, 10]); ctx.lineWidth = 3;
  ctx.strokeRect(SAFE.side, SAFE.top, W - 2 * SAFE.side, SAFE.bottom - SAFE.top);
  ctx.restore();
}

window.ready = (async () => {
  await document.fonts.load('400 100px Anton'); await document.fonts.load('800 40px Montserrat');
  await document.fonts.load('600 40px Montserrat'); await document.fonts.load('500 40px Montserrat');
  background(); type(); cta();
  if (GUIDES) guides();
})();
</script>
</body>
</html>
