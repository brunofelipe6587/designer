<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Fagner Davi Estático VIP</title>
<style>
@font-face{font-family:'Montserrat';font-weight:100 900;font-style:normal;src:url('fonts/Montserrat-var.woff2') format('woff2');font-display:block}
@font-face{font-family:'Anton';font-weight:400;font-style:normal;src:url('fonts/Anton-Regular.woff2') format('woff2');font-display:block}
html, body { margin: 0; background: #000; } canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Static ads for the Grupo VIP Black Friday capture — feed 4:5 (1080x1350) and story 9:16 (1080x1920).
// Typographic column on the left, model on the right (Adobe Stock 482748750, free licence). The canvas uses the photo's
// own backdrop colour so the picture dissolves into the layout; type follows the brand's Black Friday warm-up post
// (condensed, off-white) with a sand accent.
// ?fmt=feed|story   &guides=1 draws the safe zones (review only, never for upload)
const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') || 'feed', GUIDES = q.get('guides') === '1';
const W = 1080, H = FMT === 'story' ? 1920 : 1350;
const c = document.getElementById('c'); c.width = W; c.height = H;
const ctx = c.getContext('2d');
const BG = '#151821', OFF = '#F4F0E8', SAND = '#D8B47E', WA = '#25D366';
// story: Meta keeps ~14% top / ~20% bottom under the profile row and the CTA; feed: plain margins
const SAFE = FMT === 'story' ? { top: 270, bottom: 1920 - 380, side: 64 } : { top: 56, bottom: 1350 - 56, side: 60 };
const X0 = SAFE.side, COL = FMT === 'story' ? 470 : 480;   // left text column

// photo: [top, height, face-centre x]; type baselines in px
const L = FMT === 'story' ? {
  photo: [330, 1590, 800], brand: 322, black: 438, blackPx: 104,
  ate: 548, ateMax: 100, pct: 806, pctPx: 290, off: 952, offPx: 160,
  sub: 1048, pill: 1142, checks: [1252, 1308], cta: 1464,
} : {
  photo: [96, 1290, 800], brand: 86, black: 192, blackPx: 96,
  ate: 292, ateMax: 88, pct: 528, pctPx: 266, off: 664, offPx: 140,
  sub: 756, pill: 830, checks: [942, 996], cta: 1172,
};

const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function font(w, px, fam = 'Montserrat') { ctx.font = `${w} ${px}px ${fam}`; }
function box(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function fit(txt, maxW, px, w, fam) { font(w, px, fam); const m = ctx.measureText(txt).width; if (m > maxW) { px = Math.floor(px * maxW / m); font(w, px, fam); } return px; }
function diamond(cx, cy, w, col) {
  const h = w * 0.78;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w * 0.08; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, cy - h * 0.18); ctx.lineTo(cx - w * 0.28, cy - h / 2); ctx.lineTo(cx + w * 0.28, cy - h / 2);
  ctx.lineTo(cx + w / 2, cy - h * 0.18); ctx.lineTo(cx, cy + h / 2); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - w / 2, cy - h * 0.18); ctx.lineTo(cx + w / 2, cy - h * 0.18);
  ctx.moveTo(cx - w * 0.14, cy - h * 0.18); ctx.lineTo(cx, cy + h / 2); ctx.lineTo(cx + w * 0.14, cy - h * 0.18); ctx.stroke();
  ctx.restore();
}
function waIcon(cx, cy, r, bg) {
  ctx.save();
  if (bg) { ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.12; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.56, Math.PI * 0.72, Math.PI * 2.62); ctx.lineTo(cx - r * 0.66, cy + r * 0.62); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.6);
  ctx.beginPath(); ctx.roundRect(-r * 0.09, -r * 0.3, r * 0.18, r * 0.6, r * 0.09); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-r * 0.2, -r * 0.34, r * 0.4, r * 0.15, r * 0.07); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-r * 0.2, r * 0.19, r * 0.4, r * 0.15, r * 0.07); ctx.fill();
  ctx.restore(); ctx.restore();
}
function check(cx, cy, r) {
  ctx.strokeStyle = SAND; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = r * 0.24; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r * 0.42, cy + r * 0.02); ctx.lineTo(cx - r * 0.1, cy + r * 0.34); ctx.lineTo(cx + r * 0.45, cy - r * 0.32); ctx.stroke();
}

function backgroundAndPhoto(photo) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const [top, ph, faceX] = L.photo;
  const pw = ph * photo.width / photo.height;
  const x = faceX - pw * 0.49;
  ctx.filter = 'contrast(1.04) saturate(0.92)';
  ctx.drawImage(photo, x, top, pw, ph);
  ctx.filter = 'none';
  // dissolve the photo edges into the backdrop: top, left (under the type) and bottom
  let g = ctx.createLinearGradient(0, top, 0, top + 120);
  g.addColorStop(0, BG); g.addColorStop(1, 'rgba(21,24,33,0)');
  ctx.fillStyle = g; ctx.fillRect(0, top - 2, W, 122);
  g = ctx.createLinearGradient(x, 0, x + pw * 0.42, 0);
  g.addColorStop(0, BG); g.addColorStop(0.55, 'rgba(21,24,33,0.55)'); g.addColorStop(1, 'rgba(21,24,33,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, x + pw * 0.42, H);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, Math.max(0, x), H);
  g = ctx.createLinearGradient(0, H - 420, 0, H);
  g.addColorStop(0, 'rgba(21,24,33,0)'); g.addColorStop(1, 'rgba(21,24,33,0.92)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 420, W, 420);
  // a warm rim of light behind the model
  g = ctx.createRadialGradient(faceX + 60, top + ph * 0.22, 20, faceX + 60, top + ph * 0.22, 620);
  g.addColorStop(0, 'rgba(216,180,126,0.10)'); g.addColorStop(1, 'rgba(216,180,126,0)');
  ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
}

function typeColumn() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 18;
  // brand
  font(700, 30); ctx.letterSpacing = '7px';
  diamond(X0 + 18, L.brand - 11, 36, OFF);
  ctx.fillStyle = OFF; ctx.fillText('FAGNER DAVI', X0 + 50, L.brand);
  ctx.letterSpacing = '0px';
  // BLACK FRIDAY
  fit('BLACK FRIDAY', COL, L.blackPx, 400, 'Anton');
  ctx.fillStyle = OFF; ctx.fillText('BLACK FRIDAY', X0, L.black);
  // ATÉ / 50% / OFF — the offer is the biggest thing on the page
  const pctPx = fit('50%', COL, L.pctPx, 400, 'Anton');
  const pctW = ctx.measureText('50%').width;
  fit('ATÉ', pctW, L.ateMax, 400, 'Anton'); ctx.fillStyle = OFF; ctx.fillText('ATÉ', X0 + 4, L.ate);
  font(400, pctPx, 'Anton'); ctx.fillStyle = SAND; ctx.fillText('50%', X0, L.pct);
  font(400, L.offPx, 'Anton'); ctx.letterSpacing = `${Math.round(L.offPx * 0.08)}px`;
  ctx.fillStyle = OFF; ctx.fillText('OFF', X0 + 2, L.off); ctx.letterSpacing = '0px';
  // what & where
  ctx.shadowBlur = 10;
  ctx.fillStyle = 'rgba(244,240,232,0.88)';
  if (FMT === 'story') {   // two larger lines read better on a phone held at arm's length
    font(500, 38); ctx.fillText('As melhores ofertas', X0, L.sub - 22); ctx.fillText('saem primeiro no', X0, L.sub + 24);
  } else {
    fit('As melhores ofertas saem primeiro no', COL, 32, 500); ctx.fillText('As melhores ofertas saem primeiro no', X0, L.sub);
  }
  ctx.shadowColor = 'transparent';
  const pillTxt = 'GRUPO VIP DO WHATSAPP';
  const px = fit(pillTxt, COL - 92, 38, 800);
  const pw = ctx.measureText(pillTxt).width + 92, phh = Math.round(px * 1.85);
  box(X0, L.pill - phh / 2, pw, phh, phh / 2, OFF);
  waIcon(X0 + 38, L.pill, px * 0.62, WA);
  ctx.fillStyle = '#0B0B0B'; ctx.textBaseline = 'middle'; ctx.fillText(pillTxt, X0 + 70, L.pill + 2);
  // benefits
  ['Acesso antecipado', 'Condições nunca vistas'].forEach((s, i) => {
    check(X0 + 18, L.checks[i], 17);
    font(600, 32); ctx.fillStyle = OFF; ctx.fillText(s, X0 + 50, L.checks[i] + 2);
  });
  ctx.textBaseline = 'alphabetic';
}

function cta() {
  ctx.textBaseline = 'middle';
  font(800, 48); const label = 'ENTRAR NO GRUPO VIP';
  const bw = ctx.measureText(label).width + 236, bh = 108, bx = W / 2 - bw / 2;
  ctx.save(); ctx.shadowColor = 'rgba(37,211,102,0.4)'; ctx.shadowBlur = 36;
  box(bx, L.cta - bh / 2, bw, bh, bh / 2, WA); ctx.restore();
  waIcon(bx + 64, L.cta, 33, '#1DA851');
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(label, bx + 118, L.cta + 3);
  const ax = bx + bw - 62, ay = L.cta;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(ax - 16, ay); ctx.lineTo(ax + 14, ay); ctx.moveTo(ax + 2, ay - 13); ctx.lineTo(ax + 15, ay); ctx.lineTo(ax + 2, ay + 13); ctx.stroke();
  ctx.textBaseline = 'alphabetic';
}

function guides() {
  ctx.save();
  ctx.fillStyle = 'rgba(255,0,80,0.22)';
  ctx.fillRect(0, 0, W, SAFE.top); ctx.fillRect(0, SAFE.bottom, W, H - SAFE.bottom);
  ctx.fillRect(0, SAFE.top, SAFE.side, SAFE.bottom - SAFE.top); ctx.fillRect(W - SAFE.side, SAFE.top, SAFE.side, SAFE.bottom - SAFE.top);
  ctx.strokeStyle = 'rgba(255,0,80,0.9)'; ctx.setLineDash([14, 10]); ctx.lineWidth = 3;
  ctx.strokeRect(SAFE.side, SAFE.top, W - 2 * SAFE.side, SAFE.bottom - SAFE.top);
  ctx.restore();
}

window.ready = (async () => {
  await document.fonts.load('400 100px Anton'); await document.fonts.load('800 40px Montserrat');
  await document.fonts.load('600 40px Montserrat'); await document.fonts.load('500 40px Montserrat');
  const photo = await load('static/stock/AdobeStock_482748750.jpeg');
  backgroundAndPhoto(photo); typeColumn(); cta();
  if (GUIDES) guides();
})();
</script>
</body>
</html>
