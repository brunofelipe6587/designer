<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Fagner Davi Grupo VIP</title>
<style>
@font-face{font-family:'Montserrat';font-weight:100 900;font-style:normal;src:url('fonts/Montserrat-var.woff2') format('woff2');font-display:block}
html, body { margin: 0; background: #000; } canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Grupo VIP Black Friday — re-edit of the client's talking-head take (raw/insumo_IMG_5888.mp4).
// Speech is re-ordered so the offer ("até 50% de desconto") opens the ad, with the headline on screen from frame 1.
// The source has small burned-in captions at y≈0.733–0.77; every framing keeps them below the crop.
const W = 1080, H = 1920, DUR = 24.8, FPS_SRC = 30, NFRAMES = 768;
const SRC_W = 1440, SRC_H = 2560, BURN_TOP = 0.72;
const ctx = document.getElementById('c').getContext('2d');
const YEL = '#FFD400', BLK = '#0B0B0B', WA = '#25D366';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));

// [outStart, srcStart, srcEnd]  (seconds) — same table drives build_audio.py
const SEGS = [
  [0.00, 13.50, 19.50],  // A (13.50 = first open-eyes frame; 13.42 is mid-blink)  "Já tem produto lá hoje com preço de até 50% de desconto."
  [6.00, 0.97, 4.30],    // B  "conversa séria com você agora que estava esperando a nossa Black,"
  [9.33, 4.39, 12.86],   // C  "tô liberando um link exclusivo pra você garantir acesso antecipado a condições especiais nunca vistas."
  [17.80, 19.48, 21.78], // D1 "Aproveita que esse grupo é antecipado,"
  [20.10, 22.64, 25.36], // D2 "se você entrar agora, você vai garantir algo extraordinário."
];
const END = 22.84;
const out = src => {
  for (const [o, a, b] of SEGS) if (src >= a && src <= b) return o + (src - a);         // strict containment first
  for (const [o, a, b] of SEGS) if (src >= a - 0.05 && src <= b + 0.05) return o + clamp(src - a, 0, b - a);
  return null;
};

// camera keyframes: [t, scale] — a change of scale at the same t is a jump-cut punch
const CAM = [
  [0.00, 1.85], [0.35, 1.55], [2.96, 1.62], [2.96, 1.82], [6.00, 1.72],
  [6.00, 1.46], [9.33, 1.52],
  [9.33, 1.48], [10.38, 1.53], [10.38, 1.68], [13.14, 1.72], [13.14, 1.47], [16.62, 1.52], [16.62, 1.70], [17.80, 1.75],
  [17.80, 1.52], [20.10, 1.58],
  [20.10, 1.47], [20.48, 1.49], [20.48, 1.70], [END, 1.78],
  [END, 1.78], [DUR, 1.92],
];
const CUTS = [2.96, 6.00, 9.33, 10.38, 13.14, 16.62, 17.80, 20.10, 20.48];
function camScale(t) {
  let i = 0; while (i < CAM.length - 1 && CAM[i + 1][0] <= t) i++;
  if (i >= CAM.length - 1) return CAM[CAM.length - 1][1];
  const [t0, s0] = CAM[i], [t1, s1] = CAM[i + 1];
  const e = t < 0.35 ? eout(prog(t, t0, t1)) : prog(t, t0, t1);
  return lerp(s0, s1, e);
}

const cache = new Map();
function frameImg(n) {
  n = clamp(n, 1, NFRAMES);
  if (!cache.has(n)) {
    const im = new Image(); im.src = `frames/${String(n).padStart(4, '0')}.jpg`;
    cache.set(n, im.decode().then(() => im));
    if (cache.size > 30) cache.delete(cache.keys().next().value);
  }
  return cache.get(n);
}
function srcTime(t) {
  if (t >= END) return Math.min(25.36 + (t - END), 25.55);
  let s = SEGS[0]; for (const g of SEGS) if (t >= g[0]) s = g;
  return s[1] + (t - s[0]);
}

async function drawFootage(t) {
  const img = await frameImg(Math.round(srcTime(t) * FPS_SRC) + 1);
  let s = camScale(t);
  // punch overshoot on every jump cut
  for (const c of CUTS) if (t >= c && t < c + 0.22) s *= 1 + 0.035 * (1 - eout(prog(t, c, c + 0.22)));
  // crop window (normalised source coords): face (~0.354) sits near 0.46 of the frame, burned captions stay out
  const lo = 0.5 / s, hi = BURN_TOP - 0.51 / s;
  const yc = clamp(0.354 + 0.04 / s, lo, Math.max(lo, hi));
  const xc = clamp(0.47, 0.5 / s, 1 - 0.5 / s);
  const cw = SRC_W / s, ch = SRC_H / s;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if (t >= END) ctx.filter = `blur(${lerp(0, 14, eout(prog(t, END, END + 0.5)))}px) brightness(${lerp(1, 0.45, eout(prog(t, END, END + 0.5)))})`;
  ctx.drawImage(img, xc * SRC_W - cw / 2, yc * SRC_H - ch / 2, cw, ch, 0, 0, W, H);
  ctx.filter = 'none';
}

// ---------- drawing helpers ----------
function font(w, px) { ctx.font = `${w} ${px}px Montserrat`; }
function box(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function strokeText(txt, x, y, lw = 14, stroke = BLK, fill = '#fff') {
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function pop(t, t0, dur = 0.32) { return t < t0 ? 0 : eback(prog(t, t0, t0 + dur)); }
function waIcon(cx, cy, r, bg = WA) {
  ctx.save();
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  // speech bubble with tail
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.12; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.56, Math.PI * 0.72, Math.PI * 2.62); ctx.lineTo(cx - r * 0.66, cy + r * 0.62); ctx.closePath(); ctx.stroke();
  // handset
  ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.6);
  ctx.beginPath(); ctx.roundRect(-r * 0.09, -r * 0.3, r * 0.18, r * 0.6, r * 0.09); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-r * 0.2, -r * 0.34, r * 0.4, r * 0.15, r * 0.07); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-r * 0.2, r * 0.19, r * 0.4, r * 0.15, r * 0.07); ctx.fill();
  ctx.restore(); ctx.restore();
}
function diamond(cx, cy, w, col) {
  const h = w * 0.78;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w * 0.07; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, cy - h * 0.18); ctx.lineTo(cx - w * 0.28, cy - h / 2); ctx.lineTo(cx + w * 0.28, cy - h / 2);
  ctx.lineTo(cx + w / 2, cy - h * 0.18); ctx.lineTo(cx, cy + h / 2); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - w / 2, cy - h * 0.18); ctx.lineTo(cx + w / 2, cy - h * 0.18);
  ctx.moveTo(cx - w * 0.14, cy - h * 0.18); ctx.lineTo(cx, cy + h / 2); ctx.lineTo(cx + w * 0.14, cy - h * 0.18); ctx.stroke();
  ctx.restore();
}
function check(cx, cy, r) {
  ctx.fillStyle = YEL; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = BLK; ctx.lineWidth = r * 0.26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - r * 0.45, cy + r * 0.02); ctx.lineTo(cx - r * 0.12, cy + r * 0.36); ctx.lineTo(cx + r * 0.48, cy - r * 0.34); ctx.stroke();
}

// ---------- hook headline (0 → 6.0) then top badge ----------
function hook(t) {
  if (t >= 6.35) return;
  const outP = eio(prog(t, 6.0, 6.35));
  ctx.save();
  ctx.globalAlpha = 1 - outP;
  ctx.translate(540, 1330 - 160 * outP); ctx.scale(1 - 0.25 * outP, 1 - 0.25 * outP);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  // soft dark plate behind the block for legibility over the shirt
  ctx.save(); ctx.scale(1, 0.62);
  const g = ctx.createRadialGradient(0, 0, 60, 0, 0, 600);
  g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-620, -620, 1240, 1240); ctx.restore();

  // line 1: BLACK FRIDAY tag
  let p = pop(t, -0.22, 0.3); // already on screen in frame 1 (thumbnail), settling from a punch
  ctx.save(); ctx.translate(0, -150); ctx.rotate(-0.035); ctx.scale(p, p);
  font(900, 58); const l1 = 'BLACK FRIDAY'; const w1 = ctx.measureText(l1).width + 70;
  box(-w1 / 2, -46, w1, 92, 14, YEL); ctx.fillStyle = BLK; ctx.fillText(l1, 0, 4);
  ctx.restore();

  // line 2: ATÉ 50% OFF — "50%" pulses when he says it (2.96)
  p = pop(t, -0.2, 0.34);
  const beat = t >= 2.96 ? 1 + 0.16 * Math.max(0, 1 - prog(t, 2.96, 3.42)) * Math.sin(prog(t, 2.96, 3.42) * Math.PI) : 1;
  ctx.save(); ctx.translate(0, 0); ctx.scale(p, p);
  font(900, 176);
  const a = 'ATÉ ', b = '50%', c = ' OFF';
  let wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, wc = ctx.measureText(c).width;
  const fit = Math.min(1, 940 / (wa + wb + wc)); ctx.scale(fit, fit);
  let x = -(wa + wb + wc) / 2;
  ctx.textAlign = 'left';
  strokeText(a, x, 6, 22);
  ctx.save(); ctx.translate(x + wa + wb / 2, 0); ctx.scale(beat, beat); strokeText(b, -wb / 2, 6, 22, BLK, YEL); ctx.restore();
  strokeText(c, x + wa + wb, 6, 22);
  ctx.restore();

  // line 3: SÓ NO GRUPO VIP
  p = pop(t, -0.12, 0.32);
  ctx.save(); ctx.translate(0, 148); ctx.scale(p, p); ctx.textAlign = 'center';
  font(900, 62); const l3 = 'SÓ NO GRUPO VIP'; const w3 = ctx.measureText(l3).width + 150;
  box(-w3 / 2, -50, w3, 100, 50, '#fff');
  waIcon(-w3 / 2 + 60, 0, 35);
  ctx.fillStyle = BLK; ctx.fillText(l3, 38, 4);
  ctx.restore();
  ctx.restore();
}
function topBadge(t) {
  if (t < 6.1 || t >= END) return;
  const p = eout(prog(t, 6.1, 6.45));
  ctx.save(); ctx.globalAlpha = p; ctx.translate(540, 300 - 30 * (1 - p));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  font(900, 44);
  const a = 'BLACK FRIDAY', b = 'GRUPO VIP · ATÉ 50% OFF';
  const wa = ctx.measureText(a).width + 44; font(800, 44); const wb = ctx.measureText(b).width + 44;
  const tw = wa + wb;
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 20;
  box(-tw / 2, -40, tw, 80, 16, BLK); ctx.shadowColor = 'transparent';
  box(-tw / 2, -40, wa, 80, 16, YEL);
  ctx.fillRect(-tw / 2 + wa - 16, -40, 16, 80);
  font(900, 44); ctx.fillStyle = BLK; ctx.fillText(a, -tw / 2 + wa / 2, 3);
  font(800, 44); ctx.fillStyle = '#fff'; ctx.fillText(b, -tw / 2 + wa + wb / 2, 3);
  ctx.restore();
}

// ---------- karaoke captions (B, C, D) ----------
// [srcStart, word] grouped in on-screen chunks
const CHUNKS = [
  [[1.04, 'CONVERSA'], [1.66, 'SÉRIA']],
  [[1.86, 'COM'], [2.04, 'VOCÊ'], [2.28, 'AGORA']],
  [[2.52, 'QUE'], [2.68, 'ESTAVA'], [2.78, 'ESPERANDO']],
  [[3.16, 'A'], [3.36, 'NOSSA'], [3.5, 'BLACK']],
  [[4.42, 'TÔ'], [4.5, 'LIBERANDO']],
  [[5.08, 'UM'], [5.44, 'LINK'], [5.78, 'EXCLUSIVO']],
  [[6.78, 'PRA'], [6.98, 'VOCÊ'], [7.32, 'GARANTIR']],
  [[8.2, 'ACESSO'], [8.8, 'ANTECIPADO']],
  [[10.36, 'CONDIÇÕES'], [10.84, 'ESPECIAIS']],
  [[11.68, 'NUNCA'], [12.24, 'VISTAS']],
  [[19.54, 'APROVEITA'], [20.12, 'QUE'], [20.44, 'ESSE'], [20.62, 'GRUPO']],
  [[20.84, 'É'], [21.02, 'ANTECIPADO']],
  [[22.66, 'SE'], [22.8, 'VOCÊ'], [23.0, 'ENTRAR'], [23.24, 'AGORA']],
  [[23.58, 'VOCÊ'], [23.72, 'VAI'], [23.82, 'GARANTIR']],
  [[24.22, 'ALGO'], [24.42, 'EXTRAORDINÁRIO']],
].map(ch => ch.map(([s, w]) => [out(s), w]));
const KEY = new Set(['SÉRIA', 'BLACK', 'LINK', 'EXCLUSIVO', 'ANTECIPADO', 'NUNCA', 'VISTAS', 'AGORA', 'EXTRAORDINÁRIO', 'GRUPO']);
function captions(t) {
  if (t < 6.0 || t >= END) return;
  let ci = -1; for (let i = 0; i < CHUNKS.length; i++) if (t >= CHUNKS[i][0][0] - 0.04) ci = i;
  if (ci < 0) return;
  const ch = CHUNKS[ci];
  const next = CHUNKS[ci + 1];
  const tEnd = next ? next[0][0] - 0.04 : END;
  if (t >= tEnd) return;
  const p = pop(t, ch[0][0] - 0.04, 0.2);
  ctx.save(); ctx.translate(540, 1300); ctx.scale(0.8 + 0.2 * p, 0.8 + 0.2 * p);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let px = 100;
  font(900, px); const sp = ctx.measureText(' ').width;
  let total = ch.reduce((a, [, w]) => a + ctx.measureText(w).width, 0) + sp * (ch.length - 1);
  if (total > 960) { px = Math.floor(px * 960 / total); font(900, px); total = 960; }
  const spc = ctx.measureText(' ').width;
  let x = -total / 2;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  for (const [ws, w] of ch) {
    const ww = ctx.measureText(w).width;
    const on = t >= ws - 0.03;
    const col = on && KEY.has(w) ? YEL : '#fff';
    ctx.globalAlpha = on ? 1 : 0.55;
    ctx.save(); ctx.translate(x + ww / 2, 0);
    const k = on ? 1 + 0.08 * (1 - eout(prog(t, ws - 0.03, ws + 0.15))) : 1;
    ctx.scale(k, k);
    strokeText(w, -ww / 2, 4, px * 0.16, BLK, col);
    ctx.restore();
    x += ww + spc;
  }
  ctx.restore();
}

// ---------- info cards under the captions ----------
function groupCard(t) {
  const t0 = out(5.44) - 0.05, t1 = out(8.2) - 0.1;
  if (t < t0 || t > t1 + 0.25) return;
  const p = pop(t, t0, 0.35), q = 1 - eio(prog(t, t1, t1 + 0.25));
  ctx.save(); ctx.globalAlpha = q; ctx.translate(540, 1440); ctx.scale(p * (0.9 + 0.1 * q), p * (0.9 + 0.1 * q));
  const w = 820, h = 140;
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  box(-w / 2, -h / 2, w, h, 34, '#fff'); ctx.shadowColor = 'transparent';
  waIcon(-w / 2 + 82, 0, 50);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  font(900, 46); ctx.fillStyle = BLK; ctx.fillText('GRUPO VIP BLACK FRIDAY', -w / 2 + 156, -22);
  font(600, 34); ctx.fillStyle = '#555'; ctx.fillText('Fagner Davi · link exclusivo', -w / 2 + 156, 28);
  ctx.restore();
}
function checklist(t) {
  const items = [[out(8.2), 'ACESSO ANTECIPADO'], [out(10.36), 'CONDIÇÕES NUNCA VISTAS']];
  const tEnd = 17.8;
  if (t < items[0][0] - 0.05 || t > tEnd + 0.25) return;
  const q = 1 - eio(prog(t, tEnd, tEnd + 0.25));
  items.forEach(([ti, txt], i) => {
    if (t < ti - 0.05) return;
    const p = pop(t, ti - 0.05, 0.3);
    ctx.save(); ctx.globalAlpha = q; ctx.translate(540, 1425 + i * 92); ctx.scale(p, p);
    font(900, 44); const tw = ctx.measureText(txt).width + 140;
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    box(-tw / 2, -40, tw, 80, 40, 'rgba(11,11,11,0.88)'); ctx.shadowColor = 'transparent';
    check(-tw / 2 + 48, 0, 25);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(txt, -tw / 2 + 92, 3);
    ctx.restore();
  });
}
function ctaStrip(t) {
  const t0 = out(23.0) - 0.05;
  if (t < t0 || t >= END) return;
  const p = pop(t, t0, 0.35);
  ctx.save(); ctx.translate(540, 1440); ctx.scale(p, p);
  font(900, 50); const txt = 'TOQUE NO BOTÃO E ENTRE'; const tw = ctx.measureText(txt).width + 170;
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  box(-tw / 2, -50, tw, 100, 50, WA); ctx.shadowColor = 'transparent';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(txt, -tw / 2 + 50, 3);
  arrowDown(tw / 2 - 64, 0 + 8 * Math.sin((t - t0) * 9), 26, '#fff');
  ctx.restore();
}
function arrowDown(cx, cy, s, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = s * 0.32; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s); ctx.moveTo(cx - s * 0.75, cy + s * 0.25); ctx.lineTo(cx, cy + s); ctx.lineTo(cx + s * 0.75, cy + s * 0.25); ctx.stroke();
  ctx.restore();
}

// ---------- end card ----------
function endCard(t) {
  if (t < END) return;
  const lt = t - END;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let p = pop(lt, 0.05, 0.35);
  ctx.save(); ctx.translate(540, 560); ctx.scale(p, p);
  diamond(-170, 0, 70, '#fff');
  font(800, 58); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText('FAGNER DAVI', -118, 4);
  ctx.restore();
  ctx.textAlign = 'center';
  p = pop(lt, 0.15, 0.35);
  ctx.save(); ctx.translate(540, 720); ctx.rotate(-0.035); ctx.scale(p, p);
  font(900, 66); const l1 = 'BLACK FRIDAY'; const w1 = ctx.measureText(l1).width + 70;
  box(-w1 / 2, -52, w1, 104, 14, YEL); ctx.fillStyle = BLK; ctx.fillText(l1, 0, 4);
  ctx.restore();
  p = pop(lt, 0.25, 0.4);
  ctx.save(); ctx.translate(540, 905); ctx.scale(p, p);
  font(900, 210); strokeText('GRUPO', 0, 0, 0, BLK, '#fff');
  ctx.restore();
  p = pop(lt, 0.32, 0.4);
  ctx.save(); ctx.translate(540, 1095); ctx.scale(p, p);
  font(900, 210); ctx.fillStyle = YEL; ctx.fillText('VIP', 0, 0);
  ctx.restore();
  p = pop(lt, 0.45, 0.35);
  ctx.save(); ctx.translate(540, 1262); ctx.scale(p, p);
  font(700, 46); ctx.fillStyle = '#fff'; ctx.fillText('Acesso antecipado · até 50% OFF', 0, 0);
  ctx.restore();
  p = pop(lt, 0.6, 0.4);
  const pulse = 1 + 0.04 * Math.sin(Math.max(0, lt - 0.9) * 7);
  ctx.save(); ctx.translate(540, 1415); ctx.scale(p * pulse, p * pulse);
  font(900, 54); const txt = 'ENTRAR NO GRUPO'; const tw = ctx.measureText(txt).width + 200;
  ctx.shadowColor = 'rgba(37,211,102,0.55)'; ctx.shadowBlur = 40;
  box(-tw / 2, -62, tw, 124, 62, WA); ctx.shadowColor = 'transparent';
  waIcon(-tw / 2 + 70, 0, 40, '#1DA851');
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(txt, -tw / 2 + 130, 4);
  ctx.restore();
  ctx.restore();
}

function vignette() {
  let g = ctx.createLinearGradient(0, 0, 0, 520);
  g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 520);
  g = ctx.createLinearGradient(0, 1050, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 1050, W, H - 1050);
}
function flash(t) {
  const a = t >= END ? 0.45 * (1 - prog(t, END, END + 0.15)) : 0;
  if (a > 0) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, 0, W, H); }
}

window.renderAt = async function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  await drawFootage(t);
  vignette();
  hook(t); topBadge(t); captions(t); groupCard(t); checklist(t); ctaStrip(t); endCard(t);
  flash(t);
};
window.ready = (async () => { await document.fonts.load('900 100px Montserrat'); await document.fonts.load('600 40px Montserrat'); await window.renderAt(0); })();
</script>
</body>
</html>
