<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>HGG Djavan Amor Atrai N</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Creative N: HGG — Camiseta Djavan "Dizem que o amor atrai" (9:16, 23.2s). Structure of the V1 winner (lowest cost per purchase),
// cut to "Samurai" (ao vivo) from 1:33.28 so the sung line "dizem que o amor atrai" lands on the reveal of the BACK print (12.3s).
// Product pixels are drawn untouched: only scale/translate, never filters or color changes on product layers.
const W = 1080, H = 1920, DUR = 23.2;
const C = { bg0: '#0a0a0b', bg1: '#1b1a1d', white: '#ffffff', soft: 'rgba(255,255,255,0.72)', accent: '#E97E78' };
const ctx = document.getElementById('c').getContext('2d');

const IMG = {};
function load(name, src) {
  return new Promise((ok, err) => { const i = new Image(); i.onload = () => { IMG[name] = i; ok(); }; i.onerror = err; i.src = src; });
}

// ---------- easing / helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
// in/out envelope for an element visible between a and b
function env(t, a, b, fin = 0.35, fout = 0.25) {
  if (t < a || t > b) return 0;
  return Math.min(eout(prog(t, a, a + fin)), 1 - eio(prog(t, b - fout, b)));
}
// camera keyframes: [time, cx, cy, s, ay] -> interpolated with ease-in-out between keys
function cam(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, ...a] = keys[i], [t1, ...b] = keys[i + 1];
    if (t <= t1) { const p = eio(prog(t, t0, t1)); return a.map((v, k) => lerp(v, b[k], p)); }
  }
  return keys[keys.length - 1].slice(1);
}
// draw a 2x-resampled product image so that original point (cx,cy) sits at (540+dx, ay) with scale s (relative to 1200px source)
function drawProduct(img, cx, cy, s, ay, alpha = 1, dx = 0) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.translate(540 + dx, ay); ctx.scale(s / 2, s / 2); ctx.translate(-cx * 2, -cy * 2);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
const toScreen = (px, py, cx, cy, s, ay, dx = 0) => [540 + dx + (px - cx) * s, ay + (py - cy) * s];

function text(str, x, y, o = {}) {
  const { size = 60, weight = 800, color = C.white, align = 'center', alpha = 1, spacing = 0, family = 'Montserrat', italic = false, dy = 0, shadow = true, maxW = 0 } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px "${family}"`;
  ctx.letterSpacing = spacing + 'px';
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = color;
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { ctx.translate(x, y + dy); ctx.scale(maxW / w, 1); ctx.fillText(str, 0, 0); ctx.restore(); return; } }
  ctx.fillText(str, x, y + dy);
  ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// pill callout with leader line from an anchor on the product
function callout(label, ax, ay, px, py, a, side = 1) {
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '800 34px "Montserrat"'; ctx.letterSpacing = '1px';
  const tw = ctx.measureText(label).width, pw = tw + 56, ph = 74;
  const bx = side > 0 ? px : px - pw;
  // leader line (draws on)
  const lp = eout(clamp(a * 1.4));
  const ex = side > 0 ? bx : bx + pw, ey = py;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lerp(ax, ex, lp), lerp(ay, ey, lp)); ctx.stroke();
  // anchor ring
  ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(ax, ay, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(233,126,120,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(ax, ay, 9 + 14 * ((performance_t * 1.6) % 1), 0, Math.PI * 2); ctx.stroke();
  // pill
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  ctx.fillStyle = 'rgba(255,255,255,0.97)'; rrect(bx, py - ph / 2, pw, ph, ph / 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#0b0b0c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, bx + pw / 2, py + 2);
  ctx.restore();
}

// ---------- background ----------
function background(t, glow = 1, glowY = 900) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg1); g.addColorStop(0.55, C.bg0); g.addColorStop(1, '#050505');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft spotlight behind the product (separates black shirt from background)
  const r = ctx.createRadialGradient(540, glowY, 40, 540, glowY, 820);
  r.addColorStop(0, `rgba(120,118,128,${0.42 * glow})`); r.addColorStop(0.45, `rgba(70,68,76,${0.22 * glow})`); r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
}
function lightSweep(t, a, b) {
  // diagonal light pass on the background only (drawn before the product)
  const p = prog(t, a, b); if (p <= 0 || p >= 1) return;
  const x = lerp(-600, W + 600, eio(p));
  ctx.save(); ctx.translate(x, H / 2); ctx.rotate(-0.35);
  const g = ctx.createLinearGradient(-260, 0, 260, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.10)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(-260, -1600, 520, 3200); ctx.restore();
}
function vignette() {
  const v = ctx.createRadialGradient(540, 960, 600, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function topShade(h = 620, a = 0.75) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
}
function bottomShade(from = 1300, a = 0.85) {
  const g = ctx.createLinearGradient(0, from, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, from, W, H - from);
}
function flash(t, at, d = 0.18, max = 0.55) {
  const p = prog(t, at - 0.02, at + d); if (p <= 0 || p >= 1) return;
  ctx.fillStyle = `rgba(255,255,255,${max * (1 - eout(p))})`; ctx.fillRect(0, 0, W, H);
}
function lyric(str, t, a, b, y = 1600) {
  const e = env(t, a, b, 0.5, 0.4);
  text(str, 540, y, { family: 'Playfair Display', italic: true, weight: 500, size: 46, color: 'rgba(255,255,255,0.9)', alpha: e, dy: (1 - e) * 14, maxW: 960 });
}
function progressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(0, H - 8, W, 8);
  ctx.fillStyle = C.accent; ctx.fillRect(0, H - 8, W * (t / DUR), 8);
}

let performance_t = 0;

// ---------- timeline (song cues in clip time: "samurai" 6.0 · "mas eu tô tão feliz" 8.87 · "dizem" 12.30 · "amor" 12.74 · "atrai" 13.50) ----------
const T = { hookEnd: 3.2, tourEnd: 8.3, flip: 11.85, hit: 12.3, model: 14.0, mback: 15.5, color: 17.0, offer: 18.2, cta: 20.4 };
// front flat camera: [t, cx, cy, s, ay]
const FLAT = [
  [0.0, 600, 760, 2.0, 1090],
  [3.0, 600, 750, 1.8, 1090],
  [3.6, 600, 640, 2.5, 960],   // hair / eyes
  [4.9, 610, 650, 2.6, 960],
  [5.4, 600, 1030, 2.6, 900],  // necklace
  [6.6, 605, 1035, 2.66, 900],
  [7.1, 600, 845, 1.35, 960],  // the whole portrait
  [8.3, 600, 845, 1.40, 960],
  [10.6, 600, 810, 0.82, 930], // full shirt
  [12.3, 600, 810, 0.86, 930],
];
const BACK = [[12.3, 600, 730, 0.92, 960], [14.0, 600, 725, 1.00, 960]];
const MODEL = [[14.0, 602, 760, 1.12, 960], [15.5, 602, 740, 1.20, 960]];
// horizontal squeeze for the card-flip (pure scaling of the product layer)
function drawFlip(img, cx, cy, s, ay, sx) {
  if (sx <= 0.002) return;
  ctx.save(); ctx.translate(540, ay); ctx.scale(sx, 1); ctx.translate(-540, -ay); drawProduct(img, cx, cy, s, ay); ctx.restore();
}

function render(t) {
  performance_t = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (t < T.hit) {
    // ===== HOOK + TOUR + PULL-BACK on the front print =====
    const [cx, cy, s, ay] = cam(FLAT, t);
    background(t, t < T.tourEnd ? 0.35 : lerp(0.35, 1, prog(t, T.tourEnd, 10.6)), ay);
    lightSweep(t, 10.4, 11.8);
    const fp = prog(t, T.flip, T.flip + 0.22);
    drawFlip(IMG.frente, cx, cy, s, ay, Math.cos(fp * Math.PI / 2));
    if (t >= T.flip + 0.22) { const bp = prog(t, T.flip + 0.22, T.hit); const [bx, by, bs, bay] = cam(BACK, T.hit); drawFlip(IMG.costas, bx, by, bs, bay, Math.sin(eout(bp) * Math.PI / 2)); }
    vignette();
    const hem = 1 - prog(t, T.tourEnd - 0.2, T.tourEnd + 0.8);
    if (hem > 0) { ctx.save(); ctx.globalAlpha = hem; bottomShade(1380, 1); ctx.restore(); }
    // hook (V1's winning question) + product/price pill from 1s
    const h = env(t, 0.0, T.hookEnd, 0.01, 0.25);
    topShade(700, 0.88 * h);
    text('FÃ DE DJAVAN?', 540, 300, { size: 92, weight: 900, alpha: h, spacing: 1 });
    text('ISSO AQUI É PRA VOCÊ.', 540, 410, { size: 58, weight: 700, color: C.accent, alpha: env(t, 0.6, T.hookEnd), dy: (1 - env(t, 0.6, T.hookEnd)) * 24, spacing: 1 });
    { const e = env(t, 1.0, T.hookEnd, 0.35, 0.25);
      if (e > 0) { ctx.save(); ctx.globalAlpha = e; ctx.font = '800 36px "Montserrat"'; ctx.letterSpacing = '1px'; const str = 'Camiseta Djavan  ·  R$ 59,90', w = ctx.measureText(str).width + 60;
        ctx.fillStyle = 'rgba(255,255,255,0.96)'; rrect(540 - w / 2, 1690 - 36 + (1 - e) * 20, w, 72, 36); ctx.fill();
        ctx.fillStyle = '#0b0b0c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 540, 1692 + (1 - e) * 20); ctx.restore(); } }
    const S = (px, py) => toScreen(px, py, cx, cy, s, ay);
    { const [x, y] = S(470, 560); callout('RETRATO P&B EXCLUSIVO', x, y, 120, 330, env(t, 3.75, 5.15), 1); }
    { const [x, y] = S(660, 1030); callout('DTF EM ALTA DEFINIÇÃO', x, y, 960, 520, env(t, 5.55, 6.95), -1); }
    { const [x, y] = S(420, 1150); callout('RESISTENTE À LAVAGEM', x, y, 120, 430, env(t, 7.2, 8.4), 1); }
    lyric('"mas eu tô tão feliz…"', t, 8.75, 11.8, 1640);
    const fe = env(t, 10.7, 11.85, 0.3, 0.2);
    text('E AGORA, VIRA ELA…', 540, 330, { size: 54, weight: 900, alpha: fe, dy: (1 - fe) * 20, spacing: 2 });
  } else if (t < T.model) {
    // ===== HIT: the back print, the sung line word by word =====
    const [cx, cy, s, ay] = cam(BACK, t);
    background(t, 1, ay);
    drawProduct(IMG.costas, cx, cy, s, ay);
    vignette();
    const W4 = [['dizem', 12.30], ['que o', 12.58], ['amor', 12.74], ['atrai', 13.50]];
    ctx.save(); ctx.font = 'italic 500 66px "Playfair Display"'; const ws = W4.map(([w]) => ctx.measureText(w + ' ').width); ctx.restore();
    let x = 540 - ws.reduce((a, b) => a + b, 0) / 2;
    W4.forEach(([w, a], i) => { const e = eout(prog(t, a - 0.04, a + 0.22)); text(w, x, 1660, { family: 'Playfair Display', italic: true, weight: 500, size: 66, align: 'left', alpha: e, dy: (1 - e) * 16, color: i === 3 ? C.accent : C.white }); x += ws[i]; });
    const le = env(t, 12.45, T.model, 0.3, 0.2);
    text('A FRASE DAS COSTAS É DE "SAMURAI"', 540, 300, { size: 40, weight: 900, alpha: le, dy: (1 - le) * 18, spacing: 2, maxW: 980 });
    flash(t, T.hit, 0.24, 0.55);
  } else if (t < T.color) {
    // ===== MODEL front → back (whip) =====
    background(t, 1, 900);
    if (t < T.mback) {
      const [cx, cy, s, ay] = cam(MODEL, t);
      drawProduct(IMG.modeloFrente, cx, cy, s, ay);
      bottomShade(1500, 0.9); vignette();
      const S = (px, py) => toScreen(px, py, cx, cy, s, ay);
      { const [x, y] = S(600, 412); callout('GOLA REFORÇADA', x, y, 150, 470, env(t, 14.2, T.mback), 1); }
      { const [x, y] = S(1010, 760); callout('CAIMENTO OVERSIZED', x, y, 1010, 640, env(t, 14.5, T.mback), -1); }
      { const [x, y] = S(450, 1170); callout('100% ALGODÃO FIO 30.1', x, y, 90, 1450, env(t, 14.8, T.mback), 1); }
    } else {
      const p = prog(t, T.mback, T.mback + 0.35), dx = lerp(W * 0.9, 0, eout(p)), s = lerp(1.2, 1.26, prog(t, T.mback, T.color));
      if (p < 1) for (let k = 3; k >= 1; k--) drawProduct(IMG.modeloCostas, 590, 760, s, 960, 0.12, dx + k * 70 * (1 - p));
      drawProduct(IMG.modeloCostas, 590, 760, s, 960, 1, dx);
      bottomShade(1500, 0.9); vignette();
      const e = env(t, T.mback + 0.3, T.color, 0.3, 0.15);
      text('FRENTE E COSTAS', 540, 1560, { size: 72, weight: 900, alpha: e, dy: (1 - e) * 20, spacing: 3 });
      text('duas estampas na mesma camiseta', 540, 1640, { size: 38, weight: 600, color: C.soft, alpha: e, dy: (1 - e) * 20 });
    }
    flash(t, T.model, 0.15, 0.25);
  } else if (t < T.offer) {
    // ===== also in black =====
    background(t, 1, 900);
    const p = eout(prog(t, T.color, T.color + 0.45));
    drawProduct(IMG.frentePreta, 595, 800, 0.5, 900, 1, lerp(-900, -235, p));
    drawProduct(IMG.costasPreta, 610, 820, 0.5, 900, 1, lerp(900, 235, p));
    vignette();
    const e = env(t, T.color + 0.15, T.offer, 0.3, 0.15);
    text('TAMBÉM NA PRETA', 540, 380, { size: 84, weight: 900, alpha: e, dy: (1 - e) * 20, spacing: 2 });
    text('2 cores  ·  off white e preta', 540, 470, { size: 40, weight: 700, color: C.accent, alpha: e, dy: (1 - e) * 20 });
    flash(t, T.color, 0.15, 0.3);
  } else {
    // ===== OFFER + CTA =====
    const p = prog(t, T.offer, T.offer + 0.6);
    background(t, 1, 640);
    lightSweep(t, 18.4, 19.6);
    const bob = Math.sin((t - T.offer) * 2.2) * 8 * eio(p);
    drawProduct(IMG.costas, 600, 800, lerp(0.7, 0.44, eio(p)), lerp(900, 640, eio(p)) + bob, 1, lerp(260, 170, eio(p)));
    drawProduct(IMG.frente, 600, 810, lerp(0.7, 0.44, eio(p)), lerp(900, 650, eio(p)) + bob, 1, lerp(-260, -170, eio(p)));
    vignette();
    const le = env(t, T.offer + 0.2, DUR + 1);
    if (le > 0) { ctx.save(); ctx.globalAlpha = le; ctx.drawImage(IMG.logo, 540 - 116, 120, 232, 107); ctx.restore(); }
    const a1 = env(t, T.offer + 0.35, DUR + 1);
    text('POR APENAS', 540, 1060, { size: 36, weight: 700, color: C.soft, alpha: a1, dy: (1 - a1) * 20, spacing: 8 });
    const pe = prog(t, T.offer + 0.7, T.offer + 1.15);
    if (pe > 0) { ctx.save(); ctx.translate(540, 1175); const sc = lerp(1.5, 1, eback(pe)); ctx.scale(sc, sc); text('R$ 59,90', 0, 0, { size: 160, weight: 900, alpha: clamp(pe * 3), spacing: -2 }); ctx.restore(); }
    const a3 = env(t, T.offer + 1.6, DUR + 1);
    text('ou 6x de R$ 9,98 sem juros', 540, 1300, { size: 48, weight: 800, color: C.accent, alpha: a3, dy: (1 - a3) * 20, spacing: 0.5 });
    const a4 = env(t, T.offer + 1.9, DUR + 1);
    text('OFF WHITE OU PRETA  ·  M  ·  G  ·  GG', 540, 1370, { size: 30, weight: 700, color: C.soft, alpha: a4, dy: (1 - a4) * 20, spacing: 2, maxW: 960 });
    const a5 = env(t, T.offer + 2.25, DUR + 1);
    if (a5 > 0) {
      ctx.save(); ctx.globalAlpha = a5; ctx.translate(0, (1 - a5) * 20);
      ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2.5; rrect(150, 1428, 780, 70, 14); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      text('ENVIO NO MESMO DIA  ·  PEDIDOS ATÉ 13H', 540, 1464, { size: 28, weight: 800, alpha: a5, dy: (1 - a5) * 20, spacing: 1, maxW: 740 });
    }
    const ce = eback(prog(t, T.cta, T.cta + 0.5));
    if (ce > 0) {
      const pulse = 1 + 0.035 * Math.sin((t - T.cta) * 7) * clamp((t - T.cta - 0.5) * 2);
      ctx.save(); ctx.translate(540, 1580); ctx.scale(ce * pulse, ce * pulse);
      ctx.shadowColor = 'rgba(233,126,120,0.55)'; ctx.shadowBlur = 40; ctx.fillStyle = '#ffffff'; rrect(-380, -58, 760, 116, 58); ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.fillStyle = '#0b0b0c'; ctx.font = '900 44px "Montserrat"'; ctx.letterSpacing = '2px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('GARANTA A SUA  →', 0, 3); ctx.restore();
    }
    const a6 = env(t, T.cta + 0.35, DUR + 1);
    text('COMPRA 100% SEGURA  ·  TROCA FÁCIL', 540, 1690, { size: 28, weight: 700, color: C.soft, alpha: a6, spacing: 2 });
    flash(t, T.offer, 0.2, 0.3);
  }
  progressBar(t);
}

window.ready = (async () => {
  await Promise.all([
    load('frente', 'build/frente_2x.png'), load('costas', 'build/costas_2x.png'),
    load('modeloFrente', 'build/modelo_frente_2x.png'), load('modeloCostas', 'build/modelo_costas_2x.png'),
    load('frentePreta', 'build/frente_preta_2x.png'), load('costasPreta', 'build/costas_preta_2x.png'),
    load('logo', 'build/logo_white.svg'),
  ]);
  for (const f of ['900 40px "Montserrat"', '800 40px "Montserrat"', '700 40px "Montserrat"', '600 40px "Montserrat"', 'italic 500 40px "Playfair Display"']) await document.fonts.load(f);
  await document.fonts.ready;
  render(0);
  return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
