<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>HGG Djavan Amor Atrai P UGC Voz</title>
<link href="fonts/fontsC.css" rel="stylesheet">
<script src="build/vo_p.js"></script>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Creative P — UGC with a male AI voice-over (pt-BR) that pre-qualifies the click: front + back prints, the Samurai line,
// fabric, colours, price, instalments, same-day shipping. Bed: the instrumental bridge of "Samurai" (ao vivo, 4:07).
// Original product photos are only scaled/moved/rotated as a whole (handheld camera); pixels untouched.
const W = 1080, H = 1920, DUR = 20.5;
const ctx = document.getElementById('c').getContext('2d');
const IMG = {};
const load = (n, s) => new Promise((ok, er) => { const i = new Image(); i.onload = () => { IMG[n] = i; ok(); }; i.onerror = er; i.src = s; });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eout5 = t => 1 - Math.pow(1 - t, 5);
const eback = t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const Wd = window.VO.words;
const at = i => Wd[i].t;

// ---------- camera ----------
// shots: [start, img, keys:[[t, cx, cy, s]...]]  (cx,cy in 1200x1600 source coords mapped to screen centre)
const SHOTS = [
  [0.0, 'modelo', [[0.0, 602, 760, 1.30], [0.4, 602, 760, 1.18], [1.9, 602, 780, 1.22]]],                                   // hook: worn, front
  [at(6), 'frente', [[at(6), 600, 760, 1.75], [at(11) - 0.05, 600, 740, 1.6]]],                                             // "na frente, o retrato"
  [at(11), 'costas', [[at(11), 600, 740, 1.15], [at(14) - 0.05, 600, 760, 1.22], [at(18) + 0.3, 600, 800, 1.35]]],          // "e nas costas: dizem que o amor atrai"
  [at(19), 'costasModelo', [[at(19), 590, 760, 1.15], [at(24) - 0.05, 590, 740, 1.25]]],                                   // "trecho de Samurai"
  [at(24), 'frente', [[at(24), 600, 700, 2.4], [at(29), 605, 760, 2.2], [at(34) - 0.05, 600, 1000, 2.3]]],                 // fabric + print macro
  [at(34), 'modeloPreta', [[at(34), 600, 780, 1.15], [at(45) - 0.05, 600, 760, 1.25]]],                                     // also in black
  [at(45), 'costasModeloPreta', [[at(45), 600, 760, 1.15], [at(50) - 0.05, 600, 740, 1.25]]],
  [at(50), 'modelo', [[at(50), 602, 780, 1.25], [17.2, 602, 770, 1.18], [17.8, 602, 700, 0.98], [DUR, 602, 700, 1.01]]],   // shipping → end card
];

function camKeys(K, t) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 0; i < K.length - 1; i++) { const [t0, ...a] = K[i], [t1, ...b] = K[i + 1]; if (t <= t1) { const p = eout5(prog(t, t0, t1)); return a.map((v, k) => lerp(v, b[k], p)); } }
  return K[K.length - 1].slice(1);
}
function shake(t) { // handheld phone feel
  return [7 * Math.sin(1.3 * t) + 3 * Math.sin(3.7 * t + 1) + 1.5 * Math.sin(7.9 * t),
          6 * Math.sin(1.1 * t + 2) + 2.5 * Math.sin(4.3 * t) + 1.2 * Math.sin(8.7 * t + 3),
          0.35 * Math.sin(0.9 * t) + 0.12 * Math.sin(3.1 * t)];
}
function drawShot(t, ayOverride) {
  let k = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) k = i;
  const [st, name, K] = SHOTS[k];
  let [cx, cy, s] = camKeys(K, t);
  const punch = 1 + 0.07 * (1 - eout(prog(t, st, st + 0.22))) * (k > 0 ? 1 : 0); // jump-cut punch-in
  s *= punch;
  const [dx, dy, rot] = shake(t);
  const ay = ayOverride ?? 960;
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.translate(540 + dx, ay + dy); ctx.rotate(rot * Math.PI / 180);
  ctx.scale(s / 2, s / 2); ctx.translate(-cx * 2, -cy * 2);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(IMG[name], 0, 0);
  ctx.restore();
  return { k, st };
}

// ---------- text helpers ----------
function strokeText(str, x, y, o = {}) {
  const { size = 78, color = '#fff', stroke = '#000', sw = 14, scale = 1, alpha = 1, font = 'Montserrat', weight = 900, strike = 0, rot = 0 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px "${font}"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  let w = ctx.measureText(str).width; const maxW = 980; if (w > maxW) { ctx.scale(maxW / w, maxW / w); }
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, 0, 0);
  ctx.shadowColor = 'transparent'; ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  if (strike > 0) { ctx.strokeStyle = '#E8473F'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-w / 2 - 10, 4); ctx.lineTo(-w / 2 - 10 + (w + 20) * strike, 4); ctx.stroke(); }
  ctx.restore();
}
function boxText(str, x, y, o = {}) { // TikTok-style text box
  const { size = 46, alpha = 1, bg = '#fff', color = '#000', scale = 1 } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `800 ${size}px "Montserrat"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(str).width + 52, h = size + 34;
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 16); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.fillStyle = color; ctx.fillText(str, 0, 3);
  ctx.restore();
}

// caption chunks: [firstWordIdx, lastWordIdx, text, style]
const CH = [
  [0, 2, 'FÃ DE DJAVAN,', 'y'], [3, 5, 'OLHA ISSO AQUI'], [6, 7, 'NA FRENTE,'], [8, 10, 'O RETRATO DELE', 'y'],
  [11, 13, 'E NAS COSTAS:'], [14, 18, '"DIZEM QUE O AMOR ATRAI"', 'y'], [19, 21, 'QUE É TRECHO'], [22, 23, 'DE SAMURAI', 'y'],
  [24, 28, 'ALGODÃO FIO 30.1'], [29, 33, 'ESTAMPA QUE NÃO DESBOTA', 'y'], [34, 38, 'OFF WHITE E PRETA'], [39, 44, 'R$ 59,90', 'big'],
  [45, 47, 'OU 6X'], [48, 49, 'SEM JUROS', 'big'], [50, 54, 'PEDIDO ATÉ 13H'], [55, 58, 'SAI NO MESMO DIA', 'y'],
  [59, 61, 'TOCA NO BOTÃO'], [62, 65, 'E GARANTE A SUA!', 'y'],
];
function captions(t, y) {
  for (let i = 0; i < CH.length; i++) {
    const [a, b, txt, st] = CH[i], t0 = at(a) - 0.04;
    const t1 = i + 1 < CH.length ? Math.min(at(CH[i + 1][0]) - 0.04, at(b) + Wd[b].d + 0.6) : at(b) + 1.2;
    if (t < t0 || t >= t1) continue;
    const p = prog(t, t0, t0 + 0.16), sc = lerp(1.35, 1, eback(p));
    const big = st === 'big', yel = st === 'y' || big;
    strokeText(txt, 540, y, { size: big ? 118 : 80, color: yel ? '#FFD60A' : '#fff', scale: sc, sw: big ? 18 : 14 });
  }
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const endA = eio(prog(t, 17.2, 17.8));
  drawShot(t, lerp(960, 820, endA));
  const v = ctx.createRadialGradient(540, 900, 700, 540, 900, 1300); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.18)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // hook box (top): product + artist from frame 1
  const ha = clamp(prog(t, 0.0, 0.15)) * (1 - prog(t, at(11) - 0.15, at(11)));
  boxText('a camiseta do Djavan com frase nas costas', 540, 172, { alpha: ha, size: 40, scale: t < 0.02 ? 1 : lerp(0.85, 1, eback(prog(t, 0, 0.3))) });
  // price pill during the price line
  { const e = clamp(prog(t, at(45), at(45) + 0.25)) * (1 - prog(t, at(50) - 0.2, at(50))); if (e > 0) boxText('6x de R$ 9,98 sem juros', 540, 172, { alpha: e, size: 40, scale: lerp(0.9, 1, e) }); }
  if (t < 17.3) captions(t, 1490);
  // end card
  if (t >= 17.2) {
    const a = eout(prog(t, 17.25, 17.7));
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 80);
    ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(70, 1300, 940, 380, 40); ctx.fill(); ctx.restore();
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 80);
      ctx.fillStyle = '#0d0b0a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 32px Montserrat'; ctx.fillText('Camiseta Djavan · Dizem Que o Amor Atrai', 540, 1360);
      ctx.font = '900 92px Montserrat'; ctx.fillText('R$ 59,90', 430, 1450);
      ctx.fillStyle = '#E8473F'; ctx.font = '800 34px Montserrat'; ctx.fillText('6x R$ 9,98', 800, 1430);
      ctx.fillStyle = 'rgba(13,11,10,0.6)'; ctx.font = '700 28px Montserrat'; ctx.fillText('sem juros', 800, 1475);
      ctx.restore();
      const cb = eback(prog(t, 17.65, 18.05)), pulse = 1 + 0.03 * Math.sin((t - 18.05) * 7) * clamp((t - 18.15) * 2);
      if (cb > 0) {
        ctx.save(); ctx.translate(540, 1590); ctx.scale(cb * pulse, cb * pulse);
        ctx.fillStyle = '#0d0b0a'; ctx.beginPath(); ctx.roundRect(-400, -58, 800, 116, 58); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '900 44px Montserrat'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '2px';
        ctx.fillText('COMPRAR AGORA  →', 0, 3); ctx.restore();
      }
      boxText('Off white ou preta · envio no mesmo dia (até 13h)', 540, 1760, { alpha: eout(prog(t, 17.95, 18.35)), size: 28, bg: '#FFD60A' });
    }
    captions(t, 1180);
  }
}

window.ready = (async () => {
  await Promise.all([load('modelo', 'build/foto_modelo_2x.png'), load('frente', 'build/foto_frente_2x.png'), load('costas', 'build/foto_costas_2x.png'),
    load('costasModelo', 'build/foto_costas_modelo_2x.png'), load('modeloPreta', 'build/foto_modelo_preta_2x.png'), load('costasModeloPreta', 'build/foto_costas_modelo_preta_2x.png')]);
  for (const f of ['900 40px Montserrat', '800 40px Montserrat', '700 40px Montserrat']) await document.fonts.load(f);
  await document.fonts.ready; render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
