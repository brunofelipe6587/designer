<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>HGG Djavan Geracoes G</title>
<link href="fonts/fontsC.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Creative G — "Seu pai ouvia. Você veste." Two generations + gift angle, colour-block editorial poster style.
// Product cutouts/photos are only scaled/moved/rotated as a whole; footage is cropped inside a frame.
const W = 1080, H = 1920, DUR = 21.0;
const C = { sal: '#E97E78', cream: '#F3EDE6', ink: '#0d0b0a', white: '#fff' };
const ctx = document.getElementById('c').getContext('2d');
const IMG = {};
const load = (n, s) => new Promise((ok, er) => { const i = new Image(); i.onload = () => { IMG[n] = i; ok(); }; i.onerror = er; i.src = s; });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const pop = (t, a, d = 0.26) => t < a ? 0 : eback(prog(t, a, a + d));

// Oceano chorus cues: "Vem" 0.66 · "amo" 5.4 · "Você" 8.5 · "deságua" 9.82 · "em" 10.78 · "mim" 11.08 · "e" 11.46 · "eu" 11.94 · "oceano" 12.3
const T = { voce: 1.2, prod: 2.6, card: 5.4, cresceu: 8.5, split: 12.3, offer: 15.4, cta: 17.4 };

function product(img, cx, cy, s, x, y, rot = 0, shadow = true, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot);
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 60 * s; ctx.shadowOffsetY = 30 * s; }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.scale(s / 2, s / 2); ctx.translate(-cx * 2, -cy * 2); ctx.drawImage(img, 0, 0);
  ctx.restore();
}
function big(str, x, y, o = {}) {
  const { size = 150, color = C.ink, align = 'left', scale = 1, alpha = 1, font = 'Montserrat', weight = 900, italic = false, spacing = -3, maxW = 960 } = o;
  if (scale <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px "${font}"`; ctx.letterSpacing = spacing + 'px';
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  const w = ctx.measureText(str).width; if (w > maxW) ctx.scale(maxW / w, maxW / w);
  ctx.fillText(str, 0, 0); ctx.restore();
}
function chip(str, x, y, o = {}) {
  const { size = 36, bg = C.ink, color = C.white, rot = 0, scale = 1 } = o;
  if (scale <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `800 ${size}px Montserrat`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(str).width + 48, h = size + 34;
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.fillStyle = color; ctx.fillText(str, 0, 3); ctx.restore();
}
function bg(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }
function grain(t, a = 0.05) {
  const nz = NOISE[Math.floor(t * 24) % NOISE.length];
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  for (let y = 0; y < H; y += 256) for (let x = 0; x < W; x += 256) ctx.drawImage(nz, x, y);
  ctx.restore();
}
function logo(dark, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.drawImage(dark ? IMG.logoW : IMG.logoB, 70, 92, 120, 56); ctx.restore(); }

// footage (client video 1) cropped inside a photo frame — the burned-in sticker stays outside the crop
const cache = new Map();
function frameImg(n) {
  n = clamp(n, 1, 409); const key = n;
  if (!cache.has(key)) { const im = new Image(); im.src = `ugc/frames/vd1/${String(n).padStart(4, '0')}.jpg`; cache.set(key, im.decode().then(() => im)); if (cache.size > 30) cache.delete(cache.keys().next().value); }
  return cache.get(key);
}

let NOISE = [];
async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (t < T.voce) {
    // ===== 1. SEU PAI OUVIA DJAVAN. =====
    bg(C.sal);
    const rise = eout(prog(t, 0, 1.0));
    product(IMG.frente, 583, 760, 0.98, 600, lerp(1520, 1420, rise), -0.12);
    const s = lerp(1.06, 1, eout(prog(t, 0, 0.35)));
    big('SEU PAI', 80, 330, { size: 170, scale: s });
    big('OUVIA', 80, 500, { size: 170, scale: s });
    big('DJAVAN.', 80, 670, { size: 170, color: C.white, scale: s });
    logo(false);
  } else if (t < T.prod) {
    // ===== 2. VOCÊ VESTE. =====
    bg(C.ink);
    const up = eout(prog(t, T.voce, T.voce + 0.45));
    product(IMG.modeloFrente, 605, 900, lerp(1.08, 1.14, prog(t, T.voce, T.prod)), 540, lerp(1700, 1360, up), 0, false);
    big('VOCÊ', 540, 260, { size: 190, color: C.white, align: 'center', scale: pop(t, T.voce, 0.2) });
    big('VESTE.', 540, 440, { size: 190, color: C.sal, align: 'center', scale: pop(t, T.voce + 0.25, 0.2) });
    logo(true);
  } else if (t < T.card) {
    // ===== 3. A CAMISETA DO DJAVAN + features on the beat =====
    bg(C.cream);
    const sway = Math.sin((t - T.prod) * 2.2) * 0.025;
    const s = lerp(0.72, 0.8, eio(prog(t, T.prod, T.card)));
    product(IMG.frente, 583, 760, s, 540, 1010, sway);
    big('A CAMISETA', 540, 250, { size: 100, align: 'center', scale: pop(t, T.prod, 0.22) });
    big('DO DJAVAN', 540, 375, { size: 132, color: C.sal, align: 'center', scale: pop(t, T.prod + 0.12, 0.22) });
    chip('OVERSIZED', 250, 640, { scale: pop(t, 3.0), rot: -0.08 });
    chip('100% ALGODÃO FIO 30.1', 760, 1520, { scale: pop(t, 3.6), rot: 0.05 });
    chip('ESTAMPA DTF ALTA DEFINIÇÃO', 470, 1640, { scale: pop(t, 4.2), rot: -0.04, bg: C.sal, color: C.ink });
    chip('GOLA REFORÇADA', 830, 600, { scale: pop(t, 4.8), rot: 0.07 });
    logo(false);
  } else if (t < T.cresceu) {
    // ===== 4. real footage in a photo frame: QUALIDADE QUE ELE VAI APROVAR. =====
    bg(C.sal);
    big('QUALIDADE QUE', 540, 230, { size: 92, align: 'center', scale: pop(t, T.card, 0.22) });
    big('ELE VAI APROVAR.', 540, 335, { size: 96, color: C.white, align: 'center', scale: pop(t, T.card + 0.15, 0.22) });
    const ap = eout(prog(t, T.card, T.card + 0.4));
    const src = 2.6 + (t - T.card) * 0.95; // hand passing over the print
    const im = await frameImg(Math.floor(src * 30) + 1);
    ctx.save(); ctx.translate(540, lerp(1500, 1050, ap)); ctx.rotate(-0.035);
    const fw = 860, fh = 1080, bw = 18;
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    ctx.fillStyle = C.cream; ctx.fillRect(-fw / 2 - bw, -fh / 2 - bw, fw + 2 * bw, fh + 2 * bw + 70);
    ctx.shadowColor = 'transparent';
    ctx.beginPath(); ctx.rect(-fw / 2, -fh / 2, fw, fh); ctx.clip();
    const z = lerp(1.0, 1.08, prog(t, T.card, T.cresceu)), sw = 1080, sh = 1350; // crop y 120..1470 of the frame
    ctx.drawImage(im, 0, 120, sw, sh, -fw / 2 * z, -fh / 2 * z, fw * z, fh * z);
    ctx.restore();
    ctx.save(); ctx.translate(540, lerp(1500, 1050, ap)); ctx.rotate(-0.035);
    ctx.fillStyle = C.ink; ctx.font = 'italic 600 34px "Playfair Display"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('estampa resistente à lavagem', 0, fh / 2 + 45); ctx.restore();
    logo(false);
  } else if (t < T.split) {
    // ===== 5. PRA QUEM CRESCEU OUVINDO ISSO: + lyric word by word =====
    bg(C.ink);
    grain(t, 0.06);
    big('PRA QUEM CRESCEU', 540, 260, { size: 84, color: C.white, align: 'center', scale: pop(t, T.cresceu, 0.22) });
    big('OUVINDO ISSO:', 540, 360, { size: 84, color: C.sal, align: 'center', scale: pop(t, T.cresceu + 0.15, 0.22) });
    const words = [['"você', 8.5], ['deságua', 9.82], ['em mim,', 10.78], ['e eu…"', 11.46]];
    words.forEach(([w, a], i) => {
      const e = eout(prog(t, a - 0.05, a + 0.25));
      big(w, 540, 650 + i * 135, { size: 118, color: C.cream, align: 'center', font: 'Playfair Display', weight: 700, italic: true, spacing: 0, alpha: e, scale: lerp(1.15, 1, e) });
    });
    product(IMG.frente, 583, 760, 0.5, 540, 1480 + Math.sin(t * 2) * 8, Math.sin(t * 1.4) * 0.03, false);
    logo(true);
  } else if (t < T.offer) {
    // ===== 6. split: UMA PRA VOCÊ · UMA PRA ELE (hit on "oceano") =====
    const pl = eout(prog(t, T.split, T.split + 0.35)), pr = eout(prog(t, T.split + 0.45, T.split + 0.8));
    bg(C.ink);
    ctx.fillStyle = C.cream; ctx.fillRect(lerp(-540, 0, pl), 0, 540, H);
    ctx.fillStyle = C.sal; ctx.fillRect(lerp(1080, 540, pr), 0, 540, H);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 540, H); ctx.clip();
    product(IMG.modeloFrente, 605, 900, 0.66, lerp(-300, 270, pl), 1120, 0, false);
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(540, 0, 540, H); ctx.clip();
    product(IMG.frente, 583, 760, 0.46, lerp(1400, 810, pr), 1060, 0.04);
    ctx.restore();
    big('DUAS GERAÇÕES.', 540, 230, { size: 92, color: C.ink, align: 'center', scale: pop(t, T.split + 0.9, 0.22) });
    big('UMA CAMISETA.', 540, 340, { size: 92, color: C.ink, font: 'Playfair Display', italic: true, spacing: 0, align: 'center', scale: pop(t, T.split + 1.2, 0.22) });
    chip('UMA PRA VOCÊ', 270, 1650, { scale: pop(t, T.split + 0.1), bg: C.ink });
    chip('UMA PRA ELE', 810, 1650, { scale: pop(t, T.split + 0.55), bg: C.cream, color: C.ink });
    chip('PRESENTE CERTEIRO', 810, 1760, { scale: pop(t, T.split + 1.7), size: 28, bg: C.ink });
    logo(false, 1);
  } else {
    // ===== 7. offer + CTA =====
    bg(C.sal);
    const p = eio(prog(t, T.offer, T.offer + 0.5));
    product(IMG.frente, 583, 760, lerp(0.46, 0.5, p), 540, lerp(1100, 560, p) + Math.sin((t - T.offer) * 2) * 6 * p, 0);
    const s1 = pop(t, T.offer + 0.35);
    big('DE R$ 89,90', 540, 1060, { size: 54, color: C.white, align: 'center', scale: s1, spacing: 0 });
    if (s1 > 0) {
      ctx.save(); ctx.font = '900 54px Montserrat'; const w = ctx.measureText('DE R$ 89,90').width, sp = eout(prog(t, T.offer + 0.55, T.offer + 0.8));
      ctx.strokeStyle = C.ink; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(540 - w / 2 - 8, 1062); ctx.lineTo(540 - w / 2 - 8 + (w + 16) * sp, 1062); ctx.stroke(); ctx.restore();
    }
    const val = lerp(89.9, 49.0, eout(prog(t, T.offer + 0.7, T.offer + 1.3)));
    big('R$ ' + val.toFixed(2).replace('.', ','), 540, 1190, { size: 190, align: 'center', scale: pop(t, T.offer + 0.7, 0.28) });
    chip('R$ 46,55 no Pix  ·  6x de R$ 8,17 sem juros', 540, 1340, { scale: pop(t, T.offer + 1.4), bg: C.cream, color: C.ink, size: 34 });
    chip('+5% OFF na 1ª compra: PRIMEIRACOMPRA', 540, 1440, { scale: pop(t, T.offer + 1.7), bg: C.ink, size: 30 });
    const cp = pop(t, T.cta, 0.35);
    if (cp > 0) {
      const pulse = 1 + 0.03 * Math.sin((t - T.cta - 0.4) * 8) * clamp((t - T.cta - 0.4) * 3);
      ctx.save(); ctx.translate(540, 1580); ctx.scale(cp * pulse, cp * pulse);
      ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.roundRect(-440, -64, 880, 128, 64); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.fillStyle = C.cream; ctx.font = '900 44px Montserrat'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('GARANTA A SUA E A DELE  →', 0, 3); ctx.restore();
    }
    big('hggstyle.com.br', 540, 1700, { size: 34, weight: 700, align: 'center', scale: pop(t, T.cta + 0.3), spacing: 1 });
    logo(false);
  }
  // hard-cut flash on the hit
  const f = prog(t, T.split - 0.005, T.split + 0.18);
  if (f > 0 && f < 1) { ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - eout(f))})`; ctx.fillRect(0, 0, W, H); }
  // progress bar
  ctx.fillStyle = 'rgba(13,11,10,0.15)'; ctx.fillRect(0, H - 10, W, 10);
  ctx.fillStyle = C.ink; ctx.fillRect(0, H - 10, W * (t / DUR), 10);
}

function makeNoise() {
  for (let k = 0; k < 6; k++) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const c = cv.getContext('2d'), im = c.createImageData(256, 256);
    let s = 77 + k * 991; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    c.putImageData(im, 0, 0); NOISE.push(cv);
  }
}
window.ready = (async () => {
  await Promise.all([load('frente', 'build/frente_2x.png'), load('modeloFrente', 'build/modelo_frente_2x.png'),
    load('logoW', 'build/logo_white.svg'), load('logoB', 'src/logo.svg')]);
  for (const f of ['900 40px Montserrat', '800 40px Montserrat', '700 40px Montserrat', 'italic 700 40px "Playfair Display"', 'italic 600 40px "Playfair Display"']) await document.fonts.load(f);
  await document.fonts.ready; makeNoise(); await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
