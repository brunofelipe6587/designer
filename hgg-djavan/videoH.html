<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>HGG Djavan Conversa H</title>
<link href="fonts/fontsC.css" rel="stylesheet">
<script src="build/vn_h.js"></script>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Creative H — "A conversa": native chat format. A friend sends the real footage, a photo, a voice note with the
// price and the store link. Generic chat UI (own design, no app branding). Product media is only cropped/scaled.
const W = 1080, H = 1920, DUR = 21.0;
const ctx = document.getElementById('c').getContext('2d');
const F = '"Montserrat", "Noto Color Emoji"';
const COL = { bg: '#0f0f11', head: '#1a1a1d', me: '#E97E78', meText: '#170c0b', them: '#26262a', themText: '#f2f2f2', sub: 'rgba(255,255,255,0.55)', blue: '#7fb4ff' };
const IMG = {};
const load = (n, s) => new Promise((ok, er) => { const i = new Image(); i.onload = () => { IMG[n] = i; ok(); }; i.onerror = er; i.src = s; });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eout = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));

const VN0 = 7.4, VNLEN = 5.13; // voice-note playback window
// conversation script: [time, side, type, payload]
const MSG = [
  [-1, 'them', 'text', 'mano 🚨'],
  [-1, 'them', 'text', 'olha o que eu achei'],
  [-1, 'them', 'video'],
  [1.5, 'me', 'text', 'PERA'],
  [2.2, 'me', 'text', 'é a camiseta do Djavan??? 😭'],
  [3.4, 'them', 'text', 'simmm, da HGG'],
  [4.3, 'them', 'photo'],
  [5.4, 'me', 'text', 'que absurdo'],
  [6.0, 'me', 'text', 'quanto??'],
  [7.2, 'them', 'voice'],
  [12.9, 'me', 'text', 'meu pai vai surtar kkkk'],
  [13.6, 'me', 'text', 'vou levar uma pra mim e uma pra ele'],
  [14.6, 'them', 'link'],
  [15.5, 'them', 'text', 'usa o cupom PRIMEIRACOMPRA que ganha +5% off 🔥'],
  [17.0, 'me', 'text', 'comprei ✅'],
];
const TYPING = [[2.85, 3.4], [3.85, 4.3], [14.1, 14.6], [15.05, 15.5]]; // friend typing
const RECORDING = [6.35, 7.2];
const INPUT_TYPING = [16.15, 16.95, 'comprei ✅'];
const END = 17.8;

// ---------- layout ----------
const VIEW_TOP = 500, VIEW_BOTTOM = 1575, PAD = 40, GAP = 14, MAXW = 760;
function wrap(text, maxW, font) {
  ctx.font = font; const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
const TXT_FONT = `600 40px ${F}`;
function measure(m) {
  const [, side, type, payload] = m;
  if (type === 'text') { const lines = wrap(payload, MAXW - 64, TXT_FONT); ctx.font = TXT_FONT; const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 64 + 90; return { w: Math.min(MAXW, Math.max(w, 200)), h: lines.length * 52 + 44, lines }; }
  if (type === 'video') return { w: 580, h: 720 };
  if (type === 'photo') return { w: 580, h: 730 };
  if (type === 'voice') return { w: 720, h: 250 };
  if (type === 'link') return { w: 740, h: 640 };
}
MSG.forEach(m => m.box = null);

function roundBubble(x, y, w, h, side, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.roundRect(x, y, w, h, [34, 34, side === 'me' ? 8 : 34, side === 'me' ? 34 : 8]); ctx.fill();
}
const cache = new Map();
function frameImg(n) {
  n = clamp(n, 1, 409);
  if (!cache.has(n)) { const im = new Image(); im.src = `ugc/frames/vd1/${String(n).padStart(4, '0')}.jpg`; cache.set(n, im.decode().then(() => im)); if (cache.size > 30) cache.delete(cache.keys().next().value); }
  return cache.get(n);
}
function stamp(x, y, side, txt = '14:32') {
  ctx.font = `500 22px ${F}`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = side === 'me' ? 'rgba(23,12,11,0.6)' : COL.sub;
  ctx.fillText(side === 'me' ? txt + ' ✓✓' : txt, x, y);
}
function waveBars(x, y, w, h, p, color, dim) {
  const n = 42; let s = 7;
  for (let i = 0; i < n; i++) {
    s = (s * 9301 + 49297) % 233280; const v = 0.25 + 0.75 * Math.abs(Math.sin(i * 0.7) * 0.6 + (s / 233280) * 0.4);
    const bh = Math.max(6, h * v), bx = x + i * (w / n);
    ctx.fillStyle = i / n <= p ? color : dim; ctx.beginPath(); ctx.roundRect(bx, y + (h - bh) / 2, w / n - 5, bh, 3); ctx.fill();
  }
}

async function drawMsg(m, x, y, t) {
  const [, side, type, payload] = m, { w, h, lines } = m.box;
  if (type === 'text') {
    roundBubble(x, y, w, h, side, side === 'me' ? COL.me : COL.them);
    ctx.fillStyle = side === 'me' ? COL.meText : COL.themText; ctx.font = TXT_FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, x + 32, y + 22 + i * 52));
    stamp(x + w - 22, y + h - 16, side);
  } else if (type === 'video') {
    roundBubble(x, y, w, h, side, COL.them);
    const im = await frameImg(Math.floor((2.6 + (Math.max(0, t) % 3.0)) * 30) + 1);
    ctx.save(); ctx.beginPath(); ctx.roundRect(x + 8, y + 8, w - 16, h - 16, 28); ctx.clip();
    ctx.drawImage(im, 0, 150, 1080, 1330, x + 8, y + 8, w - 16, h - 16);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(x + 24, y + 24, 96, 40, 20); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `600 24px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('▶ 0:13', x + 72, y + 45);
  } else if (type === 'photo') {
    roundBubble(x, y, w, h, side, COL.them);
    ctx.save(); ctx.beginPath(); ctx.roundRect(x + 8, y + 8, w - 16, h - 16, 28); ctx.clip();
    ctx.drawImage(IMG.foto, 150 * 2, 150 * 2, 900 * 2, 1150 * 2, x + 8, y + 8, w - 16, h - 16);
    ctx.restore();
  } else if (type === 'voice') {
    roundBubble(x, y, w, h, side, COL.them);
    const p = prog(t, VN0, VN0 + VNLEN), playing = t >= VN0 && t < VN0 + VNLEN;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 70, y + 72, 38, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.them;
    if (playing) { ctx.fillRect(x + 57, y + 56, 9, 32); ctx.fillRect(x + 74, y + 56, 9, 32); }
    else { ctx.beginPath(); ctx.moveTo(x + 60, y + 52); ctx.lineTo(x + 90, y + 72); ctx.lineTo(x + 60, y + 92); ctx.closePath(); ctx.fill(); }
    waveBars(x + 130, y + 42, w - 220, 60, p, COL.me, 'rgba(255,255,255,0.35)');
    ctx.fillStyle = COL.sub; ctx.font = `500 24px ${F}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const secs = playing ? Math.floor(t - VN0) : 5; ctx.fillText(`0:0${secs}`, x + 130, y + 132);
    // live transcript (accessibility-style captions inside the bubble)
    // caption tokens: spoken numbers show up as the price the moment they start being said
    const TOK = [['Cara,', 0], ['tá', 0.58], ['R$ 49!', 0.72], ['E no', 2.84], ['Pix', 3.09], ['sai', 3.41], ['R$ 46,55.', 3.63]];
    const said = TOK.filter(([, a]) => t >= VN0 + a - 0.02).map(([w]) => w).join(' ');
    const shown = t >= VN0 + VNLEN ? 'Cara, tá R$ 49! E no Pix sai R$ 46,55.' : said;
    ctx.fillStyle = COL.themText; ctx.font = `italic 600 30px ${F}`; ctx.fillText(shown ? '“' + shown + (t >= VN0 + VNLEN ? '”' : '') : '', x + 32, y + 196, w - 64);
    stamp(x + w - 22, y + h - 14, side);
  } else if (type === 'link') {
    roundBubble(x, y, w, h, side, COL.them);
    ctx.save(); ctx.beginPath(); ctx.roundRect(x + 8, y + 8, w - 16, 360, [28, 28, 6, 6]); ctx.clip();
    ctx.fillStyle = '#F3EDE6'; ctx.fillRect(x + 8, y + 8, w - 16, 360);
    const s = 0.3; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(IMG.frente, x + w / 2 - 583 * s, y + 188 - 760 * s, 1200 * s, 1600 * s);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x + 8, y + 368, w - 16, 160);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = COL.themText; ctx.font = `700 32px ${F}`; ctx.fillText('Camiseta Djavan Oceano MPB Oversized Preta', x + 30, y + 418, w - 60);
    ctx.fillStyle = COL.sub; ctx.font = `500 25px ${F}`; ctx.fillText('100% algodão fio 30.1 · estampa DTF alta definição', x + 30, y + 460, w - 60);
    ctx.fillStyle = COL.me; ctx.font = `800 30px ${F}`; ctx.fillText('R$ 49,00  ·  R$ 46,55 no Pix', x + 30, y + 505);
    ctx.fillStyle = COL.blue; ctx.font = `500 30px ${F}`; ctx.fillText('hggstyle.com.br/camiseta-streetwear-djavan…', x + 30, y + 580, w - 60);
    stamp(x + w - 22, y + h - 16, side);
  }
}

function typingBubble(x, y, t) {
  roundBubble(x, y, 150, 80, 'them', COL.them);
  for (let i = 0; i < 3; i++) {
    const b = Math.max(0, Math.sin((t * 9) - i * 0.9)); ctx.fillStyle = `rgba(255,255,255,${0.45 + 0.5 * b})`;
    ctx.beginPath(); ctx.arc(x + 45 + i * 30, y + 42 - b * 8, 9, 0, Math.PI * 2); ctx.fill();
  }
}

function targetAt(tt) {
  let y = 0; for (const m of MSG) if (tt >= m[0]) { if (!m.box) m.box = measure(m); y += m.box.h + GAP + 6; }
  if (TYPING.find(([a, b]) => tt >= a && tt < b)) y += 80 + GAP;
  return Math.max(0, y - GAP - (VIEW_BOTTOM - VIEW_TOP - PAD));
}
async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  // subtle chat wallpaper
  ctx.save(); ctx.globalAlpha = 0.05; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  for (let y = 0; y < H; y += 120) for (let x = (y / 120) % 2 ? 60 : 0; x < W; x += 120) { ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();

  // ----- layout of visible messages (+ typing bubble) -----
  const visible = MSG.filter(m => t >= m[0]);
  const typing = TYPING.find(([a, b]) => t >= a && t < b);
  let y = 0; const pos = [];
  for (const m of visible) { if (!m.box) m.box = measure(m); pos.push(y); y += m.box.h + GAP + 6; }
  const typingY = y; if (typing) y += 80 + GAP;
  const contentBottom = y - GAP;
  // smooth scroll: low-pass of the target offset over the last 0.3s (covers new messages and typing bubbles alike)
  const scroll = [0, 1, 2, 3, 4, 5, 6, 7].map(k => targetAt(t - k * 0.04)).reduce((a, b) => a + b, 0) / 8;

  ctx.save(); ctx.beginPath(); ctx.rect(0, VIEW_TOP - 30, W, VIEW_BOTTOM - VIEW_TOP + 60); ctx.clip();
  for (let i = 0; i < visible.length; i++) {
    const m = visible[i], { w, h } = m.box;
    const yy = VIEW_TOP + PAD + pos[i] - scroll;
    if (yy + h < VIEW_TOP - 40 || yy > VIEW_BOTTOM + 40) continue;
    const age = t - m[0], a = m[0] < 0 ? 1 : eback(clamp(age / 0.28));
    const x = m[1] === 'me' ? W - 40 - w : 40;
    ctx.save();
    const ox = m[1] === 'me' ? x + w : x, oy = yy + h;
    ctx.translate(ox, oy); ctx.scale(lerp(0.6, 1, a), lerp(0.6, 1, a)); ctx.translate(-ox, -oy);
    ctx.globalAlpha = clamp(a * 1.5);
    await drawMsg(m, x, yy, t);
    ctx.restore();
  }
  if (typing) typingBubble(40, VIEW_TOP + PAD + typingY - scroll, t);
  ctx.restore();

  // ----- header -----
  ctx.fillStyle = COL.head; ctx.fillRect(0, 360, W, 130);
  ctx.fillStyle = '#fff'; ctx.font = `300 70px ${F}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('‹', 30, 420);
  const ag = ctx.createLinearGradient(90, 385, 160, 455); ag.addColorStop(0, '#F2A65A'); ag.addColorStop(1, '#E97E78');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(125, 425, 38, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `800 34px ${F}`; ctx.textAlign = 'center'; ctx.fillText('P', 125, 427);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = `700 38px ${F}`; ctx.fillText('Pedro', 182, 405);
  const status = (t >= RECORDING[0] && t < RECORDING[1]) ? 'gravando áudio…' : typing ? 'digitando…' : 'online';
  ctx.fillStyle = status === 'online' ? COL.sub : COL.me; ctx.font = `500 26px ${F}`; ctx.fillText(status, 182, 446);
  // header icons (generic)
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(890, 405, 46, 34, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(936, 416); ctx.lineTo(956, 405); ctx.lineTo(956, 439); ctx.lineTo(936, 428); ctx.stroke();
  ctx.beginPath(); ctx.arc(1012, 412, 6, 0, Math.PI * 2); ctx.arc(1012, 432, 6, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.beginPath(); ctx.arc(1012, 452, 6, 0, Math.PI * 2); ctx.fill();

  // ----- input bar -----
  ctx.fillStyle = COL.head; ctx.fillRect(0, 1600, W, 120);
  ctx.fillStyle = '#2c2c30'; ctx.beginPath(); ctx.roundRect(36, 1620, 860, 80, 40); ctx.fill();
  let typed = '';
  if (t >= INPUT_TYPING[0] && t < 17.0) { const n = Math.floor(prog(t, INPUT_TYPING[0], INPUT_TYPING[1]) * [...INPUT_TYPING[2]].length); typed = [...INPUT_TYPING[2]].slice(0, n).join(''); }
  ctx.font = `500 36px ${F}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = typed ? '#fff' : 'rgba(255,255,255,0.4)'; ctx.fillText(typed || 'Mensagem', 76, 1661);
  if (typed && Math.floor(t * 3) % 2 === 0) { const w = ctx.measureText(typed).width; ctx.fillStyle = COL.me; ctx.fillRect(80 + w, 1640, 4, 42); }
  ctx.fillStyle = COL.me; ctx.beginPath(); ctx.arc(980, 1660, 42, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#170c0b';
  if (typed) { ctx.beginPath(); ctx.moveTo(962, 1640); ctx.lineTo(1002, 1660); ctx.lineTo(962, 1680); ctx.lineTo(970, 1660); ctx.closePath(); ctx.fill(); }
  else { ctx.beginPath(); ctx.roundRect(970, 1636, 20, 34, 10); ctx.fill(); ctx.fillRect(978, 1672, 4, 12); }

  // ----- hook caption (meme style, always on) -----
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(60, 150, 960, 170, 26); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#0d0b0a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 46px ${F}`; ctx.fillText('quando seu amigo acha', 540, 205);
  ctx.font = `900 50px ${F}`; ctx.fillText('a camiseta do Djavan 😭', 540, 268);

  // ----- end card -----
  if (t >= END) {
    const p = eout(prog(t, END, END + 0.5));
    ctx.fillStyle = `rgba(0,0,0,${0.6 * p})`; ctx.fillRect(0, 340, W, H - 340);
    const cy = lerp(H + 50, 780, p);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50;
    ctx.fillStyle = '#F3EDE6'; ctx.beginPath(); ctx.roundRect(50, cy, 980, 1000, 48); ctx.fill(); ctx.restore();
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    const s = 0.36; ctx.drawImage(IMG.frente, 540 - 583 * s, cy + 250 - 760 * s, 1200 * s, 1600 * s); ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#0d0b0a';
    ctx.font = `800 40px ${F}`; ctx.fillText('A camiseta do Djavan', 540, cy + 545);
    ctx.font = `900 120px ${F}`; ctx.fillText('R$ 49,00', 540, cy + 650);
    ctx.fillStyle = '#C9524C'; ctx.font = `800 36px ${F}`; ctx.fillText('R$ 46,55 no Pix  ·  6x de R$ 8,17', 540, cy + 740);
    const cb = eback(prog(t, END + 0.5, END + 0.9)), pulse = 1 + 0.03 * Math.sin((t - END - 1) * 8) * clamp((t - END - 1) * 3);
    if (cb > 0) {
      ctx.save(); ctx.translate(540, cy + 860); ctx.scale(cb * pulse, cb * pulse);
      ctx.fillStyle = '#0d0b0a'; ctx.beginPath(); ctx.roundRect(-400, -60, 800, 120, 60); ctx.fill();
      ctx.fillStyle = '#F3EDE6'; ctx.font = `900 44px ${F}`; ctx.fillText('COMPRAR NA HGG  →', 0, 3); ctx.restore();
    }
  }
}

window.ready = (async () => {
  await Promise.all([load('frente', 'build/frente_2x.png'), load('foto', 'build/foto_modelo_2x.png')]);
  for (const f of ['600 40px Montserrat', '700 40px Montserrat', '800 40px Montserrat', '900 40px Montserrat', '500 40px Montserrat', 'italic 600 30px Montserrat', '40px "Noto Color Emoji"']) await document.fonts.load(f);
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
