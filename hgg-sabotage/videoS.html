<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>HGG Sabotage Rap e Compromisso</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Creative: HGG — Camiseta Streetwear Sabotage Rap É Compromisso (9:16, 23.2s). Same edit as the Djavan "Oceano" winner,
// re-synced to "Rap É Compromisso" cut 0:15.25–0:38.45 ("O rap é compromisso" 0.65 · hit on "compromisso" 12.23).
// Product pixels are drawn untouched: only scale/translate, never filters or color changes on product layers.
const W = 1080, H = 1920, DUR = 23.2;
const C = { bg0: '#0a0a0b', bg1: '#1b1a1d', white: '#ffffff', soft: 'rgba(255,255,255,0.72)', accent: '#E97E78' };
const ctx = document.getElementById('c').getContext('2d');

const IMG = {};
function load(name, src) {
  return new Promise((ok, err) => { const i = new Image(); i.onload = () => { IMG[name] = i; ok(); }; i.onerror = err; i.src = src; });
}

// ---------- easing / helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
// in/out envelope for an element visible between a and b
function env(t, a, b, fin = 0.35, fout = 0.25) {
  if (t < a || t > b) return 0;
  return Math.min(eout(prog(t, a, a + fin)), 1 - eio(prog(t, b - fout, b)));
}
// camera keyframes: [time, cx, cy, s, ay] -> interpolated with ease-in-out between keys
function cam(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, ...a] = keys[i], [t1, ...b] = keys[i + 1];
    if (t <= t1) { const p = eio(prog(t, t0, t1)); return a.map((v, k) => lerp(v, b[k], p)); }
  }
  return keys[keys.length - 1].slice(1);
}
// draw a 2x-resampled product image so that original point (cx,cy) sits at (540+dx, ay) with scale s (relative to 1200px source)
function drawProduct(img, cx, cy, s, ay, alpha = 1, dx = 0) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.translate(540 + dx, ay); ctx.scale(s / 2, s / 2); ctx.translate(-cx * 2, -cy * 2);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
const toScreen = (px, py, cx, cy, s, ay, dx = 0) => [540 + dx + (px - cx) * s, ay + (py - cy) * s];

function text(str, x, y, o = {}) {
  const { size = 60, weight = 800, color = C.white, align = 'center', alpha = 1, spacing = 0, family = 'Montserrat', italic = false, dy = 0, shadow = true, maxW = 0 } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px "${family}"`;
  ctx.letterSpacing = spacing + 'px';
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4; }
  ctx.fillStyle = color;
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { ctx.translate(x, y + dy); ctx.scale(maxW / w, 1); ctx.fillText(str, 0, 0); ctx.restore(); return; } }
  ctx.fillText(str, x, y + dy);
  ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// pill callout with leader line from an anchor on the product
function callout(label, ax, ay, px, py, a, side = 1) {
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '800 34px "Montserrat"'; ctx.letterSpacing = '1px';
  const tw = ctx.measureText(label).width, pw = tw + 56, ph = 74;
  const bx = side > 0 ? px : px - pw;
  // leader line (draws on)
  const lp = eout(clamp(a * 1.4));
  const ex = side > 0 ? bx : bx + pw, ey = py;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lerp(ax, ex, lp), lerp(ay, ey, lp)); ctx.stroke();
  // anchor ring
  ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(ax, ay, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(233,126,120,0.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(ax, ay, 9 + 14 * ((performance_t * 1.6) % 1), 0, Math.PI * 2); ctx.stroke();
  // pill
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  ctx.fillStyle = 'rgba(255,255,255,0.97)'; rrect(bx, py - ph / 2, pw, ph, ph / 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#0b0b0c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, bx + pw / 2, py + 2);
  ctx.restore();
}

// ---------- background ----------
function background(t, glow = 1, glowY = 900) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg1); g.addColorStop(0.55, C.bg0); g.addColorStop(1, '#050505');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft spotlight behind the product (separates black shirt from background)
  const r = ctx.createRadialGradient(540, glowY, 40, 540, glowY, 820);
  r.addColorStop(0, `rgba(120,118,128,${0.42 * glow})`); r.addColorStop(0.45, `rgba(70,68,76,${0.22 * glow})`); r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
  // background motif: slow sine waves (same look as the Djavan winner)
  ctx.save();
  for (let i = 0; i < 7; i++) {
    const y0 = 1380 + i * 62, amp = 16 + i * 3, ph = t * (0.55 + i * 0.07) + i;
    ctx.strokeStyle = `rgba(233,126,120,${0.05 + 0.012 * (6 - i)})`; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 12) { const y = y0 + Math.sin(x / 140 + ph) * amp + Math.sin(x / 61 - ph * 1.3) * amp * 0.25; x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
}
function lightSweep(t, a, b) {
  // diagonal light pass on the background only (drawn before the product)
  const p = prog(t, a, b); if (p <= 0 || p >= 1) return;
  const x = lerp(-600, W + 600, eio(p));
  ctx.save(); ctx.translate(x, H / 2); ctx.rotate(-0.35);
  const g = ctx.createLinearGradient(-260, 0, 260, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.10)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(-260, -1600, 520, 3200); ctx.restore();
}
function vignette() {
  const v = ctx.createRadialGradient(540, 960, 600, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function topShade(h = 620, a = 0.75) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
}
function bottomShade(from = 1300, a = 0.85) {
  const g = ctx.createLinearGradient(0, from, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, from, W, H - from);
}
function flash(t, at, d = 0.18, max = 0.55) {
  const p = prog(t, at - 0.02, at + d); if (p <= 0 || p >= 1) return;
  ctx.fillStyle = `rgba(255,255,255,${max * (1 - eout(p))})`; ctx.fillRect(0, 0, W, H);
}
function lyric(str, t, a, b, y = 1600) {
  const e = env(t, a, b, 0.5, 0.4);
  text(str, 540, y, { family: 'Playfair Display', italic: true, weight: 500, size: 46, color: 'rgba(255,255,255,0.9)', alpha: e, dy: (1 - e) * 14, maxW: 960 });
}
function progressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(0, H - 8, W, 8);
  ctx.fillStyle = C.accent; ctx.fillRect(0, H - 8, W * (t / DUR), 8);
}

let performance_t = 0;

// ---------- timeline (song cues: "O rap é compromisso" 0.65 · "Sabotage" 5.25 · "Sim, Brooklyn" 9.17 · "compromisso" 12.23 · "se pá fica esquisito" 14.37) ----------
const T = { hookEnd: 3.2, tourEnd: 8.3, ocean: 12.23, model: 14.0, back: 17.0, offer: 18.2, cta: 20.4 };

// flat front camera: [t, cx, cy, s, ay]
const FLAT = [
  [0.0, 590, 640, 2.35, 1090],
  [3.0, 590, 630, 2.05, 1090],
  [3.6, 575, 560, 2.6, 960],   // face / eyes
  [4.9, 575, 555, 2.68, 960],
  [5.4, 610, 880, 2.4, 900],   // "RESPEITO É PRA"
  [6.6, 612, 885, 2.46, 900],
  [7.1, 600, 990, 2.45, 960],  // "QUEM TEM."
  [8.3, 600, 985, 2.52, 960],
  [10.6, 583, 744, 0.80, 930], // full shirt reveal
  [14.0, 583, 744, 0.84, 930],
];
// model front, matched so the print stays in place at the cut
const MODEL = [
  [14.0, 595, 900, 1.12, 864],
  [15.0, 605, 820, 1.30, 960],
  [17.0, 605, 800, 1.36, 960],
];

function render(t) {
  performance_t = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (t < T.model) {
    // ===== S1–S3: flat front (hook, detail tour, reveal) =====
    const [cx, cy, s, ay] = cam(FLAT, t);
    background(t, t < T.tourEnd ? 0.35 : lerp(0.35, 1, prog(t, T.tourEnd, 10.6)), ay);
    lightSweep(t, 10.4, 11.9);
    // giant outlined COMPROMISSO behind the shirt, punches in on the sung word "compromisso"
    const oe = t >= T.ocean - 0.08 ? eback(prog(t, T.ocean - 0.08, T.ocean + 0.45)) : 0;
    if (oe > 0) {
      ctx.save(); ctx.globalAlpha = clamp(oe) * 0.9;
      ctx.translate(540, 840); ctx.scale(lerp(1.25, 1, clamp(oe)), lerp(1.25, 1, clamp(oe)));
      ctx.font = '900 104px "Montserrat"'; ctx.letterSpacing = '1px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(233,126,120,0.9)'; ctx.strokeText('COMPROMISSO', 0, -540);
      ctx.restore();
    }
    drawProduct(IMG.frente, cx, cy, s, ay);
    vignette();
    // hide the shirt hem during the macro tour
    const hem = 1 - prog(t, T.tourEnd - 0.2, T.tourEnd + 0.8);
    if (hem > 0) { ctx.save(); ctx.globalAlpha = hem; bottomShade(1380, 1); ctx.restore(); }

    // S1 hook
    const h = env(t, 0.15, T.hookEnd);
    topShade(560, 0.55 * h);
    text('FÃ DE SABOTAGE?', 540, 300, { size: 92, weight: 900, alpha: env(t, 0.15, T.hookEnd), dy: (1 - env(t, 0.15, T.hookEnd)) * 30, spacing: 1 });
    text('ISSO AQUI É PRA VOCÊ.', 540, 410, { size: 58, weight: 700, color: C.accent, alpha: env(t, 0.9, T.hookEnd), dy: (1 - env(t, 0.9, T.hookEnd)) * 24, spacing: 1 });

    // S2 detail tour callouts (anchors follow the camera)
    const S = (px, py) => toScreen(px, py, cx, cy, s, ay);
    { const [x, y] = S(470, 640); callout('ESTAMPA EXCLUSIVA', x, y, 120, 330, env(t, 3.75, 5.15), 1); }
    { const [x, y] = S(740, 860); callout('DTF EM ALTA DEFINIÇÃO', x, y, 960, 520, env(t, 5.55, 6.95), -1); }
    { const [x, y] = S(470, 1015); callout('RESISTENTE À LAVAGEM', x, y, 120, 430, env(t, 7.2, 8.4), 1); }

    // lyric line during the pull-back
    lyric('"sim, Brooklyn… o rap é compromisso"', t, 8.9, 13.9, 1600);

    // product name under the reveal
    const ne = env(t, T.ocean + 0.25, T.model);
    text('CAMISETA STREETWEAR', 540, 1455, { size: 52, weight: 900, alpha: ne, dy: (1 - ne) * 20, spacing: 4 });
    text('SABOTAGE · RAP É COMPROMISSO', 540, 1521, { size: 34, weight: 600, color: C.soft, alpha: ne, dy: (1 - ne) * 20, spacing: 6 });
    flash(t, T.ocean, 0.22, 0.35);
  } else if (t < T.back) {
    // ===== S4: model front =====
    const [cx, cy, s, ay] = cam(MODEL, t);
    background(t, 1, 900);
    const fade = prog(t, T.model, T.model + 0.35);
    if (fade < 1) { // match-dissolve from flat to model (print locked in place)
      const [fx, fy, fs, fay] = cam(FLAT, t);
      drawProduct(IMG.frente, fx, fy, fs, fay, 1 - eio(fade));
    }
    drawProduct(IMG.modeloFrente, cx, cy, s, ay, eio(fade));
    bottomShade(1500, 0.9);
    vignette();
    const S = (px, py) => toScreen(px, py, cx, cy, s, ay);
    { const [x, y] = S(600, 548); callout('GOLA REFORÇADA', x, y, 150, 470, env(t, 14.5, 17.0), 1); }
    { const [x, y] = S(960, 880); callout('CAIMENTO OVERSIZED', x, y, 1010, 690, env(t, 15.0, 17.0), -1); }
    { const [x, y] = S(360, 1290); callout('100% ALGODÃO FIO 30.1', x, y, 90, 1560, env(t, 15.5, 17.0), 1); }
    lyric('"não é viagem, se pá fica esquisito"', t, 13.4, 16.95, 1670);
  } else if (t < T.offer) {
    // ===== S5: back view, whip in =====
    background(t, 1, 900);
    const p = prog(t, T.back, T.back + 0.35);
    const dx = lerp(W * 0.9, 0, eout(p));
    const s = lerp(1.36, 1.3, prog(t, T.back, T.offer));
    // light motion trail during the whip
    if (p < 1) for (let k = 3; k >= 1; k--) drawProduct(IMG.modeloCostas, 600, 800, s, 960, 0.12, dx + k * 70 * (1 - p));
    drawProduct(IMG.modeloCostas, 600, 800, s, 960, 1, dx);
    bottomShade(1450, 0.9);
    vignette();
    const e = env(t, T.back + 0.2, T.offer + 0.05, 0.3, 0.15);
    text('TAMANHOS', 540, 1460, { size: 34, weight: 700, color: C.soft, alpha: e, spacing: 8 });
    text('M  ·  G  ·  GG', 540, 1530, { size: 72, weight: 900, alpha: e, dy: (1 - e) * 20, spacing: 4 });
  } else {
    // ===== S6/S7: offer + CTA =====
    const p = prog(t, T.offer, T.offer + 0.6);
    background(t, 1, 640);
    lightSweep(t, 18.4, 19.6);
    const bob = Math.sin((t - T.offer) * 2.2) * 8;
    const s = lerp(0.9, 0.56, eio(p)), ay = lerp(900, 640, eio(p)) + bob * eio(p);
    drawProduct(IMG.frente, 583, 760, s, ay);
    vignette();

    // logo
    const le = env(t, T.offer + 0.2, DUR + 1);
    if (le > 0) { ctx.save(); ctx.globalAlpha = le; ctx.drawImage(IMG.logo, 540 - 136 * 0.85, 175 - 63 * 0.85 + (1 - le) * -20, 272 * 0.85, 126 * 0.85); ctx.restore(); }

    // price block (R$ 59, sem cupom / sem Pix)
    const a1 = env(t, T.offer + 0.35, DUR + 1);
    text('POR APENAS', 540, 1060, { size: 36, weight: 700, color: C.soft, alpha: a1, dy: (1 - a1) * 20, spacing: 8 });
    const pe = prog(t, T.offer + 0.7, T.offer + 1.15);
    if (pe > 0) text('R$ 59,00', 540, 1175, { size: 160, weight: 900, alpha: clamp(pe * 3), scale: lerp(1.5, 1, eback(pe)), spacing: -2 });
    // 6x badge
    const bp = eback(prog(t, T.offer + 1.45, T.offer + 1.9));
    if (bp > 0) {
      ctx.save(); ctx.translate(872, 1046); ctx.rotate(0.08); ctx.scale(bp, bp);
      ctx.fillStyle = C.accent; rrect(-92, -40, 184, 80, 40); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '900 38px "Montserrat"'; ctx.letterSpacing = '1px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('EM 6X', 0, 2);
      ctx.restore();
    }
    const a3 = env(t, T.offer + 1.6, DUR + 1);
    text('ou 6x de R$ 9,83 sem juros', 540, 1300, { size: 48, weight: 800, color: C.accent, alpha: a3, dy: (1 - a3) * 20, spacing: 0.5 });
    const a4 = env(t, T.offer + 1.9, DUR + 1);
    text('TAMANHOS M  ·  G  ·  GG', 540, 1370, { size: 32, weight: 700, color: C.soft, alpha: a4, dy: (1 - a4) * 20, spacing: 3 });
    // shipping strip
    const a5 = env(t, T.offer + 2.25, DUR + 1);
    if (a5 > 0) {
      ctx.save(); ctx.globalAlpha = a5; ctx.translate(0, (1 - a5) * 20);
      ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2.5;
      rrect(150, 1428, 780, 70, 14); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();
      text('ENVIO NO MESMO DIA  ·  PEDIDOS ATÉ 13H', 540, 1464, { size: 28, weight: 800, alpha: a5, dy: (1 - a5) * 20, spacing: 1, maxW: 740 });
    }
    // CTA button
    const ce = eback(prog(t, T.cta, T.cta + 0.5));
    if (ce > 0) {
      const pulse = 1 + 0.035 * Math.sin((t - T.cta) * 7) * clamp((t - T.cta - 0.5) * 2);
      ctx.save(); ctx.translate(540, 1580); ctx.scale(ce * pulse, ce * pulse);
      ctx.shadowColor = 'rgba(233,126,120,0.55)'; ctx.shadowBlur = 40;
      ctx.fillStyle = '#ffffff'; rrect(-380, -58, 760, 116, 58); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = '#0b0b0c'; ctx.font = '900 44px "Montserrat"'; ctx.letterSpacing = '2px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('GARANTA A SUA  →', 0, 3);
      ctx.restore();
    }
    const a6 = env(t, T.cta + 0.35, DUR + 1);
    text('COMPRA 100% SEGURA  ·  TROCA FÁCIL', 540, 1690, { size: 28, weight: 700, color: C.soft, alpha: a6, spacing: 2 });
  }
  progressBar(t);
}

window.ready = (async () => {
  await Promise.all([
    load('frente', 'build/frente_2x.png'),
    load('modeloFrente', 'build/modelo_frente_2x.png'),
    load('modeloCostas', 'build/modelo_costas_2x.png'),
    load('logo', 'build/logo_white.svg'),
  ]);
  await document.fonts.load('900 40px "Montserrat"'); await document.fonts.load('800 40px "Montserrat"');
  await document.fonts.load('700 40px "Montserrat"'); await document.fonts.load('600 40px "Montserrat"');
  await document.fonts.load('italic 500 40px "Playfair Display"');
  await document.fonts.ready;
  render(0);
  return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
