<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>HGG Sabotage Compromisso E</title>
<link href="fonts/fontsC.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Creative SE — the bold-caption edit of the Djavan E/F winners, rebuilt for Sabotage from the product photos
// (no client footage for this tee) and cut to "Rap É Compromisso" (clip from 0:15.25; "compromisso" lands at 12.23).
// Structure: hook in frame 1, fabric, print details, reveal on the hit, checklist, offer + CTA.
// Product photos are only scaled/moved/rotated as a whole (handheld camera); pixels untouched.
const W = 1080, H = 1920, DUR = 22.0;
const ctx = document.getElementById('c').getContext('2d');
const IMG = {};
const load = (n, src) => new Promise((ok, er) => { const i = new Image(); i.onload = () => { IMG[n] = i; ok(); }; i.onerror = er; i.src = src; });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const env = (t, a, b, fin = 0.15, fout = 0.15) => (t < a || t > b) ? 0 : Math.min(eout(prog(t, a, a + fin)), 1 - eio(prog(t, b - fout, b)));

// song cue (clip time): "compromisso" 12.23
const HIT = 12.23;
// shots: [t0, img, keys [[t, cx, cy, s]...]] — cx, cy in 1200x1600 photo coords placed at screen centre
const SHOTS = [
  [0.00, 'frente', [[0.00, 600, 700, 1.55], [1.17, 600, 690, 1.68]]],                       // hook: the print
  [1.17, 'modelo', [[1.17, 605, 1000, 1.3], [2.56, 605, 980, 1.4]]],                        // worn
  [2.56, 'costas', [[2.56, 590, 820, 1.3], [5.34, 590, 790, 1.55]]],                        // fabric (plain back)
  [5.34, 'frente', [[5.34, 620, 600, 2.9], [8.12, 615, 580, 2.6]]],                         // portrait detail
  [8.12, 'frente', [[8.12, 600, 940, 2.35], [11.6, 600, 930, 2.55]]],                       // lettering detail
  [11.6, 'frente', [[11.6, 600, 930, 2.55], [12.23, 600, 760, 4.2]]],                       // whip-in before the hit
  [HIT, 'modelo', [[HIT, 605, 860, 1.0], [15.78, 605, 880, 1.12]]],                         // REVEAL on "compromisso"
  [15.78, 'costasModelo', [[15.78, 600, 1000, 1.15], [18.56, 600, 980, 1.22]]],            // back / oversized fit
  [18.56, 'frente', [[18.56, 590, 1220, 0.62], [22.0, 590, 1215, 0.65]]],                   // offer
];
function camKeys(K, t) {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 0; i < K.length - 1; i++) { const [t0, ...a] = K[i], [t1, ...b] = K[i + 1]; if (t <= t1) { const p = eio(prog(t, t0, t1)); return a.map((v, k) => lerp(v, b[k], p)); } }
  return K[K.length - 1].slice(1);
}
function shake(t, amp) {
  return [amp * (Math.sin(t * 37) * 0.6 + Math.sin(t * 23 + 1) * 0.4), amp * (Math.sin(t * 31 + 2) * 0.6 + Math.sin(t * 19) * 0.4)];
}
function handheld(t) { return [4 * Math.sin(1.3 * t) + 2 * Math.sin(3.1 * t + 1), 4 * Math.sin(1.1 * t + 2) + 2 * Math.sin(2.7 * t)]; }

function linkSticker(x, y, w, h, line1) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(h / 2, 30)); ctx.fill();
  ctx.shadowColor = 'transparent';
  const ix = x + 52, iy = y + h / 2;
  ctx.strokeStyle = '#2F80ED'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.save(); ctx.translate(ix, iy); ctx.rotate(-Math.PI / 4);
  ctx.beginPath(); ctx.roundRect(-22, -11, 26, 22, 11); ctx.stroke(); ctx.beginPath(); ctx.roundRect(-4, -11, 26, 22, 11); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#111'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '700 44px Montserrat'; ctx.fillText(line1, x + 96, iy + 2);
  ctx.restore();
}

function drawPhotos(t) {
  let si = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) si = i;
  const [t0, name, K] = SHOTS[si];
  let [cx, cy, z] = camKeys(K, t);
  z *= 1 + 0.09 * (1 - eout(prog(t, t0, t0 + 0.2))) * (si > 0 ? 1 : 0);   // punch-in on cut
  if (t >= HIT) z *= 1 + 0.10 * (1 - eout(prog(t, HIT, HIT + 0.45)));       // impact zoom
  const [hx, hy] = handheld(t);
  const imp = t >= HIT ? (1 - prog(t, HIT, HIT + 0.45)) : 0;
  const [sx, sy] = shake(t, 22 * imp);
  const whip = si === 5 ? prog(t, 11.6, HIT) : 0;                           // motion blur on the whip-in
  ctx.save();
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.translate(540 + hx + sx, 960 + hy + sy); ctx.scale(z / 2, z / 2); ctx.translate(-cx * 2, -cy * 2);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if (whip > 0.05) ctx.filter = `blur(${(whip * whip * 9).toFixed(1)}px)`;
  ctx.drawImage(IMG[name], 0, 0);
  ctx.restore();
  return si;
}

// ---------- typography ----------
function stroked(str, x, y, o = {}) {
  const { size = 96, color = '#fff', scale = 1, alpha = 1, sw = 16, rot = 0, maxW = 1000, align = 'center' } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `900 ${size}px Montserrat`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const w = ctx.measureText(str).width; if (w > maxW) ctx.scale(maxW / w, maxW / w);
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.lineWidth = sw; ctx.strokeStyle = '#000'; ctx.strokeText(str, 0, 0);
  ctx.shadowColor = 'transparent'; ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function chip(str, x, y, o = {}) {
  const { size = 40, alpha = 1, bg = '#FFD60A', color = '#000', scale = 1, align = 'center' } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `800 ${size}px Montserrat`; ctx.textBaseline = 'middle';
  const w = ctx.measureText(str).width + 56, h = size + 36, bx = align === 'left' ? 0 : -w / 2;
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(bx, -h / 2, w, h, 18); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(str, bx + w / 2, 3);
  ctx.restore();
}
const pop = (t, a, d = 0.28) => t < a ? 0 : eback(prog(t, a, a + d));
function check(str, x, y, t, a) { // checklist row with tick
  const p = pop(t, a, 0.3); if (p <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
  ctx.fillStyle = '#FFD60A'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 1); ctx.lineTo(-3, 12); ctx.lineTo(16, -10); ctx.stroke();
  ctx.restore();
  stroked(str, x + 60, y + 2, { size: 58, scale: p, align: 'left', sw: 13 });
}
function logo(alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 16;
  ctx.drawImage(IMG_LOGO, 60, 120, 136 * 1.05, 63 * 1.05);
  ctx.restore();
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawPhotos(t);
  if (t < 18.56 && !(t >= HIT && t < 15.78)) linkSticker(267, 1640, 557, 107, 'hggstyle.com.br');
  // readability gradients (top + bottom, light)
  let g = ctx.createLinearGradient(0, 0, 0, 560); g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 560);
  logo(1);

  // ===== HOOK (0–2.56): product + artist + brand in the first second =====
  const hk = 1 - prog(t, 2.42, 2.56);
  if (t < 2.56) {
    stroked('A CAMISETA', 540, 330, { size: 112, scale: (t < 0.02 ? 1 : pop(t, -0.2, 0.22)) * hk });
    stroked('DO SABOTAGE', 540, 455, { size: 138, color: '#FFD60A', scale: (t < 0.02 ? 1 : pop(t, -0.12, 0.25)) * hk, sw: 18 });
    chip('CHEGOU NA HGG', 540, 585, { scale: (t < 0.02 ? 1 : pop(t, -0.05)) * hk, bg: '#fff' });
    // price sticker
    const sp = pop(t, 0.6, 0.3) * hk;
    if (sp > 0) {
      ctx.save(); ctx.translate(880, 820); ctx.rotate(0.16 + Math.sin(t * 6) * 0.03); ctx.scale(sp, sp);
      ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 24; ctx.fillStyle = '#E8473F'; ctx.beginPath(); ctx.arc(0, 0, 125, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 26px Montserrat'; ctx.fillText('SÓ', 0, -56); ctx.font = '900 72px Montserrat'; ctx.fillText('R$ 59', 0, 2);
      ctx.font = '800 26px Montserrat'; ctx.fillText('6x S/ JUROS', 0, 58); ctx.restore();
    }
  }
  // ===== touch / fabric (2.56–5.34) =====
  if (t >= 2.56 && t < 5.34) {
    chip('SENTE ESSE TECIDO', 540, 330, { scale: pop(t, 2.6), alpha: env(t, 2.56, 5.34, 0.01, 0.12), bg: '#fff' });
    stroked('100% ALGODÃO', 540, 470, { size: 104, color: '#FFD60A', scale: pop(t, 2.9) * env(t, 2.56, 5.34, 0.01, 0.12) });
    stroked('FIO 30.1 · MACIO E ENCORPADO', 540, 575, { size: 54, scale: pop(t, 3.26) * env(t, 2.56, 5.34, 0.01, 0.12), sw: 12 });
  }
  // ===== production story (5.34–11.6) =====
  if (t >= 5.34 && t < 11.6) {
    const a = env(t, 5.34, 11.6, 0.01, 0.15);
    chip('COMO ELA É FEITA:', 540, 330, { scale: pop(t, 5.36) * a, bg: '#fff' });
    if (t < 8.12) stroked('PRODUÇÃO PRÓPRIA', 540, 470, { size: 100, color: '#FFD60A', scale: pop(t, 5.7) * env(t, 5.34, 8.12, 0.01, 0.12) });
    else {
      stroked('ESTAMPA DTF', 540, 470, { size: 112, color: '#FFD60A', scale: pop(t, 8.14) * a });
      stroked('EM ALTA DEFINIÇÃO', 540, 580, { size: 70, scale: pop(t, 8.5) * a, sw: 13 });
    }
  }
  // ===== reveal on "compromisso" (12.23–15.78) — lower third keeps the model's face clear =====
  if (t >= HIT && t < 15.78) {
    const a = env(t, HIT, 15.78, 0.01, 0.15);
    stroked('RAP É COMPROMISSO', 540, 1560, { size: 84, maxW: 940, color: '#FFD60A', scale: pop(t, HIT, 0.3) * a, sw: 18 });
    chip('estampa resistente à lavagem', 540, 1690, { scale: pop(t, 12.95) * a, size: 40 });
  }
  // ===== back / fit (15.78–18.56): checklist =====
  if (t >= 15.78 && t < 18.56) {
    const a = env(t, 15.78, 18.56, 0.01, 0.12);
    ctx.save(); ctx.globalAlpha = a;
    check('OVERSIZED', 140, 330, t, 15.8);
    check('GOLA REFORÇADA', 140, 450, t, 16.47);
    check('TAMANHOS M · G · GG', 140, 570, t, 17.17);
    ctx.restore();
  }
  // ===== offer + CTA (18.56–22) =====
  if (t >= 18.56) {
    const b = eout(prog(t, 18.56, 18.9));
    ctx.save(); ctx.globalAlpha = 0.72 * b; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(50, 1060, 980, 720, 44); ctx.fill(); ctx.restore();
    g = ctx.createLinearGradient(0, 980, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.45, `rgba(0,0,0,${0.55 * b})`); g.addColorStop(1, `rgba(0,0,0,${0.8 * b})`);
    ctx.fillStyle = g; ctx.fillRect(0, 980, W, H - 980);
    stroked('A CAMISETA DO SABOTAGE', 540, 250, { size: 62, scale: pop(t, 18.6), sw: 13 });
    // price (R$ 59, sem cupom)
    stroked('POR APENAS', 540, 1150, { size: 58, color: 'rgba(255,255,255,0.85)', scale: pop(t, 18.75), sw: 11 });
    stroked('R$ 59,00', 540, 1285, { size: 170, color: '#FFD60A', scale: pop(t, 19.1, 0.3) * (1 + 0.06 * (1 - prog(t, 19.7, 19.95)) * (t > 19.7 ? 1 : 0)), sw: 20 });
    chip('ou 6x de R$ 9,83 sem juros', 540, 1430, { scale: pop(t, 19.85), size: 40, bg: '#fff' });
    chip('Envio no mesmo dia (pedidos até 13h)', 540, 1535, { scale: pop(t, 20.1), size: 32 });
    // CTA
    const cp = pop(t, 20.4, 0.35);
    if (cp > 0) {
      const pulse = 1 + 0.035 * Math.sin((t - 20.75) * 8) * clamp((t - 20.75) * 3);
      ctx.save(); ctx.translate(540, 1665); ctx.scale(cp * pulse, cp * pulse);
      ctx.shadowColor = 'rgba(232,71,63,0.6)'; ctx.shadowBlur = 40; ctx.fillStyle = '#E8473F';
      ctx.beginPath(); ctx.roundRect(-430, -62, 860, 124, 62); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.fillStyle = '#fff'; ctx.font = '900 44px Montserrat'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('COMPRE NO SITE DA HGG', 0, 3); ctx.restore();
      // bouncing arrow pointing to the ad's button
      const ay = 1790 + Math.abs(Math.sin((t - 20.45) * 5)) * 22;
      ctx.save(); ctx.globalAlpha = clamp(cp); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(540 - 36, ay - 26); ctx.lineTo(540 + 36, ay - 26); ctx.lineTo(540, ay + 18); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  // flashes on the hit and on the offer
  let f = 0;
  [[HIT, 0.75], [18.56, 0.35], [5.34, 0.25]].forEach(([a, m]) => { const p = prog(t, a - 0.005, a + 0.2); if (p > 0 && p < 1) f = Math.max(f, m * (1 - eout(p))); });
  if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
  // progress bar (retention cue)
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, H - 10, W, 10);
  ctx.fillStyle = '#FFD60A'; ctx.fillRect(0, H - 10, W * (t / DUR), 10);
}

let IMG_LOGO;
window.ready = (async () => {
  IMG_LOGO = new Image(); IMG_LOGO.src = 'build/logo_white.svg'; await IMG_LOGO.decode();
  await Promise.all([load('frente', 'build/foto_frente_2x.png'), load('modelo', 'build/foto_modelo_2x.png'), load('costas', 'build/foto_costas_2x.png'), load('costasModelo', 'build/foto_costas_modelo_2x.png')]);
  for (const f of ['900 40px Montserrat', '800 40px Montserrat', '700 40px Montserrat', '600 40px Montserrat']) await document.fonts.load(f);
  await document.fonts.ready; render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
