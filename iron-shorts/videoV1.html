<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Iron Shorts V1 Apresentador</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="build/v1_words.js"></script>
<script>
// Creative V1 — presenter (client footage, re-cut to 34s) + offer graphics.
// Hook in frame 1 (product + "de fábrica" + price + Fortaleza), kinetic captions, 5-wash card,
// "fabricação própria" stamp, KIT 3 = R$ 165 card with Adobe cutouts, frete/entrega/pagamento/loja,
// end card with WhatsApp CTA. Critical content kept inside y 285–1250 (Reels UI + 4:5 feed crop).
const W = 1080, H = 1920, DUR = 35.4, FPS_SRC = 30, NFR = 1018;
const NAVY = '#13233F', NAVY_D = '#0A1426', GOLD = '#D9AE62', GOLD_D = '#B8893F', CREAM = '#F4EFE7', WA = '#25D366';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const env = (t, a, b, fin = 0.15, fout = 0.15) => (t < a || t > b) ? 0 : Math.min(eout(prog(t, a, a + fin)), 1 - eio(prog(t, b - fout, b)));
const pop = (t, a, d = 0.3) => t < a ? 0 : eback(prog(t, a, a + d));

// ---------- footage ----------
// visual cuts in the re-cut timeline (scene detection) -> camera punch-ins
const SHOTS = [[0, 1.00, 1.07], [7.0, 1.04, 1.10], [14.9, 1.02, 1.08], [17.03, 1.00, 1.07], [22.0, 1.00, 1.06], [26.9, 1.02, 1.08], [29.85, 1.06, 1.12]];
const HITS = [0, 18.97, 29.85]; // impact moments (shake)
const cache = new Map();
function frameImg(idx) {
  const n = clamp(idx, 1, NFR);
  if (!cache.has(n)) {
    const im = new Image(); im.src = `ugc/frames/v1/${String(n).padStart(4, '0')}.jpg`;
    cache.set(n, im.decode().then(() => im));
    if (cache.size > 30) cache.delete(cache.keys().next().value);
  }
  return cache.get(n);
}
const shake = (t, a) => [a * (Math.sin(t * 37) * 0.6 + Math.sin(t * 23 + 1) * 0.4), a * (Math.sin(t * 31 + 2) * 0.6 + Math.sin(t * 19) * 0.4)];
async function drawFootage(t, blurPx) {
  let si = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) si = i;
  const [t0, z0, z1] = SHOTS[si], t1 = si + 1 < SHOTS.length ? SHOTS[si + 1][0] : DUR;
  let z = lerp(z0, z1, eio(prog(t, t0, t1)));
  if (si > 0) z *= 1 + 0.07 * (1 - eout(prog(t, t0, t0 + 0.25)));
  let imp = 0; HITS.forEach(h => { if (t >= h) imp = Math.max(imp, 1 - prog(t, h, h + 0.4)); });
  const [sx, sy] = shake(t, 16 * imp);
  const img = await frameImg(Math.floor(t * FPS_SRC) + 1);
  ctx.save();
  ctx.translate(540 + sx + 3 * Math.sin(1.3 * t), 960 + sy + 3 * Math.sin(1.1 * t + 2)); ctx.scale(z, z); ctx.translate(-540, -960);
  ctx.filter = `contrast(1.07) saturate(1.12)${blurPx ? ` blur(${blurPx}px)` : ''}`;
  ctx.drawImage(img, 0, 0, W, H);
  ctx.restore(); ctx.filter = 'none';
}

// ---------- primitives ----------
function rr(x, y, w, h, r, fill, shadow = 0.35) {
  ctx.save(); if (shadow) { ctx.shadowColor = `rgba(0,0,0,${shadow})`; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; }
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); ctx.restore();
}
function txt(str, x, y, o = {}) {
  const { size = 60, weight = 900, color = '#fff', align = 'center', maxW = 960, stroke = 0, sc = '#000', ls = 0 } = o;
  ctx.save(); ctx.font = `${weight} ${size}px Montserrat`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.letterSpacing = `${ls}px`;
  const w = ctx.measureText(str).width; ctx.translate(x, y); if (w > maxW) ctx.scale(maxW / w, maxW / w);
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = sc; ctx.strokeText(str, 0, 0); }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0); ctx.restore();
}
const tw = (str, size, weight = 900) => { ctx.save(); ctx.font = `${weight} ${size}px Montserrat`; const w = ctx.measureText(str).width; ctx.restore(); return w; };
function scaled(x, y, s, fn, alpha = 1, rot = 0) { if (s <= 0 || alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); fn(); ctx.restore(); }

// ---------- icons (drawn centered at 0,0, ~size s) ----------
function iPin(s, c) { ctx.save(); ctx.scale(s / 100, s / 100); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 50); ctx.bezierCurveTo(-10, 30, -36, 6, -36, -16); ctx.arc(0, -16, 36, Math.PI, 0); ctx.bezierCurveTo(36, 6, 10, 30, 0, 50); ctx.fill(); ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(0, -16, 14, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function iCheck(s, bg, fg) { ctx.save(); ctx.scale(s / 100, s / 100); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = fg; ctx.lineWidth = 13; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(-6, 18); ctx.lineTo(24, -14); ctx.stroke(); ctx.restore(); }
function iTruck(s, c) {
  ctx.save(); ctx.scale(s / 100, s / 100); ctx.fillStyle = c;
  ctx.beginPath(); ctx.roundRect(-50, -30, 58, 46, 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(12, -16); ctx.lineTo(34, -16); ctx.lineTo(50, 2); ctx.lineTo(50, 16); ctx.lineTo(12, 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = c; [-30, 30].forEach(x => { ctx.beginPath(); ctx.arc(x, 22, 12, 0, Math.PI * 2); ctx.fill(); });
  ctx.globalCompositeOperation = 'destination-out'; [-30, 30].forEach(x => { ctx.beginPath(); ctx.arc(x, 22, 5, 0, Math.PI * 2); ctx.fill(); });
  ctx.beginPath(); ctx.roundRect(20, -9, 14, 11, 2); ctx.fill(); ctx.restore();
}
function iBolt(s, c) { ctx.save(); ctx.scale(s / 100, s / 100); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(10, -50); ctx.lineTo(-30, 8); ctx.lineTo(-2, 8); ctx.lineTo(-12, 50); ctx.lineTo(30, -10); ctx.lineTo(2, -10); ctx.closePath(); ctx.fill(); ctx.restore(); }
function iCard(s, c) { ctx.save(); ctx.scale(s / 100, s / 100); ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(-48, -32, 96, 64, 10); ctx.fill(); ctx.globalCompositeOperation = 'destination-out'; ctx.fillRect(-48, -18, 96, 12); ctx.beginPath(); ctx.roundRect(-36, 10, 30, 10, 3); ctx.fill(); ctx.restore(); }
function iWA(s) {
  ctx.save(); ctx.scale(s / 100, s / 100);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -2, 44, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, 26); ctx.lineTo(-46, 46); ctx.lineTo(-10, 38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = WA; ctx.beginPath(); ctx.arc(0, -2, 35, 0, Math.PI * 2); ctx.fill();
  // handset
  ctx.fillStyle = '#fff'; ctx.save(); ctx.rotate(-0.5);
  ctx.beginPath(); ctx.roundRect(-9, -22, 18, 44, 7); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-15, -26, 30, 14, 6); ctx.fill(); ctx.beginPath(); ctx.roundRect(-15, 12, 30, 14, 6); ctx.fill();
  ctx.restore(); ctx.restore();
}

// ---------- captions ----------
const KEY = /^(caimento|perfeito|confortável|modelos|fabricação|própria|3|peças|kit|frete|grátis|fortaleza|dia|útil|whatsapp|jeans)$/i;
const CHUNKS = (() => {
  const out = []; let cur = [];
  WORDS.forEach((w, i) => {
    const prev = WORDS[i - 1];
    if (cur.length && (cur.length >= 3 || /[.,]$/.test(prev.w) || w.s - prev.e > 0.3)) { out.push(cur); cur = []; }
    cur.push(w);
  });
  if (cur.length) out.push(cur);
  return out.map((c, i) => ({ words: c, s: c[0].s, e: i + 1 < out.length ? Math.min(out[i + 1][0].s, c[c.length - 1].e + 0.35) : c[c.length - 1].e + 0.4 }));
})();
function captions(t) {
  if (t < 2.7 || t >= 29.85) return;
  const ch = CHUNKS.find(c => t >= c.s && t < c.e); if (!ch) return;
  const size = 66, gap = 20, pad = 22;
  const ws = ch.words.map(w => w.w.replace(/[.,]$/, '').toUpperCase());
  const widths = ws.map(w => tw(w, size));
  const total = widths.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
  const p = pop(t, ch.s, 0.22), y = 1175;
  scaled(540, y, 0.85 + 0.15 * p, () => {
    let x = -total / 2;
    ws.forEach((w, i) => {
      const wd = ch.words[i], active = t >= wd.s - 0.03 && (t < wd.e + 0.05 || i === ws.length - 1 && t < ch.e);
      if (active) rr(x - pad / 1.5, -size / 2 - 14, widths[i] + pad * 1.33, size + 28, 16, GOLD, 0.3);
      txt(w, x + widths[i] / 2, 3, { size, color: active ? NAVY_D : (KEY.test(w) ? GOLD : '#fff'), stroke: active ? 0 : 14, maxW: 2000 });
      x += widths[i] + gap;
    });
  }, clamp(p * 3));
}

// ---------- persistent location tag ----------
function locTag(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const label = 'FORTALEZA · LOJA FÍSICA', w = tw(label, 28, 800) + 92;
  rr(40, 270, w, 62, 31, 'rgba(10,20,38,0.88)', 0.25);
  ctx.save(); ctx.translate(78, 301); iPin(40, GOLD); ctx.restore();
  txt(label, 106, 302, { size: 28, weight: 800, color: '#fff', align: 'left', ls: 1 });
  ctx.restore();
}

// ---------- scenes ----------
function hook(t) {
  const out = 1 - eio(prog(t, 2.5, 2.75)); if (out <= 0) return;
  const first = t < 0.03 ? 1 : 0; // frame 1 fully built (thumbnail / autoplay frame)
  ctx.save(); ctx.globalAlpha = out;
  // location pill
  scaled(540, 312, first || pop(t, 0.0, 0.3), () => {
    const label = 'FORTALEZA · CE', w = tw(label, 34, 800) + 110;
    rr(-w / 2, -36, w, 72, 36, GOLD, 0.3);
    ctx.save(); ctx.translate(-w / 2 + 44, 0); iPin(46, NAVY_D); ctx.restore();
    txt(label, 22, 2, { size: 34, weight: 800, color: NAVY_D, ls: 2 });
  });
  // headline band
  const b = first || eout(prog(t, 0, 0.25));
  ctx.save(); ctx.globalAlpha *= 0.9; ctx.fillStyle = NAVY_D; ctx.beginPath(); ctx.roundRect(540 - 500 * b, 618, 1000 * b, 270, 28); ctx.fill(); ctx.restore();
  scaled(540, 690, first || pop(t, 0.05, 0.3), () => txt('CALÇA JEANS', 0, 0, { size: 128, color: '#fff' }));
  scaled(540, 818, first || pop(t, 0.18, 0.3), () => txt('DE FÁBRICA', 0, 0, { size: 112, color: GOLD }));
  // price sticker
  const sp = first || pop(t, 0.35, 0.32);
  scaled(850, 1010, sp, () => {
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 26;
    ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(0, 0, 138, 0, Math.PI * 2); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.strokeStyle = NAVY_D; ctx.lineWidth = 4; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.arc(0, 0, 122, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    txt('A PARTIR DE', 0, -62, { size: 26, weight: 800, color: NAVY_D });
    txt('R$ 60', 0, 4, { size: 88, color: NAVY_D });
    txt('KIT 3 = R$ 165', 0, 70, { size: 25, weight: 800, color: NAVY_D });
  }, 1, 0.12 + Math.sin(t * 5) * 0.03);
  ctx.restore();
}
function navyCard(x, y, w, h, a = 0.92) { rr(x, y, w, h, 34, `rgba(10,20,38,${a})`, 0.35); ctx.save(); ctx.strokeStyle = 'rgba(217,174,98,0.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x + 1.5, y + 1.5, w - 3, h - 3, 33); ctx.stroke(); ctx.restore(); }

function lavagens(t) { // 7.75–10.3 "vários modelos de calça jeans"
  const a = env(t, 7.72, 10.3, 0.01, 0.2); if (a <= 0) return;
  const p = pop(t, 7.72, 0.35);
  scaled(540, 640, 0.7 + 0.3 * p, () => {
    navyCard(-470, -150, 940, 300);
    txt('5 LAVAGENS', 0, -88, { size: 74, color: GOLD });
    const cols = [['#8FB0CC', 'CLARA'], ['#3F6FA0', 'ESCURA'], ['#1D2C55', 'AZUL AMAC.'], ['#5B5F66', 'PRETA MARM.'], ['#16171B', 'PRETA AMAC.']];
    cols.forEach(([c, n], i) => {
      const x = -360 + i * 180, q = pop(t, 7.95 + i * 0.12, 0.3);
      scaled(x, 6, q, () => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke(); });
      txt(n, x, 70, { size: 22, weight: 800, color: '#fff', maxW: 170 });
    });
    txt('TAMANHOS 38 · 40 · 42 · 44 · 46', 0, 118, { size: 30, weight: 800, color: CREAM });
  }, a);
}
function fabrica(t) { // 10.38–14.75 "fabricação própria"
  const a = env(t, 10.36, 14.75, 0.01, 0.2); if (a <= 0) return;
  const p = t < 10.36 ? 0 : (t < 10.6 ? lerp(2.2, 1, eout(prog(t, 10.36, 10.6))) : 1);
  scaled(540, 650, p, () => {
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30;
    ctx.fillStyle = NAVY_D; ctx.beginPath(); ctx.roundRect(-430, -120, 860, 240, 30); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.strokeStyle = GOLD; ctx.lineWidth = 7; ctx.beginPath(); ctx.roundRect(-414, -104, 828, 208, 22); ctx.stroke();
    txt('FABRICAÇÃO', 0, -38, { size: 92, color: '#fff' });
    txt('PRÓPRIA', 0, 52, { size: 92, color: GOLD });
  }, a * clamp(prog(t, 10.36, 10.45) * 1), -0.06);
  // sub chip
  scaled(540, 840, pop(t, 11.5, 0.3), () => { const s = 'PREÇO DIRETO DA FÁBRICA', w = tw(s, 36, 800) + 64; rr(-w / 2, -36, w, 72, 36, GOLD, 0.3); txt(s, 0, 2, { size: 36, weight: 800, color: NAVY_D }); }, a);
}
function kit(t) { // 16.3–19.9
  const a = env(t, 16.3, 19.92, 0.01, 0.18); if (a <= 0) return;
  const p = pop(t, 16.3, 0.35);
  scaled(540, 730, 0.75 + 0.25 * p, () => {
    rr(-470, -350, 940, 700, 40, CREAM, 0.45);
    ctx.save(); ctx.beginPath(); ctx.roundRect(-470, -350, 940, 700, 40); ctx.clip();
    ctx.fillStyle = NAVY; ctx.fillRect(-470, -350, 940, 130); ctx.restore();
    txt('LEVANDO 3 OU MAIS', 0, -312, { size: 30, weight: 800, color: GOLD, ls: 3 });
    txt('KIT 3 CALÇAS JEANS', 0, -260, { size: 60, color: '#fff' });
    // jeans cutouts drop in on "três" / "peças"
    const CUTS = [[IMG.azul, -250, -0.07, 16.85], [IMG.preta, 0, 0, 17.05], [IMG.marmo, 250, 0.07, 17.25]];
    CUTS.forEach(([im, x, r, ta], i) => {
      const q = t < ta ? 0 : eback(prog(t, ta, ta + 0.35)); if (q <= 0) return;
      const h = 360, w = h * im.width / im.height;
      ctx.save(); ctx.translate(x, -20 - (1 - q) * 160); ctx.rotate(r); ctx.globalAlpha *= clamp(q * 2);
      ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 10;
      ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.shadowColor = 'transparent';
      ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(w / 2 - 30, -h / 2 + 30, 30, 0, Math.PI * 2); ctx.fill();
      txt(String(i + 1), w / 2 - 30, -h / 2 + 32, { size: 36, color: NAVY_D });
      ctx.restore();
    });
    // price on "kit"
    const pp = t < 18.95 ? 0 : (t < 19.2 ? lerp(1.8, 1, eout(prog(t, 18.95, 19.2))) : 1);
    if (pp > 0) {
      ctx.save(); ctx.translate(0, 250); ctx.scale(pp, pp);
      txt('R$ 165', -150, 0, { size: 128, color: NAVY });
      txt('SAI R$ 55', 250, -26, { size: 44, color: GOLD_D });
      txt('CADA CALÇA', 250, 26, { size: 30, weight: 800, color: NAVY });
      ctx.restore();
    } else txt('1 CALÇA: R$ 60', 0, 250, { size: 52, weight: 800, color: 'rgba(19,35,63,0.55)' });
  }, a);
}
function infoCard(t, a0, a1, icon, l1, l2, big) {
  const a = env(t, a0, a1, 0.01, 0.2); if (a <= 0) return;
  const p = pop(t, a0, 0.35);
  scaled(540 + (1 - clamp(p)) * -200, 680, 0.8 + 0.2 * p, () => {
    navyCard(-470, -150, 940, 300);
    ctx.save(); ctx.translate(-340, 0); ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(0, 0, 92, 0, Math.PI * 2); ctx.fill(); icon(); ctx.restore();
    txt(l1, 90, -50, { size: big ? 50 : 84, color: big ? '#fff' : '#fff', maxW: 560 });
    txt(l2, 90, big ? 40 : 50, { size: big ? 112 : 50, color: GOLD, maxW: 560 });
  }, a);
}
function temMais(t) { // 22.55–24.2
  const a = env(t, 22.55, 24.2, 0.01, 0.15); if (a <= 0) return;
  scaled(540, 680, pop(t, 22.55, 0.3), () => { const s = 'E TEM MAIS...', w = tw(s, 70) + 90; rr(-w / 2, -60, w, 120, 60, GOLD, 0.35); txt(s, 0, 3, { size: 70, color: NAVY_D }); }, a);
}
function pagLoja(t) { // 27.1–29.85
  const a = env(t, 27.1, 29.85, 0.01, 0.2); if (a <= 0) return;
  scaled(540, 560, pop(t, 27.15, 0.32), () => {
    navyCard(-450, -80, 900, 160);
    ctx.save(); ctx.translate(-350, 0); iCard(84, GOLD); ctx.restore();
    txt('PIX OU 3X', 60, -26, { size: 54, color: '#fff', maxW: 640 });
    txt('NO CARTÃO', 60, 32, { size: 40, weight: 800, color: GOLD, maxW: 640 });
  }, a);
  scaled(540, 780, pop(t, 27.85, 0.32), () => {
    navyCard(-450, -100, 900, 200);
    ctx.save(); ctx.translate(-350, 0); iPin(92, GOLD); ctx.restore();
    txt('LOJA FÍSICA', 60, -52, { size: 52, color: '#fff', maxW: 640 });
    txt('BURACO DA GIA · RUA C', 60, 4, { size: 34, weight: 800, color: GOLD, maxW: 640 });
    txt('BOX 207/214 · CENTRO', 60, 52, { size: 34, weight: 800, color: GOLD, maxW: 640 });
  }, a);
}
function endCard(t) { // 29.85–end
  const b = eout(prog(t, 29.85, 30.25)); if (b <= 0) return;
  ctx.save(); ctx.globalAlpha = 0.84 * b; ctx.fillStyle = NAVY_D; ctx.fillRect(0, 0, W, H); ctx.restore();
  const lp = pop(t, 29.9, 0.35);
  scaled(540, 350, lp, () => { const h = 120, w = h * IMG.logo.width / IMG.logo.height; ctx.drawImage(IMG.logo, -w / 2, -h / 2, w, h); });
  scaled(540, 488, pop(t, 30.05), () => txt('KIT 3 CALÇAS JEANS', 0, 0, { size: 62, color: '#fff' }));
  scaled(540, 622, pop(t, 30.2, 0.32), () => txt('R$ 165', 0, 0, { size: 170, color: GOLD }));
  scaled(540, 742, pop(t, 30.4), () => txt('SAI R$ 55 CADA  ·  OU 1 POR R$ 60', 0, 0, { size: 38, weight: 800, color: CREAM }));
  const rows = [[iTruck, 'FRETE GRÁTIS + ENTREGA EM 1 DIA ÚTIL'], [iCard, 'PIX OU 3X NO CARTÃO'], [iPin, 'LOJA FÍSICA: BURACO DA GIA · CENTRO']];
  rows.forEach(([ic, s], i) => {
    const q = pop(t, 30.6 + i * 0.18, 0.3), y = 850 + i * 82;
    scaled(110, y, q, () => { ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2); ctx.fill(); ctx.save(); if (ic === iPin) ic(42, NAVY_D); else ic(44, NAVY_D); ctx.restore(); });
    scaled(165, y, q, () => txt(s, 0, 2, { size: 34, weight: 800, color: '#fff', align: 'left', maxW: 830 }));
  });
  const cp = pop(t, 31.2, 0.35);
  if (cp > 0) {
    const pulse = 1 + 0.035 * Math.sin((t - 31.6) * 8) * clamp((t - 31.6) * 3);
    scaled(540, 1135, cp * pulse, () => {
      ctx.shadowColor = 'rgba(37,211,102,0.6)'; ctx.shadowBlur = 44; ctx.fillStyle = WA; ctx.beginPath(); ctx.roundRect(-450, -66, 900, 132, 66); ctx.fill(); ctx.shadowColor = 'transparent';
      ctx.save(); ctx.translate(-330, 0); iWA(84); ctx.restore();
      txt('CHAMA NO WHATSAPP', 50, 3, { size: 52, color: '#fff', maxW: 620 });
    });
    const ay = 1262 + Math.abs(Math.sin((t - 31.2) * 5)) * 20;
    ctx.save(); ctx.globalAlpha = clamp(cp); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(504, ay - 22); ctx.lineTo(576, ay - 22); ctx.lineTo(540, ay + 18); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
