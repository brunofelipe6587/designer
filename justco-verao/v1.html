<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Just Co V1 Helicóptero</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script>
// V1 — "NÃO É SOBRE O HELICÓPTERO." Aspirational / curiosity hook on the raw hangar footage, product facts from the
// PDP (textura horizontal, gola careca, toque macio, caimento premium), offer end card with coupon THEFIRST.
const DUR = 15.0;
const SEGMENTS = [
  { t0: 0.0, t1: 2.6, r0: 0.0, r1: 2.6, z0: 1.14, z1: 1.0, fx: 0.5, fy: 0.42 },
  { t0: 2.6, t1: 4.8, r0: 2.6, r1: 4.8, z0: 1.04, z1: 1.14, fx: 0.5, fy: 0.4 },
  { t0: 4.8, t1: 6.9, r0: 5.4, r1: 7.5, z0: 1.1, z1: 1.0, fx: 0.5, fy: 0.45 },
  { t0: 6.9, t1: 8.8, r0: 7.6, r1: 9.5, z0: 1.06, z1: 1.0, fx: 0.5, fy: 0.45 },
  { t0: 8.8, t1: 11.0, r0: 11.0, r1: 13.0, z0: 1.0, z1: 1.18, fx: 0.5, fy: 0.42, fy1: 0.4 },
  { t0: 11.0, t1: 15.0, r0: 13.0, r1: 16.2, z0: 1.08, z1: 1.0, fx: 0.5, fy: 0.45 },
];

async function renderAt(t) {
  await drawSegments(t, SEGMENTS);

  // 0–2.6 · hook
  if (t < 2.7) {
    shade(0.55, 0.0, 0.05);
    const out = prog(t, 2.4, 2.6);
    txt('NÃO É SOBRE O', 80, 470, { size: 150, p: prog(t, 0.1, 0.5), out });
    txt('HELICÓPTERO.', 76, 650, { size: 196, color: C.orange, p: prog(t, 0.5, 0.95), out, shadow: 0.25 });
  }
  // 2.6–4.8 · turn
  if (t >= 2.6 && t < 4.9) {
    lowShade(0.72);
    const out = prog(t, 4.6, 4.8);
    txt('É sobre como', 80, 1290, { font: F.serif, italic: true, weight: 500, size: 104, p: prog(t, 2.65, 3.05), out });
    txt('você chega.', 80, 1415, { font: F.serif, italic: true, weight: 500, size: 104, p: prog(t, 2.95, 3.35), out });
  }
  // brand mark from 2.6 on (hidden on the end card, which carries its own)
  logo(W / 2 - 62, 150, 48, prog(t, 2.6, 3.0) * (1 - prog(t, 10.9, 11.2)));

  // 4.8–6.9 · product name
  if (t >= 4.8 && t < 7.0) {
    lowShade(0.75);
    const out = prog(t, 6.7, 6.9);
    txt('JUST CO · VERÃO 26', 82, 1150, { font: F.sans, weight: 700, size: 30, ls: 7, p: prog(t, 4.85, 5.2), out });
    txt('T-SHIRT TRICOT', 78, 1300, { size: 150, p: prog(t, 5.0, 5.4), out });
    txt('HORIZONTAL', 78, 1430, { size: 150, color: C.orange, p: prog(t, 5.25, 5.65), out, shadow: 0.25 });
  }
  // 6.9–11 · product facts (only what the PDP states)
  if (t >= 6.9 && t < 8.8) {
    const out = prog(t, 8.6, 8.8);
    pill('TEXTURA HORIZONTAL', 70, 1150, { check: true, p: prog(t, 7.0, 7.45), out });
    pill('GOLA CARECA', 70, 1250, { check: true, p: prog(t, 7.5, 7.95), out });
  }
  if (t >= 8.8 && t < 11.0) {
    const out = prog(t, 10.8, 11.0);
    pill('TOQUE MACIO', 70, 1150, { check: true, p: prog(t, 8.9, 9.35), out });
    pill('CAIMENTO PREMIUM', 70, 1250, { check: true, p: prog(t, 9.4, 9.85), out });
  }

  // 11–15 · end card
  if (t >= 11.0) {
    const p = prog(t, 11.0, 11.5);
    ctx.fillStyle = `rgba(10,10,12,${0.5 * eout(p)})`; ctx.fillRect(0, 0, W, H);
    const y0 = 690 + (1 - eout(p)) * 120;
    ctx.save(); ctx.globalAlpha = eout(p);
    rrect(60, y0, W - 120, 820, 40); ctx.fillStyle = 'rgba(17,17,17,.92)'; ctx.fill();
    ctx.restore();
    logo(120, y0 + 64, 52, eout(p));
    txt('T-SHIRT MC TRICOT HORIZONTAL', 120, y0 + 200, { font: F.sans, weight: 700, size: 30, ls: 5, color: '#CFCAC2', p: prog(t, 11.2, 11.6), shadow: 0 });
    txt('R$ 139,90', 116, y0 + 340, { size: 150, p: prog(t, 11.3, 11.7), shadow: 0 });
    txt('3x de R$ 46,63 sem juros', 120, y0 + 400, { font: F.sans, weight: 500, size: 32, color: '#B9B4AC', p: prog(t, 11.45, 11.85), shadow: 0 });
    coupon(W / 2, y0 + 450, prog(t, 11.7, 12.1), { w: W - 240, label: '10% OFF NA 1ª COMPRA · CUPOM' });
    button('COMPRE AGORA  →', W / 2, y0 + 650, t, { w: W - 240, p: prog(t, 12.0, 12.4) });
  }
}
window.renderAt = renderAt;
window.ready = boot();
</script>
</body>
</html>
