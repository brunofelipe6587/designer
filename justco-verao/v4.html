<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Just Co V4 Monte seu Look</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script src="audio/timeline_v4.js"></script>
<script>
// V4 — "MONTE SEU LOOK" (category). Look builder across the summer collection: pick a t-shirt (cycles four tops with
// unit prices), pick the bermuda (three colours), then a worked example that crosses the free-shipping threshold
// (Bretanha R$ 169,90 + Bermuda R$ 189,90 = R$ 359,80 > R$ 350 → frete grátis). Every price is per piece and the
// sum is spelled out, so the two-piece total can't be misread. Brand system from the store CSS.
const DUR = window.TIMELINE ? TIMELINE.actual[TIMELINE.actual.length - 1] : 15.0;
const B = { ink: '#151515', paper: '#FBFBFB', card: '#EDEDED', grey: '#8B8B8B', light: '#BFBFBF', text: '#494E4C', price: '#2CA98C', buy: '#25C793' };
const TOPS = [
  { k: 'p_color', name: 'TSHIRT TRICOT COLOR', price: 'R$ 129,90' },
  { k: 'p_off', name: 'T-SHIRT MC TRICOT HORIZONTAL', price: 'R$ 139,90' },
  { k: 'p_polo', name: 'T-SHIRT TRICOT POLO MC', price: 'R$ 159,90' },
  { k: 'p_bret', name: 'T-SHIRT TRICOT BRETANHA', price: 'R$ 169,90' },
];
const BOTTOMS = [['p_berm', 'AREIA'], ['p_berm_marinho', 'MARINHO'], ['p_berm_preto', 'PRETO']];
const SEGMENTS = [{ t0: 0, t1: 2.8, r0: 9.8, r1: 11.6, z0: 1.12, z1: 1.0, fx: 0.5, fy: 0.45 }];

// a horizontal band of a cutout (fy0..fy1 of its height) fitted into a grey card
function crop(img, fy0, fy1, x, y, w, h, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  rrect(x, y, w, h, 20); ctx.fillStyle = B.card; ctx.fill(); ctx.clip();
  const sh = (fy1 - fy0) * img.height, sc = h / sh, dw = img.width * sc;
  ctx.drawImage(img, 0, fy0 * img.height, img.width, sh, x + w / 2 - dw / 2, y, dw, h);
  ctx.restore();
}

function stepHeader(n, title, p, out) {
  txt(`MONTE SEU LOOK · ${n}/3`, 70, 250, { font: F.sans, weight: 700, size: 28, ls: 6, color: B.grey, p, out, shadow: 0 });
  txt(title, 66, 380, { size: 132, color: B.ink, p: clamp(p * 1.3 - 0.1), out, shadow: 0 });
  [0, 1, 2].forEach(i => { ctx.beginPath(); ctx.arc(76 + i * 34, 190, 9, 0, Math.PI * 2); ctx.fillStyle = i < n ? B.buy : '#D5D5D5'; ctx.fill(); });
}

function label(name, price, y, p, out, extra) {
  txt(name, 120, y, { font: F.sans, weight: 700, size: 26, ls: 2, color: B.ink, p, out, shadow: 0 });
  const w = txt(price, 120, y + 72, { size: 72, color: B.price, p, out, shadow: 0 }) || 0;
  txt(extra || 'a peça', 120 + w + 16, y + 64, { font: F.sans, weight: 600, size: 28, color: B.text, p, out, shadow: 0 });
}

async function renderAt(t) {
  ctx.fillStyle = B.paper; ctx.fillRect(0, 0, W, H);

  // 0–2.8 · hook on the footage (frame 0 complete)
  if (t < 2.85) {
    await drawSegments(t, SEGMENTS);
    lowShade(0.82, 950, 1540);
    logo(W / 2 - 62, 150, 48, 1);
    const out = prog(t, 2.6, 2.8);
    txt('COLEÇÃO VERÃO', 82, 1150, { font: F.sans, weight: 700, size: 30, ls: 7, color: B.light, p: 1, out, shadow: 0.2 });
    txt('MONTE SEU LOOK', 76, 1310, { size: 168, color: B.paper, p: 1, out, shadow: 0.2 });
    txt('TODO EM TRICÔ', 80, 1405, { size: 96, color: B.buy, p: 1, out, shadow: 0.2 });
    pill('CAMISETA + BERMUDA', 76, 1440, { size: 30, h: 76, bg: B.paper, color: B.ink, p: 1, out });
  } else {
    logo(W - 70 - 115, 96, 46, 1, IMG.logoB);
  }

  // 2.8–6.0 · step 1: the t-shirt (cycles the four tops)
  if (t >= 2.8 && t < 6.05) {
    const p = prog(t, 2.8, 3.2), out = prog(t, 5.85, 6.0);
    stepHeader(1, 'ESCOLHA A CAMISETA', p, out);
    const i = Math.min(3, Math.floor(prog(t, 3.0, 5.9) * 4)), q = TOPS[i];
    const swap = prog(t, 3.0 + i * 0.725, 3.2 + i * 0.725);
    crop(IMG[q.k], 0.0, 0.66, 120, 470 + (1 - eout(swap)) * 30, 840, 840, eout(p) * (1 - out));
    label(q.name, q.price, 1390, eout(swap) * p, out);
    TOPS.forEach((d, j) => { ctx.beginPath(); ctx.arc(W / 2 - 51 + j * 34, 1550, 8, 0, Math.PI * 2); ctx.fillStyle = j === i ? B.ink : '#D5D5D5'; ctx.fill(); });
  }

  // 6.0–8.6 · step 2: the bermuda (three colours)
  if (t >= 6.0 && t < 8.65) {
    const p = prog(t, 6.0, 6.4), out = prog(t, 8.45, 8.6);
    stepHeader(2, 'COMBINE A BERMUDA', p, out);
    const i = Math.min(2, Math.floor(prog(t, 6.2, 8.5) * 3)), [k, cor] = BOTTOMS[i];
    const swap = prog(t, 6.2 + i * 0.767, 6.4 + i * 0.767);
    crop(IMG[k], 0.52, 0.97, 120, 470 + (1 - eout(swap)) * 30, 840, 840, eout(p) * (1 - out));
    label('TRICOT BERMUDA · ' + cor, 'R$ 189,90', 1390, eout(swap) * p, out);
    BOTTOMS.forEach((d, j) => { ctx.beginPath(); ctx.arc(W / 2 - 34 + j * 34, 1550, 8, 0, Math.PI * 2); ctx.fillStyle = j === i ? B.ink : '#D5D5D5'; ctx.fill(); });
  }

  // 8.6–12.2 · step 3: the worked example that crosses R$ 350
  if (t >= 8.6 && t < 12.25) {
    const p = prog(t, 8.6, 9.0), out = prog(t, 12.05, 12.2);
    stepHeader(3, 'LOOK COMPLETO', p, out);
    crop(IMG.p_bret_aveia, 0.04, 0.64, 70, 450, 450, 560, eout(prog(t, 8.7, 9.1)) * (1 - out));
    crop(IMG.p_berm, 0.52, 0.97, 560, 450, 450, 560, eout(prog(t, 8.9, 9.3)) * (1 - out));
    const a1 = prog(t, 9.0, 9.4), a2 = prog(t, 9.2, 9.6);
    txt('T-SHIRT TRICOT BRETANHA', 74, 1060, { font: F.sans, weight: 700, size: 20, ls: 1.5, color: B.ink, p: a1, out, shadow: 0 });
    txt('R$ 169,90', 74, 1125, { size: 64, color: B.ink, p: a1, out, shadow: 0 });
    txt('TRICOT BERMUDA', 564, 1060, { font: F.sans, weight: 700, size: 20, ls: 1.5, color: B.ink, p: a2, out, shadow: 0 });
    txt('R$ 189,90', 564, 1125, { size: 64, color: B.ink, p: a2, out, shadow: 0 });
    if (a2 > 0) { ctx.save(); ctx.globalAlpha = clamp(a2 * 2) * (1 - out); ctx.translate(W / 2, 730); ctx.scale(eback(a2), eback(a2));
      ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fillStyle = B.ink; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.moveTo(0, -16); ctx.lineTo(0, 16); ctx.stroke(); ctx.restore(); }
    const s = prog(t, 9.7, 10.1);
    if (s > 0) { ctx.save(); ctx.globalAlpha = s * (1 - out); ctx.fillStyle = '#D5D5D5'; ctx.fillRect(70, 1170, W - 140, 3); ctx.restore(); }
    txt('2 PEÇAS:', 70, 1290, { size: 96, color: B.ink, p: s, out, shadow: 0 });
    txt('R$ 359,80', W - 70, 1290, { size: 96, color: B.ink, align: 'right', p: s, out, shadow: 0 });
    const f = prog(t, 10.3, 10.7);
    if (f > 0) {
      ctx.save(); ctx.globalAlpha = clamp(f * 2) * (1 - out);
      const e = eback(f); ctx.translate(W / 2, 1420); ctx.scale(e, e);
      rrect(-470, -70, 940, 140, 70); ctx.fillStyle = B.buy; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `400 84px ${F.display}`; ctx.letterSpacing = '2px'; ctx.fillText('FRETE GRÁTIS', 0, 6);
      ctx.restore();
    }
    txt('compras acima de R$ 350', W / 2, 1540, { font: F.sans, weight: 500, size: 30, color: B.text, align: 'center', p: prog(t, 10.6, 11.0), out, shadow: 0 });
  }

  // 12.2–15 · end card
  if (t >= 12.2) {
    const p = prog(t, 12.2, 12.6);
    txt('MONTE O SEU', W / 2, 430, { size: 150, color: B.ink, align: 'center', p, shadow: 0 });
    txt('COLEÇÃO VERÃO', W / 2, 570, { size: 150, color: B.ink, align: 'center', p: prog(t, 12.3, 12.7), shadow: 0 });
    const looks = [['p_color', 'p_berm_preto'], ['p_off', 'p_berm_marinho'], ['p_bret_aveia', 'p_berm']];
    looks.forEach(([top, bot], i) => {
      const a = eout(prog(t, 12.45 + i * 0.12, 12.85 + i * 0.12)), x = 70 + i * 320;
      crop(IMG[top], 0.04, 0.64, x, 650, 300, 330, a);
      crop(IMG[bot], 0.52, 0.97, x, 990, 300, 300, a);
    });
    txt('Camisetas a partir de R$ 129,90 · Bermuda R$ 189,90', W / 2, 1360, { font: F.sans, weight: 600, size: 29, color: B.text, align: 'center', p: prog(t, 12.8, 13.2), shadow: 0 });
    button('MONTAR MEU LOOK', W / 2, 1400, t, { bg: B.buy, w: 820, h: 112, size: 34, weight: 700, p: prog(t, 13.0, 13.4) });
    txt('Frete grátis acima de R$ 350', W / 2, 1580, { font: F.sans, weight: 600, size: 30, color: B.price, align: 'center', p: prog(t, 13.2, 13.6), shadow: 0 });
  }
}
const renderDesign = renderAt;
window.renderAt = t => renderDesign(warp(t));
window.ready = boot({ p_color: 'assets/p_color_preto.png', p_off: 'assets/p_off.png', p_polo: 'assets/p_polo.png',
  p_bret: 'assets/p_bretanha_marsala.png', p_bret_aveia: 'assets/p_bretanha_aveia.png', p_berm: 'assets/p_bermuda.png',
  p_berm_marinho: 'assets/p_bermuda_marinho.png', p_berm_preto: 'assets/p_bermuda_preto.png' });
</script>
</body>
</html>
