<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Kayla Atacado 1 Fran</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
// Creative 1 — "Fran 2.0": Fran's own reel re-cut for qualified resellers. Hook for shop owners with an active CNPJ,
// studio photos over every cut in her speech, cart with the 6-piece minimum, the site steps on a phone under her closing line,
// and a 3-step end card. Evergreen on purpose: no season, no collection names.
// Safe zone (common.js): her reel's captions are burned in low in the frame, outside the Reels/Stories safe zone, so her
// footage is shown down to y 1240 and melts into the studio background there; the same captions are re-set, in the
// same style and timing, inside the safe zone.
const DUR = 33.0;
// Edit decision list: [output start, source start, source end] in Fran's reel. build_audio1.sh cuts the voice with the same list.
// The call to action closes the piece so her last line ends on a full sentence ("…no nosso site de atacado.").
const EDL = [
  [0.00, 0.00, 4.02],   // "Quer se tornar uma revendedora Kayla e você não sabe como?"
  [4.02, 12.00, 19.50], // "Eu sou a Fran, diretora criativa da Kayla ... do tamanho 42 ao 54."
  [11.52, 20.55, 26.32],// "As peças da Kayla são pensadas com um caimento e uma modelagem perfeita para a mulher plus size."
  [17.29, 34.45, 41.05],// "E quais são as formas de pagamento? ... desconto no pagamento PIX."
  [23.89, 41.84, 43.74],// "Para se tornar uma revendedora Kayla"
  [25.79, 4.45, 5.42],  // "é muito fácil,"
  [26.76, 6.12, 7.66],  // "é só fazer o cadastro"
  [28.30, 9.72, 11.98], // "diretamente no nosso site de atacado." (audio tail fades out)
];
// Fran-to-Fran cuts are never shown on her face: a studio photo covers each one (insert at 4.02, photo run from 11.30).
const S = { ins: 3.85, insEnd: 4.70, cuts: 11.30, cap: 13.99, back: 17.29, pay: 18.64, payEnd: 23.89, steps: 25.79, card: 30.33 };
const XF = 0.25; // short dissolve between different scenes only

function franSrc(t) { let s = 0; for (const [o, a] of EDL) if (t >= o) s = a + (t - o); return s; }
const fran = t => frame('fran', Math.floor(franSrc(t) * 30) + 1, 1406);

// ---------- scenes ----------
async function drawFran(t) {
  studio();
  fadePhoto(await fran(t), 1320, 0, 1, 1240);
  // her reel's captions, re-set inside the safe zone at the moments they appeared in the original
  ctx.save(); ctx.textAlign = 'center';
  const cap = (fn, a) => { if (a > 0) { ctx.save(); ctx.globalAlpha *= a; shadowText(fn); ctx.restore(); } };
  if (t >= 2.7 && t < S.ins) { // callout: thin box + stem + dot
    const bx = eout(prog(t, 2.7, 3.0)), stem = eout(prog(t, 2.9, 3.2));
    scrim(980, 1290, 0.45);
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3;
    const w = 700 * bx; ctx.strokeRect(540 - w / 2, 1010, w, 130);
    ctx.beginPath(); ctx.moveTo(540, 1140); ctx.lineTo(540, 1140 + 70 * stem); ctx.stroke();
    if (stem >= 1) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(540, 1222, 12, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    cap(() => { ctx.fillStyle = '#fff'; ctx.font = `500 46px ${SANS}`; ctx.fillText(typed('Como comprar KAYLA', t, 2.85, 0.4), 540, 1066); ctx.fillText(typed('no ATACADO', t, 3.25, 0.3), 540, 1120); }, 1);
  }
  if (t >= 5.0 && t < 7.2) { scrim(1040, 1290, 0.45); cap(() => { ctx.fillStyle = '#fff'; ctx.font = `400 46px ${SERIF}`; ctx.fillText(typed('FRAN', t, 5.0, 0.25), 540, 1150); ctx.font = `400 54px ${SERIF}`; ctx.fillText(typed('diretora criativa', t, 5.25, 0.5), 540, 1215); }, 1 - prog(t, 7.0, 7.2)); }
  if (t >= 8.0 && t < S.cuts) { scrim(980, 1300, 0.45); cap(() => { ctx.fillStyle = C.cream; ctx.font = `700 118px ${COND}`; ctx.letterSpacing = '2px'; ctx.fillText(typed('GRADE', t, 8.0, 0.3), 541, 1112); ctx.fillText(typed('42 AO 54', t, 8.3, 0.4), 541, 1228); }, 1); }
  if (t >= 23.95 && t < S.steps) { scrim(1020, 1300, 0.45); cap(() => { ctx.fillStyle = '#fff'; ctx.font = `400 62px ${SERIF}`; ctx.fillText(typed('Pedido mínimo', t, 23.95, 0.4), 540, 1148); ctx.fillText(typed('6 peças variadas', t, 24.35, 0.5), 540, 1224); }, 1); }
  ctx.restore();
}
const STEPS = [ // closing line: the site on the phone — [start, screen(local) -> seconds, focus, label, title, highlight]
  [S.steps, (l) => 1.5 + l, 0.45, 'PASSO 1 DE 3', 'Cadastro com CNPJ', null],
  [S.steps + 1.8, (l) => l < 0.45 ? 55.6 + l * 0.5 : 61.0 + (l - 0.45), 0.27, 'PASSO 2 DE 3', 'Aprovação automática', null],
  [S.steps + 3.1, (l) => 63.0 + l, 0.62, 'PASSO 3 DE 3', 'Preço de atacado na hora', (l) => [0.765, 0.835, eout(prog(l, 0.35, 0.6))]],
];
async function drawSteps(t) {
  studio();
  let k = 0; for (let i = 0; i < 3; i++) if (t >= STEPS[i][0]) k = i;
  const [at, scr, foc, lab, title, hl] = STEPS[k], l = t - at;
  const f = k > 0 ? lerp(STEPS[k - 1][2], foc, eio(prog(l, 0, 0.5))) : foc;
  phoneWindow(await tela(scr(l)), f, hl ? hl(l) : null, eout(prog(t, S.steps, S.steps + 0.6)));
  stepCaption(lab, title, l, [k, 3]);
}
async function drawPay(t) {
  studio();
  const hlp = eout(prog(t, 21.6, 22.0));
  phoneWindow(await tela(134.0 + (t - S.pay) * 0.6), 0.68, [0.825, 0.868, hlp], eout(prog(t, S.pay, S.pay + 0.6)));
  if (t < 21.44) stepCaption('PAGAMENTO', 'Até 3x sem juros', t - S.pay - 0.2);
  else stepCaption('PAGAMENTO', 'Desconto no PIX', t - 21.44);
}
const RUN = [['rebeca', 0.5, 0.18], ['eve', 0.5, 0.2], ['clarice', 0.5, 0.2], ['p4', 0.5, 0.2], ['iris', 0.5, 0.2]];
function photoRun(t, t0, t1, list) { // equal slots, short dissolve between photos, slow push-in
  const n = list.length, d = (t1 - t0) / n;
  for (let i = 0; i < n; i++) {
    const at = t0 + i * d; if (t < at || t >= at + d + XF) continue;
    const [nm, fx, fy] = list[i], a = i === 0 ? 1 : eio(clamp((t - at) / XF));
    ctx.save(); ctx.globalAlpha *= a; cover(IMG[nm], 0, 0, W, H, fx, fy, 1.03 + 0.05 * prog(t, at, at + d + XF)); ctx.restore();
  }
}
async function drawCuts(t) {
  photoRun(t, S.cuts, S.back, RUN);
  const a = eout(prog(t, S.cap, S.cap + 0.4));
  ctx.save(); ctx.globalAlpha *= a; ctx.textAlign = 'center';
  scrim(980, 1300, 0.5);
  shadowText(() => { ctx.fillStyle = '#fff'; ctx.font = `400 70px ${SERIF}`; ctx.fillText('Modelagem pensada', 540, 1140); ctx.fillText('para o corpo plus', 540, 1226); });
  ctx.restore();
}
function drawInsert(t) { cover(IMG.p3, 0, 0, W, H, 0.5, 0.2, 1.03 + 0.03 * prog(t, S.ins, S.insEnd)); }

function sceneAt(t) {
  if (t >= S.card) return 'card';
  if (t >= S.steps) return 'steps';
  if (t >= S.pay && t < S.payEnd) return 'pay';
  if (t >= S.cuts && t < S.back) return 'cuts';
  if (t >= S.ins && t < S.insEnd) return 'insert';
  return 'fran';
}
async function drawScene(n, t) {
  if (n === 'fran') return drawFran(t);
  if (n === 'insert') return drawInsert(t);
  if (n === 'cuts') return drawCuts(t);
  if (n === 'pay') return drawPay(t);
  if (n === 'steps') return drawSteps(t);
  return endCard(t, S.card, DUR - S.card, IMG.rose, 0.12);
}
async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  const cur = sceneAt(t);
  // the most recent scene change at or before t; the outgoing scene keeps playing underneath while the new one fades in
  const changes = [S.ins, S.insEnd, S.cuts, S.back, S.pay, S.payEnd, S.steps, S.card].filter(c => c <= t);
  const st = changes.length ? Math.max(...changes) : null;
  const xf = cur === 'card' ? 0.6 : XF, prev = st !== null ? sceneAt(st - 0.001) : null;
  // anything that involves Fran is a clean cut (no ghosting of her face); other scene changes dissolve
  if (st !== null && t < st + xf && cur !== 'fran' && prev !== 'fran') {
    await drawScene(prev, t);
    ctx.save(); ctx.globalAlpha = eio((t - st) / xf); await drawScene(cur, t); ctx.restore();
  } else await drawScene(cur, t);
  // hook: who this is for — "LOJISTA" from frame 0, above her head, inside the safe zone
  if (t < S.ins) hookText(t, 'com CNPJ ativo?', null, { lojista: 430, line2: 520 });
  safeGuides();
}

window.ready = (async () => {
  await Promise.all([load('logo', 'src/logo-kayla.svg'), load('rebeca', 'src/p-rebeca.jpg'), load('eve', 'src/p-eve.jpg'), load('p4', 'src/p-p4.jpg'), load('p3', 'src/p-p3.jpg'), load('rose', 'src/p-rose.jpg'), load('iris', 'src/p-iris.jpg'), load('clarice', 'src/p-clarice.jpg')]);
  await loadFonts();
  await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
