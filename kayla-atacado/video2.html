<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Kayla Atacado 2 Passo a passo</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
// Creative 2 — "Passo a passo": the real wholesale site on a phone, six steps from CNPJ sign-up to checkout, so the click
// that arrives already knows what happens. No voice; the reel's own music. Reading pace: 8 beats per scene (beat 0.395 s).
// Everything the viewer reads sits inside the Reels/Stories safe zone (common.js); the phone is shown through a window
// and panned to the part of the screen each step is about.
const DUR = 27.4;
const BEAT = 0.395, B = [8, 16, 24, 32, 40, 48].map(k => k * BEAT);
const CARD = 56 * BEAT;
// [title, screen(local time) -> [source, seconds], focus(local time) as a fraction of screen height, highlight or null]
const STEPS = [
  ['Cadastre seu CNPJ', (l) => l < 1.2 ? ['tela', 1.0 + l * 0.8] : ['cad', 0], (l) => l < 1.2 ? 0.45 : 0.4, (l) => l > 1.6 ? [0.268, 0.352, eout(prog(l, 1.6, 1.95))] : null],
  ['Aprovação automática', (l) => l < 0.9 ? ['tela', 55.6 + l * 0.4] : ['tela', 61.0 + (l - 0.9) * 0.6], () => 0.27, null],
  ['Preço de atacado liberado', (l) => ['tela', l < 0.9 ? 81.5 : 83.0], (l) => l < 0.9 ? 0.4 : 0.5, (l) => l >= 0.9 ? [0.486, 0.542, eout(prog(l, 1.1, 1.45))] : null],
  ['Escolha cores e tamanhos', (l) => ['tela', 93.0 + l * 1.0], () => 0.48, null],
  ['Pedido mínimo: 6 peças', (l) => ['tela', l < 1.1 ? 104.5 : l < 2.2 ? 135.0 : 165.0], () => 0.68, (l) => l < 2.2 ? [0.825, 0.868, eout(prog(l, 0.3, 0.6))] : null],
  ['Finalize: 3x ou PIX', () => ['tela', 174.0], () => 0.3, (l) => [0.288, 0.334, eout(prog(l, 0.6, 0.95))]],
];

function hook(t) {
  cover(IMG.hook, 0, 0, W, H, 0.5, 0.2, 1.04 + 0.04 * prog(t, 0, B[0]));
  hookText(t, 'com CNPJ ativo?', 'Como comprar KAYLA no ATACADO');
}
async function steps(t) {
  studio();
  let k = 0; for (let i = 0; i < 6; i++) if (t >= B[i]) k = i;
  const l = t - B[k], [title, scr, foc, hlf] = STEPS[k];
  const [src, s] = scr(l), img = src === 'cad' ? IMG.cad : await tela(s);
  // pan smoothly from where the previous step was looking
  const prevF = k > 0 ? STEPS[k - 1][2](B[k] - B[k - 1] - 0.01) : foc(l);
  const f = lerp(prevF, foc(l), eio(prog(l, 0, 0.5)));
  phoneWindow(img, f, hlf ? hlf(l) : null, eout(prog(t, B[0], B[0] + 0.6)));
  stepCaption(`PASSO ${k + 1} DE 6`, title, l, [k, 6]);
}
async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  if (t < B[0]) hook(t);
  else if (t < CARD) await steps(t);
  else if (t < CARD + 0.8) { await steps(t); ctx.save(); ctx.globalAlpha = eio((t - CARD) / 0.8); endCard(t, CARD, DUR - CARD, IMG.card, 0.1); ctx.restore(); }
  else endCard(t, CARD, DUR - CARD, IMG.card, 0.1);
  safeGuides();
}

window.ready = (async () => {
  await Promise.all([load('logo', 'src/logo-kayla.svg'), load('hook', 'src/p-rebeca2.jpg'), load('card', 'src/p-clarice.jpg'), load('cad', 'src/tela_cadastro_2x.jpg')]);
  await loadFonts();
  await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
