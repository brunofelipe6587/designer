<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Black Sand Walk e1</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="common.js"></script>
<script>
W = 1080; H = 1350; ctx = document.getElementById('c').getContext('2d');
// E1 · Trio: the three partner athletes on top (approved banner composition), the offer stacked below.
function render() {
  bgBlack([[540, 330, 0.12, 700], [540, 1050, 0.16, 700]]);
  athlete('a3', -95, 120, 0.42);
  athlete('a1', 585, 95, 0.60);
  athlete('a2', 175, 70, 0.47);
  vfade(560, 820, 0, 1);
  ctx.fillStyle = 'rgba(5,5,5,1)'; ctx.fillRect(0, 820, W, H - 820);
  // ribbons across the athletes' base
  tape(0, 830, 1080, 700, '#141414', 'rgba(255,204,41,0.65)', 'BLACK SAND WALK  •  ', 54, 26);
  tape(0, 770, 1080, 690, YEL, INK, 'BLACK SAND WALK  •  3 SUNGAS POR R$ 179  •  ', 58, 27, 60);
  logo(540, 38, 300, 'center');
  // offer
  txt('3 SUNGAS POR', 540, 915, '700 84px Syne', WHITE, 'center');
  glowTxt('R$ 179', 540, 1088, '700 186px Syne', YEL, 60, 0.55, 'center');
  ctx.font = '600 34px Inter'; const dw = ctx.measureText('De R$ 209,70').width; ctx.font = '800 28px Inter';
  const pw = ctx.measureText('ECONOMIZE R$ 30').width + 42, tot = dw + 28 + pw, x0 = 540 - tot / 2;
  strike('De R$ 209,70', x0, 1190, '600 34px Inter');
  pill('ECONOMIZE R$ 30', x0 + dw + 28, 1178, 28);
  cta('APROVEITAR OFERTA  →', 540, 1258, 620, 86, 34);
  footer(1322, 23);
}
window.ready = (async () => { await loadCommon(); render(); return true; })();

</script>
</body>
</html>
