<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Black Sand Walk v1</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
W = 1080; H = 1920; ctx = document.getElementById('c').getContext('2d');
// V1 · Lances (phonk 128 bpm, beat_shd2.wav — bars of 1.875 s, drop at 3.75 s, outro at 11.25 s).
// Three plays from the Sand Walk shoots enter as panels one per beat, "a Black da areia chegou" word by word,
// the offer lands on the drop, a sunga carousel takes over the panels for two bars, then the plays come back.
// Reels/Stories safe area: everything essential between y 270 and 1250 (CTA ends at 1242).
const BEAT = 60 / 128, BAR = 4 * BEAT, DROP = 2 * BAR, CAR = 4 * BAR, OUTRO = 6 * BAR, DUR = 15.6;
const FR = '../../sandwalk-ftvpreta/frames/';
// [dir, frames, zoom, anchorX, anchorY]
const PLAYS = [['b4', 84, 1.55, 560, 1100], ['b1', 85, 1.45, 700, 1150], ['b6', 84, 1.55, 620, 1080]];
const ROT = ['blackout', 'hupi_fire', 'graffiti', 'shadow', 'splash', 'allblack', 'pincelada_fluor', 'stars', 'shadow_laranja', 'tricolor', 'grafite_premium'];
const PX = [40, 380, 720], PY = 300, PW = 320, PH = 500;
async function panels(t, dim) {
  for (let i = 0; i < 3; i++) {
    const u = enter(t, (i + 1) * BEAT, 0.35); if (u <= 0) continue;
    const [dir, n, z, ax, ay] = PLAYS[i], f = 1 + ((t * 30 * 0.8) % (n - 1));
    const y = PY + 120 * (1 - u);
    await framePanel(FR + dir, n, f, PX[i], y, PW, PH, { z, ax, ay, alpha: u * dim, filter: 'contrast(1.06) saturate(1.05)' });
    ctx.save(); ctx.globalAlpha = u * dim; ctx.strokeStyle = YEL; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(PX[i], y, PW, PH, 22); ctx.stroke(); ctx.restore();
    flash(t, (i + 1) * BEAT, 0.1, 0.25);
  }
}
async function render(t) {
  W = 1080; H = 1920;
  bgBlack([[540, 560, 0.12 + 0.05 * (t > DROP) * Math.max(0, Math.cos(((t - DROP) % BEAT) / BEAT * Math.PI)), 800], [540, 1100, 0.16, 700]]);
  const dim = t < CAR ? 1 : t < OUTRO ? 1 - 0.8 * enter(t, CAR, 0.3) : 0.2 + 0.8 * enter(t, OUTRO, 0.4);
  await panels(t, dim);
  // sunga carousel over the dimmed panels
  if (t >= CAR - 0.05 && t < OUTRO + 0.4) {
    const a = t < OUTRO ? enter(t, CAR, 0.3) : 1 - enter(t, OUTRO, 0.35);
    ctx.save(); ctx.globalAlpha = a;
    txt('ESTAMPAS PRA TODO ESTILO', 540, 380, '700 50px Syne', WHITE, 'center');
    for (let i = 0; i < 3; i++) {
      const k = Math.floor((t - CAR) / (2 * BEAT) + i * 0.34), key = ROT[(((k * 3 + i) % ROT.length) + ROT.length) % ROT.length];
      const p = pop(t, CAR + Math.max(0, k) * 2 * BEAT, 0.3);
      scaled(200 + i * 340, 590, 0.85 + 0.15 * p, 1, () => sunga(key, 200 + i * 340, 590, 300, (i - 1) * 0.06, { spot: 0.3 }));
    }
    ctx.restore();
  }
  // ribbons on the drop
  if (t >= DROP) {
    const u = enter(t, DROP, 0.5), sh = (t - DROP) * 80;
    ctx.save(); ctx.globalAlpha = u;
    tape(-600 * (1 - u), 885, 1080, 800, '#141414', 'rgba(255,204,41,0.65)', 'BLACK SAND WALK  •  ', 48, 23, -sh);
    tape(0, 840, 1080 + 600 * (1 - u), 775, YEL, INK, 'BLACK SAND WALK  •  3 SUNGAS POR R$ 179  •  ', 52, 24, sh);
    ctx.restore();
  }
  logo(540, 120, 260, 'center', enter(t, 0, 0.5));
  scaled(540, 220, pop(t, 0.02), 1, () => seal(540, 220, 'BLACK SAND WALK', 32, -0.03, YEL, INK, 'center'));
  if (t < DROP) {
    const words = [['A BLACK', BAR], ['DA AREIA', BAR + BEAT], ['CHEGOU', BAR + 2 * BEAT]];
    words.forEach(([w, t0], i) => scaled(540, 945 + i * 105, pop(t, t0, 0.3), 1, () => txt(w, 540, 980 + i * 105, '700 100px Syne', i === 2 ? YEL : WHITE, 'center')));
  } else {
    offerStack(t, DROP, 945, { size: 150, gap: [0, BEAT, 3 * BEAT, 4 * BEAT] });
    ctaPulse(t, DROP + 6 * BEAT, 1198, 'APROVEITAR OFERTA  →', BEAT, 620, 84, 33);
    ctx.save(); ctx.globalAlpha = enter(t, DROP + 7 * BEAT, 0.4); footer(1300, 24); ctx.restore();
  }
  if (t >= OUTRO) {
    ['allblack', 'graffiti', 'blackout', 'hupi_fire'].forEach((k, i) => { const p = pop(t, OUTRO + i * BEAT * 0.5, 0.35); scaled(165 + i * 250, 1480, p, 1, () => sunga(k, 165 + i * 250, 1480, 220, (i - 1.5) * 0.05, { spot: 0.22 })); });
  }
  tape(0, 1780, 1080, 1700, '#121212', 'rgba(255,204,41,0.5)', 'SÓ ATÉ 08/11  •  BLACK SAND WALK  •  ', 50, 24, t * 60);
  flash(t, 0, 0.25, 0.6); flash(t, DROP, 0.22, 0.85); flash(t, CAR, 0.15, 0.4); flash(t, OUTRO, 0.15, 0.4, '255,204,41');
}
window.ready = (async () => { await loadCommon(); await render(0); return true; })();
window.renderAt = t => render(t);

</script>
</body>
</html>
