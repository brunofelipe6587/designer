<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Sand Walk Phoenix 1B</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Phoenix creative 1B — clean split-screen Reel, no voiceover: the athlete on top, the kit below on a light "shop window"
// background, and one card on the seam with only the essentials (kit name, 3 pieces, price, -34%).
// The card sits around y 860 — below the Reels top UI and well above the caption / CTA area at the bottom.
const W = 1080, H = 1920, DUR = 12.0;
const RED = '#E5262F', YEL = '#FFCC29', INK = '#0B0B0F', PAPER = '#F3F3F5';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const pop = (t, a, d = 0.26) => t < a ? 0 : eback(prog(t, a, a + d));

const SPLIT = 860;
// athlete photos (1500x2000): [scale, faceX, faceY] — face placed at (540, 430); soft crossfades
const PH = { f3: [0.90, 680, 480], f1: [1.0, 720, 340], f2: [1.0, 820, 320] };
const SEQ = [['f3', 0], ['f1', 3.75], ['f2', 7.5]], XF = 0.7;

function drawPhoto(key, t, t0) {
  const img = IMG[key], [s0, fx, fy] = PH[key], s = s0 * (1 + 0.045 * prog(t, t0, t0 + 4.5));
  const fyS = Math.min(430, fy * s);   // never leave a gap above the photo
  ctx.drawImage(img, 540 - fx * s, fyS - fy * s, img.width * s, img.height * s);
}
function athlete(t) {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, SPLIT); ctx.clip();
  let i = 0; for (let k = 0; k < SEQ.length; k++) if (t >= SEQ[k][1]) i = k;
  const k = i > 0 ? eio(prog(t, SEQ[i][1], SEQ[i][1] + XF)) : 1;
  if (k < 1) drawPhoto(SEQ[i - 1][0], t, SEQ[i - 1][1]);
  ctx.globalAlpha = k; drawPhoto(SEQ[i][0], t, SEQ[i][1]); ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, SPLIT - 220, 0, SPLIT); g.addColorStop(0, 'rgba(11,11,15,0)'); g.addColorStop(1, 'rgba(11,11,15,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, SPLIT - 220, W, 220);
  ctx.restore();
}
function kit(t) {
  ctx.fillStyle = PAPER; ctx.fillRect(0, SPLIT, W, H - SPLIT);
  // the store image has a white background: drawn with multiply it sits cleanly on the light panel
  const s = 0.345 * (1 + 0.015 * Math.sin(t * 1.2)), fy = 6 * Math.sin(t * 1.5);
  const cx = 540, top = 1075 + fy, x0 = 60, x1 = 1950, y0 = 525;
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(IMG.mock, cx - ((x0 + x1) / 2) * s, top - y0 * s, 2000 * s, 3000 * s); ctx.restore();
  // soft floor shadow
  ctx.save(); ctx.filter = 'blur(28px)'; ctx.fillStyle = 'rgba(0,0,0,0.13)';
  ctx.beginPath(); ctx.ellipse(540, 1745, 300, 34, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function card(t) {
  // one centred card on the seam: name / pieces / price + -34%
  const y = SPLIT, w = 760, h = 270, x = 540 - w / 2, top = y - h / 2;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(x, top, w, h, 36); ctx.fill(); ctx.restore();
  ctx.save(); ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.font = '800 58px Syne'; const a = 'KIT ', b = 'PHOENIX', wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(a, 540 - (wa + wb) / 2, top + 62); ctx.fillStyle = RED; ctx.fillText(b, 540 - (wa + wb) / 2 + wa, top + 62);
  ctx.textAlign = 'center'; ctx.font = '700 28px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('manga curta + manga longa + shorts', 540, top + 118);
  // price + tag
  ctx.font = '800 76px Syne'; const pw = ctx.measureText('R$ 189,70').width;
  ctx.font = '800 28px Inter'; const tw = ctx.measureText('-34%').width + 30, gap = 22, total = pw + gap + tw, px = 540 - total / 2;
  ctx.font = '800 76px Syne'; ctx.textAlign = 'left'; ctx.fillStyle = YEL; ctx.fillText('R$ 189,70', px, top + 200);
  ctx.fillStyle = RED; ctx.beginPath(); ctx.roundRect(px + pw + gap, top + 178, tw, 46, 23); ctx.fill();
  ctx.font = '800 28px Inter'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('-34%', px + pw + gap + tw / 2, top + 202);
  // slow light sweep over the price
  const sw = (t % 4) / 4, gx = px - 60 + (pw + 120) * eio(clamp(sw * 1.6));
  ctx.beginPath(); ctx.rect(px, top + 160, pw, 80); ctx.clip();
  const g = ctx.createLinearGradient(gx - 50, 0, gx + 50, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(px, top + 160, pw, 80);
  ctx.restore();
}

async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  athlete(t);
  kit(t);
  ctx.fillStyle = RED; ctx.fillRect(0, SPLIT - 3, W, 6);   // seam
  card(t);
  const fo = prog(t, DUR - 0.3, DUR); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

const IMG = {};
window.ready = (async () => {
  for (const [k, src] of [['f1', 'src/foto1.jpg'], ['f2', 'src/foto2.jpg'], ['f3', 'src/foto3.jpg'], ['mock', 'src/site_mockup.jpg']]) { IMG[k] = new Image(); IMG[k].src = src; await IMG[k].decode(); }
  for (const f of ['800 40px Syne', '800 40px Inter', '700 40px Inter', '600 40px Inter']) await document.fonts.load(f);
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
