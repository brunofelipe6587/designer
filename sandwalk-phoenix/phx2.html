<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Sand Walk Phoenix 1B</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Phoenix creative 1B — split-screen variation of creative 1, no voiceover: the athlete on top (photos cut on the beat),
// the kit below (pieces spotlighted in turn), and the offer in the middle band.
// SAFE AREA: everything that must be read sits between y≈300 and y≈1250 — inside the 4:5 feed crop (y 285–1635), below the
// Stories/Reels top UI (~14%) and above the Reels bottom UI (~35%). Outside that band there is only imagery.
const W = 1080, H = 1920, DUR = 12.17;
const RED = '#E5262F', BLUE = '#2E5BFF', YEL = '#FFCC29', INK = '#07070A';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const pop = (t, a, d = 0.26) => t < a ? 0 : eback(prog(t, a, a + d));
// strong beats of the track (~129 bpm, every other beat)
const BEATS = [0.16, 1.09, 2.0, 2.93, 3.85, 4.78, 5.69, 6.62, 7.55, 8.48, 9.38, 10.31, 11.24];
const beatPulse = t => { const b = BEATS.filter(x => x <= t).pop(); return b === undefined ? 0 : 1 - eout(prog(t, b, b + 0.3)); };

// ---------- layout (9:16 coordinates) ----------
const TOP = [0, 840], MARQ = [840, 892], BAR = [892, 1050], PILL_Y = 1100, CARD = [1150, 1620];
// athlete photos: [key, scale, faceX, faceY] (photo pixels, 1500x2000); face placed at (540, 470)
const PH = { f1: [1.15, 720, 340], f2: [1.15, 820, 320], f3: [1.15, 680, 480] };
const SEQ = [['f3', 0], ['f1', 2.93], ['f2', 5.69], ['f3', 8.48]];   // cut on beats
const PIECE = { longa: [60, 525, 1140, 1830], curta: [1035, 525, 1950, 1770], shorts: [690, 1485, 1635, 2385] };

function drawAthlete(key, t, t0) {
  const img = IMG[key], [s0, fx, fy] = PH[key], s = s0 * (1 + 0.05 * prog(t, t0, t0 + 3.2));
  ctx.drawImage(img, 540 - fx * s, 470 - fy * s, img.width * s, img.height * s);
}
function athletePanel(t) {
  ctx.save(); ctx.beginPath(); ctx.rect(0, TOP[0], W, TOP[1] - TOP[0]); ctx.clip();
  // blurred fill so the edges never show black
  ctx.filter = 'blur(30px) brightness(0.7)'; ctx.drawImage(IMG.f3, -200, -300, 1500, 2000); ctx.filter = 'none';
  let i = 0; for (let k = 0; k < SEQ.length; k++) if (t >= SEQ[k][1]) i = k;
  const [key, t0] = SEQ[i];
  const wipe = i > 0 ? eio(prog(t, t0, t0 + 0.28)) : 1;
  if (wipe < 1) {
    drawAthlete(SEQ[i - 1][0], t, SEQ[i - 1][1]);
    // diagonal wipe in, with a red edge
    const x = -300 + (W + 600) * wipe;
    ctx.save(); ctx.beginPath(); ctx.moveTo(-300, 0); ctx.lineTo(x + 200, 0); ctx.lineTo(x - 200, TOP[1]); ctx.lineTo(-300, TOP[1]); ctx.closePath(); ctx.clip();
    drawAthlete(key, t, t0); ctx.restore();
    ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = 14; ctx.shadowColor = RED; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.moveTo(x + 200, 0); ctx.lineTo(x - 200, TOP[1]); ctx.stroke(); ctx.restore();
  } else drawAthlete(key, t, t0);
  const g = ctx.createLinearGradient(0, TOP[1] - 260, 0, TOP[1]); g.addColorStop(0, 'rgba(7,7,10,0)'); g.addColorStop(1, 'rgba(7,7,10,0.85)');
  ctx.fillStyle = g; ctx.fillRect(0, TOP[1] - 260, W, 260);
  ctx.restore();
}
function marquee(t) {
  ctx.fillStyle = RED; ctx.fillRect(0, MARQ[0], W, MARQ[1] - MARQ[0]);
  const msg = 'TECIDO LEVE E RESPIRÁVEL  •  SECA RÁPIDO  •  CORTE ATLÉTICO  •  MANGA CURTA OU LONGA  •  TROCA EM 7 DIAS  •  ';
  ctx.save(); ctx.beginPath(); ctx.rect(0, MARQ[0], W, MARQ[1] - MARQ[0]); ctx.clip();
  ctx.font = '900 30px Inter'; ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(msg).width, off = -((t * 170) % w);
  for (let x = off; x < W; x += w) ctx.fillText(msg, x, (MARQ[0] + MARQ[1]) / 2 + 2);
  ctx.restore();
}
function priceBar(t) {
  ctx.fillStyle = INK; ctx.fillRect(0, BAR[0], W, BAR[1] - BAR[0] + 40);
  // de/por, light sweep, -34%
  strike('de R$ 287,70', 520, 922, 30, 1);
  const pulse = 1 + 0.05 * beatPulse(t);
  txt('R$ 189,70', 520, 995, { size: 84, color: YEL, sw: 0, scale: pulse, glow: 'rgba(255,204,41,0.3)' });
  const sw = ((t % 1.86) / 1.86);
  ctx.save(); ctx.beginPath(); ctx.rect(200, 950, 640, 95); ctx.clip();
  const gx = 150 + 760 * sw, g = ctx.createLinearGradient(gx - 60, 0, gx + 60, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(200, 950, 640, 95); ctx.restore();
  // right: -34% badge, wiggling on the beat
  ctx.save(); ctx.translate(960, 968); ctx.rotate(-0.15 + 0.08 * Math.sin(t * 6)); const bs = 1 + 0.08 * beatPulse(t); ctx.scale(bs, bs);
  ctx.shadowColor = 'rgba(229,38,47,0.6)'; ctx.shadowBlur = 24; ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(0, 0, 58, 0, Math.PI * 2); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.fillStyle = '#fff'; ctx.font = '800 36px Syne'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('-34%', 0, 4); ctx.restore();
}
function pill(t) {
  // alternates: instalments  <->  call to action
  const phase = Math.floor(Math.max(0, t - 3.85) / 3.7) % 2 === 0 && t >= 3.85 ? 1 : 0;
  const since = t < 3.85 ? t : (t - 3.85) % 3.7;
  const p = t < 0.02 ? 1 : pop(since, 0, 0.3);
  if (phase === 0) chip([['3x de R$ 63,23 sem juros', '#000'], ['  ·  R$ 180,22 no PIX', '#5F2A2E']], 540, PILL_Y, { size: 34, bg: '#fff', scale: p });
  else {
    const bounce = 1 + 0.04 * Math.sin(t * 9);
    ctx.save(); ctx.translate(540, PILL_Y); ctx.scale(p * bounce, p * bounce);
    ctx.shadowColor = 'rgba(255,204,41,0.6)'; ctx.shadowBlur = 30; ctx.fillStyle = YEL; ctx.beginPath(); ctx.roundRect(-300, -42, 600, 84, 42); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.fillStyle = '#000'; ctx.font = '800 40px Syne'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('VER NO SITE  →', 0, 3); ctx.restore();
  }
}
function kitPanel(t) {
  // background below the bar
  ctx.fillStyle = INK; ctx.fillRect(0, BAR[1], W, H - BAR[1]);
  let g = ctx.createRadialGradient(200, 1400, 40, 200, 1400, 600); g.addColorStop(0, 'rgba(229,38,47,0.28)'); g.addColorStop(1, 'rgba(229,38,47,0)');
  ctx.fillStyle = g; ctx.fillRect(0, BAR[1], W, H); g = ctx.createRadialGradient(880, 1500, 40, 880, 1500, 600); g.addColorStop(0, 'rgba(46,91,255,0.25)'); g.addColorStop(1, 'rgba(46,91,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, BAR[1], W, H);
  // product card
  const ch = CARD[1] - CARD[0], s = (ch - 30) / 1860, cw = 1890 * s + 40, cx = 540 - cw / 2, cy = CARD[0];
  const zoom = 1 + 0.02 * Math.sin(t * 1.6);
  ctx.save(); ctx.translate(540, (CARD[0] + CARD[1]) / 2); ctx.scale(zoom, zoom); ctx.translate(-540, -(CARD[0] + CARD[1]) / 2);
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 28); ctx.fill(); ctx.shadowColor = 'transparent';
  const ox = cx + 20 - 60 * s, oy = cy + 15 - 525 * s;
  ctx.save(); ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 28); ctx.clip();
  ctx.drawImage(IMG.mock, ox, oy, 2000 * s, 3000 * s);
  // spotlight cycles through the pieces on the beat
  const order = ['curta', 'longa', 'shorts', null], step = Math.floor(Math.max(0, t - 0.16) / 1.85) % 4, k = order[step];
  if (k) {
    const [x0, y0, x1, y1] = PIECE[k], bx = ox + x0 * s, by = oy + y0 * s, bw = (x1 - x0) * s, bh = (y1 - y0) * s;
    ctx.fillStyle = 'rgba(7,7,10,0.45)'; ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.roundRect(bx, by, bw, bh, 20); ctx.fill('evenodd');
    ctx.restore();
    ctx.strokeStyle = YEL; ctx.lineWidth = 6; ctx.shadowColor = 'rgba(255,204,41,0.6)'; ctx.shadowBlur = 18; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 20); ctx.stroke(); ctx.shadowColor = 'transparent';
  } else ctx.restore();
  ctx.restore();
  // side labels: the active piece lights up
  const lab = [['longa', 'MANGA', 'LONGA', 140, 1300], ['curta', 'MANGA', 'CURTA', 940, 1300], ['shorts', 'SHORTS', '', 140, 1500]];
  for (const [key, a, b, x, y] of lab) {
    const on = k === key || k === null;
    txt(a, x, y, { size: 38, sw: 0, color: on ? YEL : 'rgba(255,255,255,0.45)', scale: on ? 1.04 : 1 });
    if (b) txt(b, x, y + 44, { size: 38, sw: 0, color: on ? YEL : 'rgba(255,255,255,0.45)', scale: on ? 1.04 : 1 });
  }
}

// ---------- typography ----------
function txt(str, x, y, o = {}) {
  const { size = 96, color = '#fff', scale = 1, alpha = 1, sw = 14, font = 'Syne', weight = 800, align = 'center', maxW = 980, glow = null, ls = 0 } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(str).width; if (w > maxW) ctx.scale(maxW / w, maxW / w);
  if (sw) { ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; ctx.lineWidth = sw; ctx.strokeStyle = '#000'; ctx.strokeText(str, 0, 0); }
  ctx.shadowColor = glow || 'transparent'; ctx.shadowBlur = glow ? 44 : 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function chip(parts, x, y, o = {}) {   // parts: [[text, color], ...]
  const { size = 40, bg = '#000', scale = 1, font = 'Inter', weight = 800, alpha = 1 } = o;
  if (scale <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${font}`; ctx.textBaseline = 'middle';
  const tw = parts.reduce((w, [s]) => w + ctx.measureText(s).width, 0), w = tw + 60, h = size + 34;
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.shadowColor = 'transparent';
  let cx = -tw / 2; ctx.textAlign = 'left';
  for (const [s, col] of parts) { ctx.fillStyle = col; ctx.fillText(s, cx, 3); cx += ctx.measureText(s).width; }
  ctx.restore();
}
function callout(t, [a, b, label, line]) {
  if (t < a || t >= b) return;
  const out = 1 - prog(t, b - 0.12, b);
  const pl = pop(t, a + 0.06, 0.24) * out, pb = pop(t, a + 0.16, 0.28) * out;
  // red label tag
  if (pl > 0) {
    ctx.save(); ctx.translate(540, 1150); ctx.scale(pl, pl); ctx.rotate(-0.025);
    ctx.font = '900 36px Inter'; const w = ctx.measureText(label).width + 48;
    ctx.fillStyle = RED; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 18; ctx.fillRect(-w / 2, -30, w, 60); ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 2); ctx.restore();
  }
  line.split('|').forEach((l, i) => txt(l, 540, 1250 + i * 96, { size: 88, scale: pb, sw: 16 }));
}
function logo(x, y, w, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18;
  ctx.drawImage(IMG.logo, x - w / 2, y - w * IMG.logo.height / IMG.logo.width / 2, w, w * IMG.logo.height / IMG.logo.width);
  ctx.restore();
}
function vignette(k = 0.55) {
  const g = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(5,8,25,${k})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function strike(str, x, y, size, p, color = 'rgba(255,255,255,0.75)') {
  txt(str, x, y, { size, font: 'Inter', weight: 800, sw: 0, color, scale: p > 0 ? 1 : 0 });
  if (p <= 0) return;
  ctx.save(); ctx.font = `800 ${size}px Inter`; const w = ctx.measureText(str).width;
  ctx.strokeStyle = RED; ctx.lineWidth = size * 0.12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - w / 2 - 8, y + 2); ctx.lineTo(x - w / 2 - 8 + (w + 16) * eout(p), y + 2); ctx.stroke(); ctx.restore();
}
async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  athletePanel(t);
  kitPanel(t);
  marquee(t);
  priceBar(t);
  pill(t);
  // top tag (inside the safe area)
  chip([['KIT ', '#fff'], ['PHOENIX', RED], ['  ·  3 PEÇAS', '#fff']], 540, 335, { size: 40, bg: 'rgba(0,0,0,0.72)', font: 'Syne', scale: t < 0.02 ? 1 : pop(t, 0) });
  // brand mark in the 9:16-only bottom area (decorative; outside the feed crop)
  ctx.save(); ctx.globalAlpha = 0.85; const lw = 230, lh = lw * IMG.logo.height / IMG.logo.width; ctx.drawImage(IMG.logo, 540 - lw / 2, 1770 - lh / 2, lw, lh); ctx.restore();
  // beat flash on photo cuts
  for (const [, c] of SEQ.slice(1)) { const p = prog(t, c, c + 0.15); if (p > 0 && p < 1) { ctx.fillStyle = `rgba(255,255,255,${0.18 * (1 - p)})`; ctx.fillRect(0, 0, W, TOP[1]); } }
}

const IMG = {};
window.ready = (async () => {
  for (const [k, src] of [['f1', 'src/foto1.jpg'], ['f2', 'src/foto2.jpg'], ['f3', 'src/foto3.jpg'], ['mock', 'src/site_mockup.jpg'], ['logo', 'build/sw_logo_white.png']]) { IMG[k] = new Image(); IMG[k].src = src; await IMG[k].decode(); }
  for (const f of ['800 40px Syne', '900 40px Inter', '800 40px Inter', '700 40px Inter']) await document.fonts.load(f);
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
