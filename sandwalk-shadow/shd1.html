<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Sand Walk Shadow 1</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="build/vo_shd1.js"></script>
<script>
// Shadow creative 1 — clean split-screen Reel for the SHORT-SLEEVE kit page. The only footage shows the athlete in the
// long-sleeve Shadow shirt, so the roles are kept apart: top = the Shadow print in play (labelled as such), bottom = what
// the kit actually contains (store image: short-sleeve tee + shorts). One card on the seam: name, contents, price, and a
// line that follows the voiceover through the product-page benefits. The card sits inside the Reels safe area.
const W = 1080, H = 1920, DUR = 19.2;
const TQ = '#22D3C5', YEL = '#FFCC29', INK = '#0B0B0F', PAPER = '#F2F3F5';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const pop = (t, a, d = 0.26) => t < a ? 0 : eback(prog(t, a, a + d));
const L = k => VO.find(l => l.k === k);

const SPLIT = 860, FPS = 30, NFR = 550;
// top clips: [t0, srcStart, speed, zoom, anchorX, anchorY, screenX, screenY] (1080x1920 frame coords)
const T = { b1: L('b1').s, b2: L('b2').s, b3: L('b3').s, offer: L('offer').s };
const CLIPS = [
  [0, 15.65, 0.55, 1.25, 760, 1000, 680, 470],              // hook: bicycle kick, slow motion
  [T.b1, 12.00, 1.00, 1.20, 570, 870, 540, 470],            // leve e elástico: volley
  [(T.b1 + T.b2) / 2 + 0.2, 3.40, 1.00, 1.20, 600, 1000, 540, 470], //   game play
  [T.b2, 8.40, 1.00, 1.05, 540, 480, 540, 500],             // respirável: close, showing the shirt
  [T.b3, 0.00, 1.00, 1.00, 540, 900, 540, 470],             // estampa: the print on his back
  [(T.b3 + T.offer) / 2, 2.00, 1.00, 1.40, 400, 1000, 540, 470], //   kneeling on the sand
  [T.offer, 6.50, 0.65, 1.10, 540, 700, 540, 500],          // offer: walking to camera, smiling
];
const XF = 0.25;
const cache = new Map();
function frameImg(i) {
  i = clamp(i, 1, NFR);
  if (!cache.has(i)) { const im = new Image(); im.src = `frames/v01/${String(i).padStart(4, '0')}.jpg`; cache.set(i, im.decode().then(() => im)); if (cache.size > 50) cache.delete(cache.keys().next().value); }
  return cache.get(i);
}
async function drawClip(c, t, alpha = 1) {
  const [t0, s0, sp, z, ax, ay, tx, ty] = c, f = (s0 + (t - t0) * sp) * FPS + 1, ia = Math.floor(f);
  const img = await frameImg(ia), img2 = sp < 1 && f - ia > 0.05 ? await frameImg(ia + 1) : null;
  const zz = z * (1 + 0.04 * prog(t, t0, t0 + 3));
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(tx, ty); ctx.scale(zz, zz); ctx.translate(-ax, -ay);
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, W, H);
  if (img2) { ctx.globalAlpha = alpha * (f - ia); ctx.drawImage(img2, 0, 0, W, H); }
  ctx.restore();
}
async function topPanel(t) {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, SPLIT); ctx.clip();
  let i = 0; for (let k = 0; k < CLIPS.length; k++) if (t >= CLIPS[k][0]) i = k;
  const k = i > 0 ? prog(t, CLIPS[i][0], CLIPS[i][0] + XF) : 1;
  if (k < 1) await drawClip(CLIPS[i - 1], t);
  await drawClip(CLIPS[i], t, eio(k));
  const g = ctx.createLinearGradient(0, SPLIT - 240, 0, SPLIT); g.addColorStop(0, 'rgba(11,11,15,0)'); g.addColorStop(1, 'rgba(11,11,15,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, SPLIT - 240, W, 240);
  ctx.restore();
  label('ESTAMPA SHADOW EM QUADRA', 60, 315, 'rgba(0,0,0,0.6)', '#fff');
}
function label(str, x, y, bg, color) {
  ctx.save(); ctx.font = '800 26px Inter'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(str).width + 40;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y - 24, w, 48, 24); ctx.fill();
  ctx.fillStyle = TQ; ctx.beginPath(); ctx.arc(x + 22, y, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color; ctx.fillText(str, x + 36, y + 1); ctx.restore();
}
function kit(t) {
  ctx.fillStyle = PAPER; ctx.fillRect(0, SPLIT, W, H - SPLIT);
  const s = 0.4 * (1 + 0.012 * Math.sin(t * 1.2)), fy = 6 * Math.sin(t * 1.5);
  const cx = 540, topY = 1075 + fy, x0 = 475, x1 = 1524, y0 = 538;
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(IMG.mock, cx - ((x0 + x1) / 2) * s, topY - y0 * s, 2000 * s, 3000 * s); ctx.restore();
  ctx.save(); ctx.filter = 'blur(26px)'; ctx.fillStyle = 'rgba(0,0,0,0.13)';
  ctx.beginPath(); ctx.ellipse(540, 1860, 240, 28, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  label('O QUE VEM NO KIT', 60, 1100, INK, '#fff');
}
function card(t) {
  const w = 780, h = 300, x = 540 - w / 2, y0 = SPLIT - h / 2;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(x, y0, w, h, 36); ctx.fill(); ctx.restore();
  ctx.save(); ctx.textBaseline = 'middle';
  ctx.font = '800 58px Syne'; const a = 'KIT ', b = 'SHADOW', wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(a, 540 - (wa + wb) / 2, y0 + 60); ctx.fillStyle = TQ; ctx.fillText(b, 540 - (wa + wb) / 2 + wa, y0 + 60);
  ctx.textAlign = 'center'; ctx.font = '700 29px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('camiseta manga curta + shorts', 540, y0 + 114);
  // price with a slow light sweep
  ctx.font = '800 80px Syne'; ctx.fillStyle = YEL; ctx.fillText('R$ 99,90', 540, y0 + 186);
  const pw = ctx.measureText('R$ 99,90').width, px = 540 - pw / 2, sw = (t % 4) / 4, gx = px - 60 + (pw + 120) * eio(clamp(sw * 1.6));
  ctx.save(); ctx.beginPath(); ctx.rect(px, y0 + 146, pw, 80); ctx.clip();
  const g = ctx.createLinearGradient(gx - 50, 0, gx + 50, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(px, y0 + 146, pw, 80); ctx.restore();
  // the line that follows the voiceover (product-page benefits / payment)
  const rows = [[0, '3x de R$ 33,30 sem juros'], [T.b1, '✓ leve e elástico'], [T.b2, '✓ respirável · seca rápido'], [T.b3, '✓ não amassa · estampa resiste'], [T.offer, '3x de R$ 33,30 sem juros']];
  let r = 0; for (let k = 0; k < rows.length; k++) if (t >= rows[k][0]) r = k;
  const p = r === 0 && t < 0.02 ? 1 : pop(t, rows[r][0], 0.25);
  ctx.save(); ctx.translate(540, y0 + 256); ctx.scale(p, p); ctx.font = '800 30px Inter'; ctx.fillStyle = r > 0 && r < 4 ? TQ : '#fff'; ctx.fillText(rows[r][1], 0, 0); ctx.restore();
  ctx.restore();
}

async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  await topPanel(t);
  kit(t);
  ctx.fillStyle = TQ; ctx.fillRect(0, SPLIT - 3, W, 6);
  card(t);
  const fo = prog(t, DUR - 0.3, DUR); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

const IMG = {};
window.ready = (async () => {
  IMG.mock = new Image(); IMG.mock.src = 'src/site_mockup.jpg'; await IMG.mock.decode();
  for (const f of ['800 40px Syne', '800 40px Inter', '700 40px Inter']) await document.fonts.load(f, 'A✓');
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
