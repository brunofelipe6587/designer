<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Sand Walk Shadow 2c</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Shadow creative 2c — the client's funk track, edited for clarity after feedback on 2b ("too fast, too much info").
// Track window 109.65–129.65 s (calm pre-drop, drop at 115.30, the song's own ending). One idea on screen at a time:
//   0–5.68   the kit: name → what's in it → price, each held (calm part of the track)
//   5.68–14.30  three slow shots (4 beats each), one benefit each, in a plain caption box
//   14.30–20  offer: name, contents, price, 3x, CTA — built one line at a time, then held for ~3 s
// Mostly white on near-black; turquoise only on "SHADOW" and the CTA. No glitch/flash. Text inside y ≈ 270–1250.
const W = 1080, H = 1920, DUR = 20.0, FPS = 30, NFR = 550;
const TQ = '#22D3C5', INK = '#08090C', WHITE = '#FFFFFF';
const P = 0.7185, DROP = 5.68, SHOT = 4 * P, OUT = DROP + 3 * SHOT;
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eout = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));
// soft entrance: fade + rise, 0.45 s
const enter = (t, at, d = 0.45) => eout(prog(t, at, at + d));

// ---------- footage ----------
const cache = new Map();
function frameImg(i) {
  i = clamp(Math.round(i), 1, NFR);
  if (!cache.has(i)) { const im = new Image(); im.src = `frames/v01/${String(i).padStart(4, '0')}.jpg`; cache.set(i, im.decode().then(() => im)); if (cache.size > 40) cache.delete(cache.keys().next().value); }
  return cache.get(i);
}
async function drawFoot(src, z, ax, ay, alpha = 1, filter = 'none') {
  const f = src * FPS + 1, ia = Math.floor(f), fr = f - ia;
  const a = await frameImg(ia), b = fr > 0.08 ? await frameImg(ia + 1) : null;
  ax = clamp(ax, 540 / z, W - 540 / z); ay = clamp(ay, 960 / z, H - 960 / z);
  ctx.save(); ctx.globalAlpha = alpha; ctx.filter = filter;
  ctx.translate(540, 960); ctx.scale(z, z); ctx.translate(-ax, -ay);
  ctx.drawImage(a, 0, 0, W, H);
  if (b) { ctx.globalAlpha = alpha * fr; ctx.drawImage(b, 0, 0, W, H); }
  ctx.restore();
}
// shots: [srcStart, speed, zoom, anchorX, anchorY, big, small]
const SHOTS = [
  [15.30, 0.80, 1.10, 560, 820, 'LEVE', 'e elástico'],                // bicycle kick, slow motion
  [7.00, 0.95, 1.00, 540, 900, 'RESPIRÁVEL', 'e seca rápido'],         // close to camera, showing the shirt
  [0.00, 0.70, 1.00, 540, 900, 'NÃO AMASSA', 'e a estampa dura'],      // the print on his back
];
const GRADE = 'contrast(1.08) saturate(1.05)';

// ---------- helpers ----------
const anton = s => { ctx.font = `${s}px Anton`; };
function box(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function kit(cx, top, h, glow = 0.5) {
  const im = IMG.kit, w = h * im.width / im.height;
  if (glow > 0) { ctx.save(); ctx.globalAlpha = glow; ctx.filter = 'blur(34px)'; ctx.drawImage(IMG.kitGlow, cx - w / 2, top, w, h); ctx.restore(); }
  ctx.drawImage(im, cx - w / 2, top, w, h);
}
function backdrop(t) {
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(540, 820, 60, 540, 820, 760);
  g.addColorStop(0, 'rgba(34,211,197,0.16)'); g.addColorStop(1, 'rgba(34,211,197,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function title(t, at, y, size) {
  const k = enter(t, at, 0.5); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k; ctx.translate(0, (1 - k) * 30);
  anton(size); ctx.textBaseline = 'middle';
  const a = 'KIT ', b = 'SHADOW', wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, x = 540 - (wa + wb) / 2;
  ctx.textAlign = 'left'; ctx.fillStyle = WHITE; ctx.fillText(a, x, y); ctx.fillStyle = TQ; ctx.fillText(b, x + wa, y);
  ctx.restore();
}
function grain(t) {
  ctx.save(); ctx.globalAlpha = 0.04; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(IMG.noise[Math.floor(t * FPS) % IMG.noise.length], 0, 0, W, H); ctx.restore();
}

// ---------- scenes ----------
function intro(t) {
  backdrop(t);
  const z = 1 + 0.035 * eio(prog(t, 0, DROP));
  ctx.save(); ctx.translate(540, 820); ctx.scale(z, z); ctx.translate(-540, -820);
  kit(540, 455, 600, 0.45);
  ctx.restore();
  // frame 1 already reads "KIT SHADOW" over the kit (thumbnail)
  title(t, -1, 360, 150);
  // what's in it
  const k1 = enter(t, 1.0);
  if (k1 > 0) {
    ctx.save(); ctx.globalAlpha = k1; ctx.translate(0, (1 - k1) * 24);
    ctx.font = '800 42px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const s = 'camiseta manga curta + shorts', w = ctx.measureText(s).width + 70;
    box(540 - w / 2, 1095 - 40, w, 80, 40, 'rgba(255,255,255,0.14)');
    ctx.fillStyle = WHITE; ctx.fillText(s, 540, 1097); ctx.restore();
  }
  // price
  const k2 = enter(t, 2.6);
  if (k2 > 0) {
    ctx.save(); ctx.globalAlpha = k2; ctx.translate(0, (1 - k2) * 24); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    box(540 - 200, 1146, 400, 100, 22, WHITE);
    anton(82); ctx.fillStyle = INK; ctx.fillText('R$ 99,90', 540, 1198); ctx.restore();
  }
  // gentle hand-off into the drop
  const fo = prog(t, DROP - 0.25, DROP); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo * 0.8})`; ctx.fillRect(0, 0, W, H); }
}
async function drop(t) {
  const i = clamp(Math.floor((t - DROP) / SHOT), 0, SHOTS.length - 1), t0 = DROP + i * SHOT, dt = t - t0;
  const [s0, sp, z0, ax, ay, big, small] = SHOTS[i];
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const z = z0 * (1.02 + 0.05 * eio(prog(dt, 0, SHOT)));
  await drawFoot(s0 + dt * sp, z, ax, ay, 1, GRADE);
  // previous shot dissolves out over 0.3 s
  if (i > 0 && dt < 0.3) {
    const [ps0, psp, pz0, pax, pay] = SHOTS[i - 1];
    await drawFoot(ps0 + (SHOT + dt) * psp, pz0 * 1.07, pax, pay, 1 - eio(dt / 0.3), GRADE);
  }
  if (i === 0 && dt < 0.25) { ctx.fillStyle = `rgba(0,0,0,${0.8 * (1 - dt / 0.25)})`; ctx.fillRect(0, 0, W, H); }
  // darken the caption area so the text always reads
  const g = ctx.createLinearGradient(0, 860, 0, 1400); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = g; ctx.fillRect(0, 860, W, 540);
  // product + price stay on screen while the footage plays
  ctx.save(); ctx.textBaseline = 'middle'; ctx.font = '800 30px Inter';
  const lab = 'KIT SHADOW  ·  R$ 99,90', lw = ctx.measureText(lab).width + 52;
  box(60, 290, lw, 64, 32, 'rgba(0,0,0,0.6)'); ctx.fillStyle = WHITE; ctx.fillText(lab, 86, 323); ctx.restore();
  // one benefit per shot: comes in, holds, leaves before the cut
  const k = enter(dt, 0.25, 0.5) * (1 - prog(dt, SHOT - 0.3, SHOT - 0.05));
  if (k > 0) {
    ctx.save(); ctx.globalAlpha = k; ctx.translate(0, (1 - k) * 30); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    anton(150); ctx.fillStyle = WHITE; ctx.fillText(big, 540, 1135);
    ctx.font = '700 46px Inter'; const sw = ctx.measureText(small).width + 64;
    box(540 - sw / 2, 1168, sw, 76, 38, TQ); ctx.fillStyle = INK; ctx.fillText(small, 540, 1222);
    ctx.restore();
  }
}
function outro(t) {
  const u = t - OUT;
  backdrop(t);
  const kIn = enter(t, OUT, 0.6);
  ctx.save(); ctx.globalAlpha = kIn;
  const lw = 140, lh = lw * IMG.logo.height / IMG.logo.width; ctx.drawImage(IMG.logo, 540 - lw / 2, 285, lw, lh); ctx.restore();
  title(t, OUT, 430, 140);
  ctx.save(); ctx.globalAlpha = kIn; ctx.translate(0, (1 - kIn) * 40); kit(290, 520 + 5 * Math.sin(t * 1.6), 560, 0.45); ctx.restore();
  // right column, one line at a time
  const col = 760;
  const line = (at, draw) => { const k = enter(t, at); if (k <= 0) return; ctx.save(); ctx.globalAlpha = k; ctx.translate(0, (1 - k) * 22); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; draw(); ctx.restore(); };
  line(OUT + 0.7, () => { ctx.font = '800 40px Inter'; ctx.fillStyle = WHITE; ctx.fillText('camiseta', col, 636); ctx.fillText('manga curta', col, 684); ctx.fillText('+ shorts', col, 732); });
  line(OUT + 1.4, () => { anton(120); ctx.fillStyle = WHITE; ctx.fillText('R$ 99,90', col, 880); });
  line(OUT + 2.1, () => { ctx.font = '700 32px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillText('ou 3x de R$ 33,30', col, 940); ctx.fillText('sem juros', col, 980); });
  // CTA
  const kc = enter(t, OUT + 2.9, 0.5);
  if (kc > 0) {
    const pulse = 1 + 0.025 * Math.max(0, Math.sin((t - OUT - 3.4) * Math.PI / P)) * (t > OUT + 3.4 ? 1 : 0);
    ctx.save(); ctx.globalAlpha = kc; ctx.translate(540, 1165 + (1 - kc) * 24); ctx.scale(pulse, pulse);
    box(-390, -62, 780, 124, 62, TQ);
    anton(62); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = INK; ctx.fillText('GARANTA O SEU  →', 0, 2);
    ctx.restore();
  }
  if (u < 0.3) { ctx.fillStyle = `rgba(0,0,0,${0.8 * (1 - u / 0.3)})`; ctx.fillRect(0, 0, W, H); }
}

async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  if (t < DROP) intro(t); else if (t < OUT) await drop(t); else outro(t);
  grain(t);
  const fo = prog(t, DUR - 0.4, DUR); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo * 0.7})`; ctx.fillRect(0, 0, W, H); }
}

const IMG = {};
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function load(src) { const im = new Image(); im.src = src; return im.decode().then(() => im); }
window.ready = (async () => {
  IMG.kit = await load('build/kit_cutout.png');
  IMG.logo = await load('build/sw_logo_white.png');
  const gc = document.createElement('canvas'); gc.width = IMG.kit.width; gc.height = IMG.kit.height; const g = gc.getContext('2d');
  g.drawImage(IMG.kit, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = TQ; g.fillRect(0, 0, gc.width, gc.height); IMG.kitGlow = gc;
  IMG.noise = [];
  for (let k = 0; k < 4; k++) {
    const nc = document.createElement('canvas'); nc.width = 540; nc.height = 960; const n = nc.getContext('2d'), d = n.createImageData(540, 960);
    for (let p = 0; p < d.data.length; p += 4) { const v = hash(p * 0.37 + k * 1000.3) * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
    n.putImageData(d, 0, 0); IMG.noise.push(nc);
  }
  for (const f of ['40px Anton', '800 40px Inter', '700 40px Inter']) await document.fonts.load(f, 'AÉÃ→·');
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
