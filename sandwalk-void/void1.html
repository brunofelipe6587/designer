<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Sand Walk Void 1</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Void creative 1 "Bicicleta na areia" — proof in action: the athlete's bicycle kicks / dives on the sand court (02)
// cut on the beat of the brand video's track, each move paired with a product-page claim, the zip pocket and fabric
// close-ups (01), then the offer over the studio photo. Kit name + price on frame 1.
const W = 1080, H = 1920, DUR = 18.0;
const RED = '#E2333F', NAVY = '#14205E', YEL = '#FFCC29';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const pop = (t, a, d = 0.26) => t < a ? 0 : eback(prog(t, a, a + d));

// [folder, fps, extraction start (source s), frame count] — prep_void1.sh
const CLIP = { a02: ['a02', 30, 12.9, 471], p01: ['p01', 30, 2.9, 165] };
// cuts sit on the track's strong beats (≈129 bpm, every other beat ≈ 0.93 s)
// shots: [t0, t1, clip, srcStart, speed, zoom, anchorX, anchorY, screenX, screenY]
const OFFER = 12.17;
const SHOTS = [
  [0.00, 2.00, 'a02', 21.20, 0.50, 1.35, 495, 760, 540, 1000],  // hook: bicycle kick, slow motion
  [2.00, 2.93, 'a02', 18.60, 1.00, 1.30, 520, 1000, 540, 1000], // volley on the ground
  [2.93, 4.78, 'a02', 13.00, 1.00, 1.15, 470, 900, 540, 960],   // chest control, close
  [4.78, 6.62, 'a02', 15.20, 0.75, 1.60, 460, 700, 540, 820],   // bicycle kick #2
  [6.62, 7.55, 'p01', 4.80, 1.00, 1.04, 540, 960, 540, 960],    // fabric on the shoulder (track break)
  [7.55, 9.38, 'p01', 3.00, 1.00, 1.04, 540, 1100, 540, 1060],  // zip pocket opening
  [9.38, 10.31, 'a02', 27.60, 1.00, 1.25, 630, 1000, 540, 1000],// scissor volley
  [10.31, 11.24, 'a02', 24.60, 1.00, 1.30, 700, 850, 600, 960], // bicycle kick #3
  [11.24, OFFER, 'p01', 7.30, 1.00, 1.04, 540, 900, 540, 960],  // SW logo on the chest
];
// product-page claims paired with the moves: [t0, t1, label, line]
const CALLOUTS = [
  [2.00, 2.93, 'FEITO PRA AREIA', 'JOGA SOLTO'],
  [2.93, 4.78, 'TECIDO', 'LEVE E RESPIRÁVEL'],
  [4.78, 6.62, 'MATERIAL ELÁSTICO', 'LIBERDADE DE|MOVIMENTO'],
  [6.62, 7.55, 'SECAGEM', 'RÁPIDA'],
  [7.55, 9.38, 'NO SHORTS', 'BOLSO COM ZÍPER'],
];

const cache = new Map();
function frameImg(c, idx) {
  const [dir, , , n] = CLIP[c], i = clamp(idx, 1, n), key = dir + i;
  if (!cache.has(key)) {
    const im = new Image(); im.src = `frames/${dir}/${String(i).padStart(4, '0')}.jpg`;
    cache.set(key, im.decode().then(() => im));
    if (cache.size > 60) cache.delete(cache.keys().next().value);
  }
  return cache.get(key);
}
async function drawShot(t) {
  let si = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) si = i;
  const [t0, t1, c, s0, sp, z, ax, ay, tx, ty] = SHOTS[si];
  const [, fps, start] = CLIP[c];
  const f = (s0 + (t - t0) * sp - start) * fps + 1, ia = Math.floor(f);
  const img = await frameImg(c, ia), img2 = sp < 1 && f - ia > 0.05 ? await frameImg(c, ia + 1) : null;
  const zz = z * (1 + 0.025 * prog(t, t0, t1)) * (1 + 0.07 * (1 - eout(prog(t, t0, t0 + 0.2))) * (si > 0 ? 1 : 0)); // drift + beat punch
  ctx.save(); ctx.translate(tx, ty); ctx.scale(zz, zz); ctx.translate(-ax, -ay);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, W, H);
  if (img2) { ctx.globalAlpha = f - ia; ctx.drawImage(img2, 0, 0, W, H); ctx.globalAlpha = 1; }
  ctx.restore();
}

// ---------- typography ----------
function txt(str, x, y, o = {}) {
  const { size = 96, color = '#fff', scale = 1, alpha = 1, sw = 14, font = 'Syne', weight = 800, align = 'center', maxW = 980, glow = null, ls = 0 } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(str).width; if (w > maxW) ctx.scale(maxW / w, maxW / w);
  if (sw) { ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6; ctx.lineWidth = sw; ctx.strokeStyle = '#000'; ctx.strokeText(str, 0, 0); }
  ctx.shadowColor = glow || 'transparent'; ctx.shadowBlur = glow ? 44 : 0; ctx.shadowOffsetY = 0;
  ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function chip(parts, x, y, o = {}) {   // parts: [[text, color], ...]
  const { size = 40, bg = '#000', scale = 1, font = 'Inter', weight = 800, alpha = 1 } = o;
  if (scale <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${font}`; ctx.textBaseline = 'middle';
  const tw = parts.reduce((w, [s]) => w + ctx.measureText(s).width, 0), w = tw + 60, h = size + 34;
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.shadowColor = 'transparent';
  let cx = -tw / 2; ctx.textAlign = 'left';
  for (const [s, col] of parts) { ctx.fillStyle = col; ctx.fillText(s, cx, 3); cx += ctx.measureText(s).width; }
  ctx.restore();
}
function callout(t, [a, b, label, line]) {
  if (t < a || t >= b) return;
  const out = 1 - prog(t, b - 0.12, b);
  const pl = pop(t, a + 0.06, 0.24) * out, pb = pop(t, a + 0.16, 0.28) * out;
  // red label tag
  if (pl > 0) {
    ctx.save(); ctx.translate(540, 1150); ctx.scale(pl, pl); ctx.rotate(-0.025);
    ctx.font = '900 36px Inter'; const w = ctx.measureText(label).width + 48;
    ctx.fillStyle = RED; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 18; ctx.fillRect(-w / 2, -30, w, 60); ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 2); ctx.restore();
  }
  line.split('|').forEach((l, i) => txt(l, 540, 1250 + i * 96, { size: 88, scale: pb, sw: 16 }));
}
function logo(x, y, w, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18;
  ctx.drawImage(IMG.logo, x - w / 2, y - w * IMG.logo.height / IMG.logo.width / 2, w, w * IMG.logo.height / IMG.logo.width);
  ctx.restore();
}
function vignette(k = 0.55) {
  const g = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(5,8,25,${k})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  if (t < OFFER) {
    await drawShot(t);
    vignette();
    let g = ctx.createLinearGradient(0, 0, 0, 520); g.addColorStop(0, 'rgba(5,8,25,0.6)'); g.addColorStop(1, 'rgba(5,8,25,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 520);
    g = ctx.createLinearGradient(0, 1020, 0, 1420); g.addColorStop(0, 'rgba(5,8,25,0)'); g.addColorStop(0.5, 'rgba(5,8,25,0.35)'); g.addColorStop(1, 'rgba(5,8,25,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 1020, W, 400);

    if (t < 2.0) {
      // ===== hook: kit name + what's in it + price, from frame 1 =====
      const k = 1 - prog(t, 1.85, 2.0), s0 = t < 0.02 ? 1 : pop(t, -0.1, 0.25);
      txt('KIT VOID', 540, 300, { size: 150, scale: s0 * k, sw: 0, glow: RED, ls: 4 });
      chip([['camiseta + shorts', '#fff']], 540, 430, { size: 40, bg: NAVY, scale: (t < 0.02 ? 1 : pop(t, 0.05)) * k });
      chip([['R$ 99,90', '#000']], 540, 1250, { size: 64, bg: YEL, font: 'Syne', scale: (t < 0.02 ? 1 : pop(t, 0.15, 0.3)) * k });
      chip([['3x R$ 33,30 sem juros', '#fff']], 540, 1360, { size: 32, bg: 'rgba(0,0,0,0.6)', weight: 700, scale: (t < 0.02 ? 1 : pop(t, 0.3)) * k });
    } else {
      // persistent tag: which product, how much
      chip([['KIT ', '#fff'], ['VOID', RED], ['  ·  R$ 99,90', YEL]], 540, 250, { size: 38, bg: 'rgba(0,0,0,0.72)', font: 'Syne', scale: pop(t, 2.02, 0.22) });
      for (const c of CALLOUTS) callout(t, c);
    }
  } else {
    // ===== offer over the studio photo =====
    const E = OFFER, s = 0.96 * (1.0 + 0.06 * prog(t, E, DUR));
    const iw = 1500 * s, ih = 2000 * s;
    ctx.drawImage(IMG.photo, 540 - iw / 2, 900 - ih * 0.47, iw, ih);
    const b = eout(prog(t, E, E + 0.4));
    let g = ctx.createLinearGradient(0, 600, 0, 1300); g.addColorStop(0, 'rgba(5,8,25,0)'); g.addColorStop(1, `rgba(5,8,25,${0.92 * b})`);
    ctx.fillStyle = g; ctx.fillRect(0, 600, W, 700); ctx.fillStyle = `rgba(5,8,25,${0.92 * b})`; ctx.fillRect(0, 1300, W, H - 1300);
    g = ctx.createRadialGradient(540, 1150, 60, 540, 1150, 620); g.addColorStop(0, `rgba(226,51,63,${0.22 * b})`); g.addColorStop(1, 'rgba(226,51,63,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 500, W, 1400);
    vignette(0.45);
    txt('KIT VOID', 540, 860, { size: 120, scale: pop(t, E + 0.1), sw: 0, glow: RED, ls: 4 });
    txt('CAMISETA + SHORTS', 540, 950, { size: 38, font: 'Inter', weight: 800, sw: 0, ls: 8, color: 'rgba(255,255,255,0.88)', alpha: clamp(prog(t, E + 0.35, E + 0.6)) });
    txt('R$ 99,90', 540, 1085, { size: 180, color: YEL, scale: pop(t, E + 0.55, 0.32), sw: 0, glow: 'rgba(255,204,41,0.35)' });
    chip([['3x de R$ 33,30 sem juros', '#000']], 540, 1225, { size: 38, bg: '#fff', scale: pop(t, E + 0.95) });
    chip([['R$ 94,91 no PIX  ·  troca em 7 dias', '#fff']], 540, 1320, { size: 32, bg: 'rgba(255,255,255,0.14)', weight: 700, scale: pop(t, E + 1.2) });
    const cp = pop(t, E + 1.7, 0.35);
    if (cp > 0) {
      const pulse = 1 + 0.03 * Math.sin((t - E - 2.1) * 7) * clamp((t - E - 2.05) * 3);
      ctx.save(); ctx.translate(540, 1450); ctx.scale(cp * pulse, cp * pulse);
      ctx.shadowColor = 'rgba(255,204,41,0.5)'; ctx.shadowBlur = 40; ctx.fillStyle = YEL;
      ctx.beginPath(); ctx.roundRect(-360, -58, 720, 116, 58); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.fillStyle = '#000'; ctx.font = '800 46px Syne'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('VER NO SITE', 0, 3); ctx.restore();
      txt('lojasandwalk.com.br', 540, 1550, { size: 34, font: 'Inter', weight: 700, sw: 0, color: 'rgba(255,255,255,0.9)', alpha: clamp(prog(t, E + 2.0, E + 2.3)) });
    }
    const fo = prog(t, DUR - 0.25, DUR); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo * 0.6})`; ctx.fillRect(0, 0, W, H); }
  }

  // flashes: into the montage and into the offer
  let f = 0;
  [[2.0, 0.35], [OFFER, 0.55]].forEach(([a, m]) => { const p = prog(t, a - 0.005, a + 0.18); if (p > 0 && p < 1) f = Math.max(f, m * (1 - eout(p))); });
  if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, H - 8, W, 8);
  ctx.fillStyle = RED; ctx.fillRect(0, H - 8, W * (t / DUR), 8);
}

const IMG = {};
window.ready = (async () => {
  for (const [k, src] of [['logo', 'build/sw_logo_white.png'], ['photo', 'src/foto5.jpg']]) { IMG[k] = new Image(); IMG[k].src = src; await IMG[k].decode(); }
  for (const f of ['800 40px Syne', '900 40px Inter', '800 40px Inter', '700 40px Inter']) await document.fonts.load(f);
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
