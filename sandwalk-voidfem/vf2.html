<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Sand Walk Void Feminino 2</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Kit Feminino Void, creative 2 — "OUTFIT CHECK" (the checklist trend), cut to the instrumental from reference video 2
// (130 bpm, bars of 1.845 s, window 0.30–20.9 s). Women's plays full screen, natural colour, snappy cuts every
// 2 beats; on top, die-cut stickers of each piece (make_stickers.py) and a checklist that ticks one item per bar:
//   bars 0–1  hook: OUTFIT CHECK · futevôlei feminino, full-kit sticker (frame 1)
//   bars 2–5  checklist: manga longa / manga curta / shorts / estampa — sticker + one line each
//   bars 6–7  1 kit, 2 looks: manga longa + shorts, manga curta + shorts
//   bars 8–10 offer: kit sticker + price tag (de R$ 287,70 por R$ 189,70, -34%), 3x, troca, CTA
// Athletes are framed in the top half; header on top, stickers/checklist in the lower part of the safe area.
const W = 1080, H = 1920, DUR = 20.6, FPS = 30;
const BEAT = 0.4613, B0 = 0.03, BAR = 4 * BEAT, bar = k => B0 + k * BAR;
const CHECK = bar(2), LOOKS = bar(6), OUT = bar(8);
const RED = '#E0263C', NAVY = '#1B2366', WHITE = '#FFFFFF', INK = '#10121F', PINK = '#FF5C8A';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eout = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eel = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;  // elastic
const prog = (t, a, b) => clamp((t - a) / (b - a));
const enter = (t, at, d = 0.4) => eout(prog(t, at, at + d));

// ---------- plays: one per 2 beats ----------
// [dir, frames, zoom, anchorX]; bottom-aligned so the athlete sits in the top half
const PL = [
  ['h2', 34, 1.30, 540], ['x2', 22, 1.20, 560], ['h1', 36, 1.02, 430], ['m1', 34, 1.18, 540],
  ['m2', 33, 1.24, 900], ['m6', 33, 1.35, 430], ['x1', 26, 1.10, 520], ['m7', 30, 1.35, 680],
  ['m9', 36, 1.04, 470], ['x3', 31, 1.10, 600], ['m5', 33, 1.35, 300], ['m10', 33, 1.03, 540],
  ['h3', 34, 1.05, 650], ['m4', 23, 1.02, 420], ['x4', 30, 1.15, 560], ['h4', 33, 1.08, 760],
  ['o1', 48, 1.20, 430], ['o2', 63, 1.02, 430], ['o3', 41, 1.10, 540]];
// the last three (offer) run a bar each, the rest 2 beats
const SEQ = []; { let t = 0; PL.forEach((p, i) => { const len = i === 0 ? B0 + 2 * BEAT : i < 16 ? 2 * BEAT : i < 18 ? BAR : DUR - t; SEQ.push({ dir: p[0], n: p[1], z: p[2], ax: p[3], t0: t, t1: t + len }); t += len; }); }
const cache = new Map();
function frameImg(dir, n, i) {
  i = clamp(Math.round(i), 1, n); const key = dir + i;
  if (!cache.has(key)) { const im = new Image(); im.src = `frames/${dir}/${String(i).padStart(4, '0')}.jpg`; cache.set(key, im.decode().then(() => im)); if (cache.size > 60) cache.delete(cache.keys().next().value); }
  return cache.get(key);
}
async function plays(t) {
  let i = SEQ.findIndex(s => t < s.t1); if (i < 0) i = SEQ.length - 1;
  const sh = SEQ[i], u = clamp((t - sh.t0) / (sh.t1 - sh.t0)), dt = t - sh.t0;
  const f = 1 + u * (sh.n - 1), ia = Math.floor(f), fr = f - ia;
  const a = await frameImg(sh.dir, sh.n, ia), b = fr > 0.08 ? await frameImg(sh.dir, sh.n, ia + 1) : null;
  // snappy cut: each shot lands slightly zoomed and tilted and settles with a little bounce
  const land = i > 0 ? 1 - eel(clamp(dt / 0.45)) : 0;
  const z = sh.z * (1.02 + 0.03 * u + 0.07 * land), ax = clamp(sh.ax, 540 / z, W - 540 / z), ay = H - 960 / z;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.filter = 'contrast(1.06) saturate(1.12) brightness(0.97)';
  ctx.translate(540, 960); ctx.rotate((i % 2 ? 1 : -1) * 0.02 * land); ctx.scale(z, z); ctx.translate(-ax, -ay);
  ctx.drawImage(a, 0, 0, W, H);
  if (b) { ctx.globalAlpha = fr; ctx.drawImage(b, 0, 0, W, H); }
  ctx.restore();
  let g = ctx.createLinearGradient(0, 0, 0, 520); g.addColorStop(0, 'rgba(16,18,31,0.6)'); g.addColorStop(1, 'rgba(16,18,31,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 520);
  g = ctx.createLinearGradient(0, 760, 0, 1300); g.addColorStop(0, 'rgba(16,18,31,0)'); g.addColorStop(1, 'rgba(16,18,31,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 760, W, 1160);
}

// ---------- stickers ----------
// draw a sticker centred at (cx, cy) with height h; pops in elastically from `at`, wobbles gently
function sticker(name, cx, cy, h, at, rot = 0, t = 0, out = 1) {
  const im = IMG[name], k = at <= -1 ? 1 : eel(prog(t, at, at + 0.7)); if (k <= 0 || out <= 0) return;
  const w = h * im.width / im.height, wob = 0.025 * Math.sin((t - at) * 2.4);
  ctx.save(); ctx.globalAlpha = out; ctx.translate(cx, cy); ctx.rotate(rot + wob); ctx.scale(k, k);
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
}
function pill(str, cx, cy, bg, fg, font, at, t, out = 1) {
  const k = enter(t, at, 0.3); if (k <= 0 || out <= 0) return;
  ctx.save(); ctx.globalAlpha = k * out; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(str).width + 54, h = parseInt(font.match(/(\d+)px/)[1]) * 1.9;
  ctx.translate(cx, cy + (1 - k) * 16); ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.fillText(str, 0, 2); ctx.restore();
}
function checkbox(x, y, s, done, p) {
  ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = WHITE; ctx.fillStyle = done ? PINK : 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.roundRect(x, y, s, s, 9); ctx.fill(); ctx.stroke();
  if (done) {   // tick drawn on
    ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    const p1 = clamp(p * 2), p2 = clamp(p * 2 - 1);
    ctx.moveTo(x + s * 0.22, y + s * 0.52); ctx.lineTo(x + s * lerp(0.22, 0.42, p1), y + s * lerp(0.52, 0.72, p1));
    if (p2 > 0) ctx.lineTo(x + s * lerp(0.42, 0.8, p2), y + s * lerp(0.72, 0.28, p2));
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- text ----------
function header(t) {
  // big on the hook, compact afterwards
  const k = eio(prog(t, CHECK - 0.35, CHECK)), size = lerp(66, 56, k), y = lerp(372, 330, k);
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `800 ${size}px Syne`; const s = 'OUTFIT CHECK', w = ctx.measureText(s).width, cb = size * 0.85, gap = size * 0.3;
  const x0 = 540 - (cb + gap + w) / 2;
  checkbox(x0, y - size * 0.8, cb, t > OUT, prog(t, OUT + 0.1, OUT + 0.5));
  ctx.fillStyle = WHITE; ctx.fillText(s, x0 + cb + gap, y); ctx.textAlign = 'center';
  ctx.font = `italic 400 ${lerp(60, 44, k)}px "DM Serif Display"`; ctx.fillStyle = WHITE;
  ctx.fillText(t < OUT ? 'versão futevôlei feminino' : 'aprovado pra areia', 540, y + lerp(70, 54, k));
  ctx.restore();
}
const ITEMS = [   // [title, sub, sticker]
  ['Manga longa', 'tecido respirável', 'ls'],
  ['Manga curta', 'com elastano: flexível', 'ss'],
  ['Shorts', 'valoriza a silhueta', 'sh'],
  ['Estampa exclusiva', 'seca rápido e dura muito', 'print'],
];
function checklist(t) {
  const a = enter(t, CHECK - 0.1, 0.3) * (1 - prog(t, LOOKS - 0.25, LOOKS)); if (a <= 0) return;
  const cur = clamp(Math.floor((t - CHECK) / BAR), 0, 3);
  ctx.save(); ctx.globalAlpha = a;
  ITEMS.forEach(([title], i) => {
    const y = 840 + i * 92, done = t >= CHECK + i * BAR + 0.15, active = i === cur;
    ctx.fillStyle = active ? 'rgba(255,255,255,0.95)' : 'rgba(16,18,31,0.6)';
    ctx.beginPath(); ctx.roundRect(56, y - 4, 470, 76, 38); ctx.fill();
    checkbox(74, y + 10, 50, done, prog(t, CHECK + i * BAR + 0.15, CHECK + i * BAR + 0.45));
    ctx.font = '800 36px Inter'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = active ? INK : WHITE; ctx.fillText(title, 146, y + 36);
  });
  ctx.restore();
  // the current item's sticker on the right and its one line under it
  const t0 = CHECK + cur * BAR, it = ITEMS[cur], out = 1 - prog(t, t0 + BAR - 0.18, t0 + BAR);
  const hh = it[2] === 'sh' ? 250 : it[2] === 'print' ? 300 : 380;
  sticker(it[2], 800, 960, hh, t0 + 0.05, cur % 2 ? 0.07 : -0.07, t, out * a);
  pill(it[1], 800, 1205, PINK, WHITE, '800 30px Inter', t0 + 0.3, t, out * a);
}
function looks(t) {
  if (t < LOOKS - 0.05 || t >= OUT) return;
  const k = clamp(Math.floor((t - LOOKS) / BAR), 0, 1), t0 = LOOKS + k * BAR, out = 1 - prog(t, t0 + BAR - 0.18, t0 + BAR);
  pill('1 KIT, 2 LOOKS', 540, 470, WHITE, INK, '900 46px Inter', LOOKS, t, 1 - prog(t, OUT - 0.2, OUT));
  sticker(k ? 'ss' : 'ls', 540, 840, 360, t0, -0.05, t, out);
  sticker('sh', 560, 1080, 220, t0 + BEAT * 0.5, 0.04, t, out);
  pill(k ? 'LOOK 2 · manga curta + shorts' : 'LOOK 1 · manga longa + shorts', 540, 1225, PINK, WHITE, '800 32px Inter', t0 + BEAT, t, out);
}
function offer(t) {
  if (t < OUT) return;
  const u = t - OUT;
  sticker('full', 300, 960, 430, OUT, -0.05, t);
  // price tag sticker: navy tag with a hole, -34% burst
  const k = eel(prog(u, 2 * BEAT, 2 * BEAT + 0.7));
  if (k > 0) {
    ctx.save(); ctx.translate(790, 930); ctx.rotate(0.06 + 0.02 * Math.sin(u * 2)); ctx.scale(k, k);
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.moveTo(-210, -170); ctx.lineTo(160, -170); ctx.lineTo(240, -60); ctx.lineTo(240, 170); ctx.lineTo(-210, 170); ctx.closePath(); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.fillStyle = NAVY; ctx.beginPath(); ctx.moveTo(-196, -156); ctx.lineTo(152, -156); ctx.lineTo(226, -54); ctx.lineTo(226, 156); ctx.lineTo(-196, 156); ctx.closePath(); ctx.fill();
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(170, -90, 14, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '800 28px Inter'; ctx.fillStyle = WHITE; ctx.fillText('KIT FEMININO VOID', 0, -96);
    ctx.font = '700 32px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.75)'; const o = 'de R$ 287,70', ow = ctx.measureText(o).width; ctx.fillText(o, 0, -38);
    ctx.fillRect(0 - ow / 2 - 2, -50, (ow + 4) * eout(prog(u, 2 * BEAT + 0.4, 2 * BEAT + 0.7)), 4);
    ctx.font = '900 78px Inter'; ctx.fillStyle = WHITE; ctx.fillText('R$ 189,70', 0, 52);
    ctx.font = '700 28px Inter'; ctx.fillStyle = '#FFC2D2'; ctx.fillText('em até 3x sem juros', 0, 104);
    ctx.restore();
    const b = eel(prog(u, 3 * BEAT, 3 * BEAT + 0.6));
    ctx.save(); ctx.translate(985, 735); ctx.rotate(-0.2); ctx.scale(b, b); ctx.fillStyle = RED;
    ctx.beginPath(); for (let i = 0; i < 24; i++) { const r = i % 2 ? 66 : 82, an = i * Math.PI / 12; ctx.lineTo(r * Math.cos(an), r * Math.sin(an)); } ctx.closePath(); ctx.fill();
    ctx.fillStyle = WHITE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '900 40px Inter'; ctx.fillText('-34%', 0, 2); ctx.restore();
  }
  pill('troca em 7 dias  ·  pagamento 100% seguro', 540, 1118, 'rgba(16,18,31,0.7)', WHITE, '700 28px Inter', OUT + 4 * BEAT, t);
  const kc = enter(u, 5 * BEAT, 0.35);
  if (kc > 0) {
    const pb = 1 + 0.03 * Math.exp(-(((t - B0) % BEAT)) / 0.12) * (u > 5 * BEAT + 0.5 ? 1 : 0);
    ctx.save(); ctx.globalAlpha = kc; ctx.translate(540, 1205 + (1 - kc) * 24); ctx.scale(pb, pb);
    ctx.shadowColor = 'rgba(255,92,138,0.6)'; ctx.shadowBlur = 36; ctx.fillStyle = PINK; ctx.beginPath(); ctx.roundRect(-400, -50, 800, 100, 50); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '900 44px Inter'; ctx.fillStyle = WHITE; ctx.fillText('GARANTA O SEU  →', 0, 3);
    ctx.restore();
  }
}
function hook(t) {
  const out = 1 - prog(t, CHECK - 0.25, CHECK); if (out <= 0) return;
  sticker('full', 540, 900, 520, -1, -0.03, t, out);
  pill('KIT FEMININO VOID  ·  3 peças', 540, 1200, WHITE, INK, '900 38px Inter', -1, t, out);
  // price pops on the second bar
  const k = eel(prog(t, bar(1), bar(1) + 0.6));
  if (k > 0) {
    ctx.save(); ctx.globalAlpha = out; ctx.translate(850, 690); ctx.rotate(0.12); ctx.scale(k, k);
    ctx.fillStyle = PINK; ctx.beginPath(); ctx.roundRect(-150, -62, 300, 124, 22); ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = WHITE;
    ctx.font = '700 26px Inter'; ctx.fillText('de R$ 287,70 por', 0, -16); ctx.font = '900 56px Inter'; ctx.fillText('R$ 189,70', 0, 40);
    ctx.restore();
  }
}

async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  await plays(t);
  header(t);
  hook(t);
  checklist(t);
  looks(t);
  offer(t);
  const fo = prog(t, DUR - 0.45, DUR); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo * 0.6})`; ctx.fillRect(0, 0, W, H); }
}

const IMG = {};
function load(src) { const im = new Image(); im.src = src; return im.decode().then(() => im); }
window.ready = (async () => {
  for (const n of ['ls', 'ss', 'sh', 'full', 'print']) IMG[n] = await load(`build/st_${n}.png`);
  for (const f of ['800 40px Syne', 'italic 400 40px "DM Serif Display"', '900 40px Inter', '800 40px Inter', '700 40px Inter']) await document.fonts.load(f, 'AÔéí→·✓ç');
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
</html>
