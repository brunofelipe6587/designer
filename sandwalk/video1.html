<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Sand Walk Brisa 01</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Creative 01 "Bicicleta": Brisa's bicycle kick (optical-flow slow-mo, title behind the athlete) → lance montage on the beat
// → kit carousel with price → sungas → offer + CTA to the home. 120 BPM soundtrack (music.py), cuts on the beat.
// Key copy stays inside the 4:5 feed crop (y 285–1635) so it also reads when Meta crops the 9:16 for the feed.
const W = 1080, H = 1920, DUR = 20.0;
const Y = '#FFCC29', INK = '#0B0B0B';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const eback = t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
const env = (t, a, b, fin = 0.15, fout = 0.15) => (t < a || t > b) ? 0 : Math.min(eout(prog(t, a, a + fin)), 1 - eio(prog(t, b - fout, b)));
const pop = (t, a, d = 0.28) => t < a ? 0 : eback(prog(t, a, a + d));

const HIT = 1.2;
// shots: [t0, t1, seq, startFrame, frames/sec of output, z0, z1, blend]
// seq 'f' = source frames at 30 fps (frame n = n/30 s), 's' = 3x optical-flow slow-mo starting at 86.80 s
const SHOTS = [
  [0.0, 0.5, 'f', 2588, 30, 1.10, 1.14, 0],    // takeoff
  [0.5, 2.2, 's', 1, 30, 1.14, 1.26, 0],       // slow-mo through the ball contact (HIT)
  [2.2, 3.0, 'f', 2621, 30, 1.18, 1.08, 0],    // back to 1x (fall)
  [3.0, 4.0, 'f', 2028, 30, 1.06, 1.16, 0],    // chest control on the sand
  [4.0, 5.0, 'f', 2083, 30, 1.14, 1.04, 0],    // overhead swing
  [5.0, 6.0, 'f', 2238, 30, 1.08, 1.18, 0],    // jump with the ball
  [6.0, 7.0, 'f', 2898, 30, 1.16, 1.06, 0],    // play at the net
  [7.0, 8.0, 'f', 2410, 26, 1.10, 1.22, 0],    // sunga close-up (product in use)
  [8.0, 14.0, 'f', 2655, 11, 1.25, 1.35, 0],   // (blurred background under the kit carousel)
  [14.0, 16.0, 'f', 2420, 16, 1.20, 1.32, 0],  // sunga close-up behind the sungas
  [16.0, 20.0, 'f', 3888, 24, 1.04, 1.12, 0],  // end card: shaka + smile
];
const SLOW_N = 76, MASK_F = [2586, 2603];

const cache = new Map();
function load(src) {
  if (!cache.has(src)) {
    const im = new Image(); im.src = src;
    cache.set(src, im.decode().then(() => im).catch(() => null));
    if (cache.size > 80) cache.delete(cache.keys().next().value);
  }
  return cache.get(src);
}
const pad = (n, k) => String(n).padStart(k, '0');
function frameSrc(seq, n) {
  if (seq === 's') { n = clamp(n, 1, SLOW_N); return [`slow/${pad(n, 4)}.jpg`, `mask_slow/${pad(n, 4)}.png`]; }
  return [`frames/${pad(n, 5)}.jpg`, (n >= MASK_F[0] && n <= MASK_F[1]) ? `mask/${pad(n, 5)}.png` : null];
}
const handheld = t => [5 * Math.sin(1.3 * t) + 2 * Math.sin(3.1 * t + 1), 5 * Math.sin(1.1 * t + 2) + 2 * Math.sin(2.7 * t)];
const shake = (t, a) => [a * (Math.sin(t * 41) * 0.6 + Math.sin(t * 23 + 1) * 0.4), a * (Math.sin(t * 33 + 2) * 0.6 + Math.sin(t * 19) * 0.4)];
const CUTS = SHOTS.map(s => s[0]).filter(x => x > 0);

// off-screen layer for the athlete cut-out (title sits between background and athlete)
const fg = document.createElement('canvas'); fg.width = W; fg.height = H; const fx = fg.getContext('2d');

async function footage(t, o = {}) {
  let si = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) si = i;
  const [t0, t1, seq, s0, rate, z0, z1, blend] = SHOTS[si];
  const fpos = s0 + (t - t0) * rate;
  const n = Math.floor(fpos);
  const [src, msrc] = frameSrc(seq, n);
  const img = await load(src);
  const img2 = blend ? await load(frameSrc(seq, n + 1)[0]) : null;
    let z = lerp(z0, z1, eio(prog(t, t0, t1)));
  z *= 1 + 0.08 * (1 - eout(prog(t, t0, t0 + 0.22))) * (si > 0 ? 1 : 0);      // punch-in on every cut
  if (t >= HIT) z *= 1 + 0.12 * (1 - eout(prog(t, HIT, HIT + 0.5)));           // impact zoom on the ball contact
  const [hx, hy] = handheld(t);
  let imp = 0;
  [[HIT, 26], [3.0, 18], [8.0, 10], [16.0, 8]].forEach(([a, m]) => { if (t >= a && t < a + 0.45) imp = Math.max(imp, m * (1 - prog(t, a, a + 0.45))); });
  const [sx, sy] = shake(t, imp);
  const tf = [540 + hx + sx, 960 + hy + sy, z];
  const draw = (c, im) => { c.save(); c.translate(tf[0], tf[1]); c.scale(tf[2], tf[2]); c.translate(-540, -960); c.drawImage(im, 0, 0, W, H); c.restore(); };
  ctx.save();
  ctx.filter = (o.blur ? `blur(${o.blur}px) ` : '') + 'contrast(1.08) saturate(1.14) brightness(' + (o.bright || 1) + ')';
  if (img) draw(ctx, img);
  if (img2) { ctx.globalAlpha = 0.4; draw(ctx, img2); }
  ctx.restore();
  const mask = (msrc && o.cutout) ? await load(msrc) : null;
  return { si, cut: mask && img ? () => {
    fx.clearRect(0, 0, W, H); fx.globalCompositeOperation = 'source-over';
    fx.filter = 'contrast(1.08) saturate(1.14)'; draw(fx, img); fx.filter = 'none';
    fx.globalCompositeOperation = 'destination-in'; draw(fx, mask); fx.globalCompositeOperation = 'source-over';
    ctx.drawImage(fg, 0, 0);
  } : null };
}

// ---------- typography ----------
function fitFont(str, weight, size, fam, maxW) {
  ctx.font = `${weight} ${size}px ${fam}`; const w = ctx.measureText(str).width;
  return w > maxW ? size * maxW / w : size;
}
function title(str, x, y, o = {}) {
  const { size = 120, color = '#fff', scale = 1, alpha = 1, maxW = 980, fam = 'Syne', weight = 800, align = 'center', shadow = 0.45, ls = 0 } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  const s = fitFont(str, weight, size, fam, maxW);
  ctx.font = `${weight} ${s}px ${fam}`; ctx.letterSpacing = ls + 'px';
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.shadowColor = `rgba(0,0,0,${shadow})`; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8; }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function chip(str, x, y, o = {}) {
  const { size = 40, alpha = 1, bg = Y, color = INK, scale = 1, fam = 'Inter', weight = 800, r = 14, padX = 28, padY = 18 } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${fam}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  const w = ctx.measureText(str).width + padX * 2, h = size + padY * 2;
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.fillStyle = color; ctx.fillText(str, 0, size * 0.04);
  ctx.restore();
  return w;
}
// kinetic caption for the montage: word slams in, yellow bar wipes under it
function slam(str, t, a, b, y = 1380) {
  if (t < a || t >= b) return;
  const p = eout(prog(t, a, a + 0.18)), out = prog(t, b - 0.12, b);
  const sc = lerp(1.35, 1, p), al = p * (1 - out);
  const s = fitFont(str, 800, 96, 'Syne', 940);
  ctx.save(); ctx.font = `800 ${s}px Syne`; const w = ctx.measureText(str).width; ctx.restore();
  const bw = (w + 60) * eout(prog(t, a + 0.06, a + 0.3));
  ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = Y; ctx.fillRect(540 - (w + 60) / 2, y + s * 0.42, bw, 16); ctx.restore();
  ctx.save(); ctx.filter = `blur(${(1 - p) * 10}px)`;
  title(str, 540, y, { size: s, scale: sc, alpha: al, maxW: 940 });
  ctx.restore();
}

// ---------- product cards ----------
const KITS = [['kit_phoenix', 'PHOENIX'], ['kit_everflame', 'EVER FLAME'], ['kit_void', 'VOID'], ['kit_shadow', 'SHADOW'], ['kit_pureblood', 'PURE BLOOD']];
const SUNGAS = [['sunga_futevolei', 'FUTEVÔLEI'], ['sunga_phoenix', 'PHOENIX'], ['sunga_everflame', 'EVER FLAME'], ['sunga_void', 'VOID']];
const IMG = {};
function card(key, cx, cy, w, h, o = {}) {
  const { alpha = 1, scale = 1, label, badge, rot = 0 } = o;
  if (alpha <= 0 || scale <= 0) return;
  const im = IMG[key];
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 34); ctx.fill();
  ctx.shadowColor = 'transparent';
  const ih = label ? h - 110 : h - 40, iw = w - 50;
  const k = Math.min(iw / im.width, ih / im.height);
  ctx.drawImage(im, -im.width * k / 2, -h / 2 + 24 + (ih - im.height * k) / 2, im.width * k, im.height * k);
  if (badge) {
    ctx.font = '800 26px Syne'; const bw = ctx.measureText(badge).width + 30;
    ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(-w / 2 + 24, -h / 2 + 24, bw, 46, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(badge, -w / 2 + 24 + bw / 2, -h / 2 + 48);
  }
  if (label) {
    ctx.fillStyle = INK; ctx.font = '800 40px Syne'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, h / 2 - 52);
  }
  ctx.restore();
}
function strikePrice(str, x, y, t, a, size = 44) {
  const p = pop(t, a); if (p <= 0) return;
  title(str, x, y, { size, fam: 'Inter', weight: 600, color: 'rgba(255,255,255,0.75)', scale: p, shadow: 0 });
  ctx.save(); ctx.font = `600 ${size}px Inter`; const w = ctx.measureText(str).width; ctx.restore();
  const sp = eout(prog(t, a + 0.15, a + 0.4));
  ctx.save(); ctx.strokeStyle = '#E53935'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - w / 2 - 6, y + 2); ctx.lineTo(x - w / 2 - 6 + (w + 12) * sp, y + 2); ctx.stroke(); ctx.restore();
}

function grain(t, a = 0.06) {
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  const ox = Math.floor((Math.sin(t * 91) * 0.5 + 0.5) * 256), oy = Math.floor((Math.cos(t * 77) * 0.5 + 0.5) * 256);
  ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(NOISE, 'repeat'); ctx.fillRect(0, 0, W + 512, H + 512);
  ctx.restore();
}
function vignette(a = 0.5) {
  const g = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function logo(x, y, w, alpha = 1) {
  if (alpha <= 0) return;
  const h = w * LOGO.height / LOGO.width;
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 20;
  ctx.drawImage(LOGO, x - w / 2, y - h / 2, w, h); ctx.restore();
}

async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // ===================== HOOK 0–3.0 =====================
  if (t < 3.0) {
    const f = await footage(t, { cutout: t < 2.2 });
    vignette(0.45);
    const out = eio(prog(t, 1.9, 2.2));            // titles fly up and away as he falls
    const hitP = t >= HIT ? 1 + 0.10 * (1 - eout(prog(t, HIT, HIT + 0.4))) : 1;
    const yOff = -260 * out;
    // behind the athlete
    if (out < 1) {
      title('ROUPAS DE', 540, 640 + yOff, { size: 104, scale: (t < 0.03 ? 1 : lerp(1.06, 1, eout(prog(t, 0, 0.5)))) * hitP, alpha: 1 - out, ls: 2 });
      title('FUTEVÔLEI', 540, 820 + yOff, { size: 230, color: Y, scale: (t < 0.03 ? 1 : lerp(1.08, 1, eout(prog(t, 0, 0.6)))) * hitP, alpha: 1 - out, maxW: 1010, shadow: 0.35 });
    }
    if (f.cut) f.cut();
    // in front of the athlete
    chip('com o atleta BRISA', 540, 470 + yOff, { size: 38, bg: '#fff', scale: (t < 0.03 ? 1 : pop(t, 0.0, 0.3)) * (1 - out), alpha: 1 - out, weight: 700 });
    chip('KITS COM ATÉ 34% OFF', 540, 1540, { size: 44, scale: pop(t, 0.35, 0.3) * (1 - eio(prog(t, 2.55, 2.85))), alpha: 1, fam: 'Syne' });
  }
  // ===================== MONTAGE 3.0–8.0 =====================
  else if (t < 8.0) {
    await footage(t);
    vignette(0.5);
    const g = ctx.createLinearGradient(0, 1150, 0, 1700); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g; ctx.fillRect(0, 1150, W, 550);
    slam('FEITA PRA AREIA', t, 3.0, 4.0);
    slam('TECIDO RESPIRÁVEL', t, 4.0, 5.0);
    slam('LEVE NO JOGO', t, 5.0, 6.0);
    slam('PERFORMANCE DE ATLETA', t, 6.0, 7.0);
    if (t >= 7.0) {
      const p = pop(t, 7.05, 0.35);
      logo(540, 1330, 420 * p, clamp(p));
      title('VISTA O JOGO', 540, 1480, { size: 56, scale: pop(t, 7.3), fam: 'Syne', ls: 6 });
    }
    logo(540, 330, 150, t < 7.0 ? 0.95 : 0);
  }
  // ===================== KITS 8.0–14.0 =====================
  else if (t < 14.0) {
    await footage(t, { blur: 26, bright: 0.38 });
    ctx.fillStyle = 'rgba(11,11,11,0.35)'; ctx.fillRect(0, 0, W, H);
    // brand glow
    const rg = ctx.createRadialGradient(540, 900, 50, 540, 900, 760); rg.addColorStop(0, 'rgba(255,204,41,0.22)'); rg.addColorStop(1, 'rgba(255,204,41,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    const exitP = eio(prog(t, 13.7, 14.0));
    ctx.save(); ctx.translate(-1100 * exitP, 0);
    chip('KITS COMPLETOS', 540, 345, { size: 34, scale: pop(t, 8.05), fam: 'Syne' });
    title('MANGA LONGA + MANGA', 540, 440, { size: 60, scale: pop(t, 8.15), ls: 1 });
    title('CURTA + SHORTS', 540, 512, { size: 60, scale: pop(t, 8.22), ls: 1 });
    // cover-flow carousel, advances on the beat
    const steps = [9.0, 10.0, 11.0, 12.0];
    let idx = 0; steps.forEach(s => idx += eio(prog(t, s - 0.25, s + 0.1)));
    const enter = eout(prog(t, 8.0, 8.5));
    const order = [];
    for (let i = 0; i < KITS.length; i++) order.push([i, i - idx]);
    order.sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
    for (const [i, d] of order) {
      if (Math.abs(d) > 1.6) continue;
      const ad = Math.abs(d);
      const cx = 540 + d * 470 + (1 - enter) * 900, sc = lerp(1, 0.66, clamp(ad)) * lerp(0.7, 1, enter);
      card(KITS[i][0], cx, 900, 600, 640, { scale: sc, alpha: lerp(1, 0.55, clamp(ad)) * enter, label: KITS[i][1], badge: '34% OFF', rot: d * 0.05 });
    }
    // price block
    strikePrice('de R$ 287,70', 540, 1310, t, 8.5);
    const pv = pop(t, 8.7, 0.32);
    title('R$ 189,70', 540, 1415, { size: 150, color: Y, scale: pv * (1 + 0.04 * Math.sin(Math.max(0, t - 9) * 6.28) * (t > 9 ? 1 : 0)) });
    chip('ou 3x de R$ 63,23 sem juros', 540, 1540, { size: 36, bg: '#fff', scale: pop(t, 9.0), weight: 700 });
    ctx.restore();
  }
  // ===================== SUNGAS 14.0–16.0 =====================
  else if (t < 16.0) {
    await footage(t, { bright: 0.9 });
    const g = ctx.createLinearGradient(0, 700, 0, 1700); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.45, 'rgba(0,0,0,0.75)'); g.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle = g; ctx.fillRect(0, 700, W, 1220);
    const inP = eout(prog(t, 14.0, 14.3));
    ctx.save(); ctx.translate(1100 * (1 - inP), 0);
    chip('E AS SUNGAS', 540, 345, { size: 34, scale: pop(t, 14.05), fam: 'Syne' });
    SUNGAS.forEach(([k, name], i) => {
      const cx = 165 + i * 250, p = pop(t, 14.15 + i * 0.1, 0.3);
      card(k, cx, 1110, 230, 210, { scale: p, rot: (i % 2 ? 0.04 : -0.04) });
    });
    strikePrice('de R$ 99,90', 540, 1300, t, 14.4, 40);
    title('R$ 69,90', 540, 1405, { size: 140, color: Y, scale: pop(t, 14.55, 0.3) });
    chip('30% OFF', 540, 1530, { size: 36, bg: '#fff', scale: pop(t, 14.75), fam: 'Syne' });
    ctx.restore();
  }
  // ===================== OFFER + CTA 16.0–20.0 =====================
  else {
    await footage(t);
    const g = ctx.createLinearGradient(0, 760, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.35, 'rgba(0,0,0,0.72)'); g.addColorStop(1, 'rgba(0,0,0,0.92)');
    ctx.fillStyle = g; ctx.fillRect(0, 760, W, H - 760);
    const tg = ctx.createLinearGradient(0, 200, 0, 560); tg.addColorStop(0, 'rgba(0,0,0,0.45)'); tg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tg; ctx.fillRect(0, 200, W, 360);
    logo(540, 360, 300 * pop(t, 16.05, 0.35), 1);
    title('10% OFF NA 1ª COMPRA', 540, 1005, { size: 76, scale: pop(t, 16.4), maxW: 960 });
    // coupon
    const cp = pop(t, 16.7);
    if (cp > 0) {
      ctx.save(); ctx.translate(540, 1120); ctx.scale(cp, cp);
      ctx.setLineDash([16, 12]); ctx.strokeStyle = Y; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.roundRect(-330, -52, 660, 104, 18); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,204,41,0.12)'; ctx.fill();
      ctx.restore();
      title('CUPOM  BEMVINDO10', 540, 1121, { size: 50, fam: 'Inter', weight: 800, scale: cp, color: Y, shadow: 0, ls: 1 });
    }
    title('3x sem juros  •  5% OFF no Pix', 540, 1240, { size: 38, fam: 'Inter', weight: 600, scale: pop(t, 17.0), shadow: 0.3 });
    // CTA
    const bp = pop(t, 17.3, 0.35);
    if (bp > 0) {
      const pulse = 1 + 0.035 * Math.sin((t - 17.65) * 7.5) * clamp((t - 17.65) * 3);
      ctx.save(); ctx.translate(540, 1395); ctx.scale(bp * pulse, bp * pulse);
      ctx.shadowColor = 'rgba(255,204,41,0.55)'; ctx.shadowBlur = 50; ctx.fillStyle = Y;
      ctx.beginPath(); ctx.roundRect(-420, -70, 840, 140, 70); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.fillStyle = INK; ctx.font = '800 50px Syne'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('COMPRE NO SITE  →', 0, 3); ctx.restore();
    }
    title('lojasandwalk.com.br', 540, 1530, { size: 40, fam: 'Inter', weight: 700, scale: pop(t, 17.6), shadow: 0.3 });
    const ap = pop(t, 17.9, 0.3);
    if (ap > 0) {
      const ay = 1625 + Math.abs(Math.sin((t - 17.9) * 5)) * 20;
      ctx.save(); ctx.globalAlpha = clamp(ap); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(540 - 32, ay - 22); ctx.lineTo(540 + 32, ay - 22); ctx.lineTo(540, ay + 16); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  // flashes on the impact and on section changes
  let fl = 0;
  [[HIT, 0.85], [3.0, 0.55], [8.0, 0.45], [14.0, 0.3], [16.0, 0.35]].forEach(([a, m]) => { const p = prog(t, a - 0.005, a + 0.22); if (p > 0 && p < 1) fl = Math.max(fl, m * (1 - eout(p))); });
  if (fl > 0) { ctx.fillStyle = `rgba(255,248,225,${fl})`; ctx.fillRect(0, 0, W, H); }
  grain(t);
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fillRect(0, H - 10, W, 10);
  ctx.fillStyle = Y; ctx.fillRect(0, H - 10, W * (t / DUR), 10);
}

let LOGO, NOISE;
window.ready = (async () => {
  LOGO = await load('build/logo_white.svg');
  for (const [k] of [...KITS, ...SUNGAS]) IMG[k] = await load(`prod/${k}.jpg`);
  NOISE = document.createElement('canvas'); NOISE.width = NOISE.height = 256;
  const nx = NOISE.getContext('2d'), id = nx.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  nx.putImageData(id, 0, 0);
  for (const f of ['800 40px Syne', '700 40px Syne', '600 40px Inter', '700 40px Inter', '800 40px Inter']) await document.fonts.load(f);
  await document.fonts.ready; await render(0); return true;
})();
window.renderAt = t => render(t);
</script>
</body>
